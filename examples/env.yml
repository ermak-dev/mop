# ENV-ФАЙЛЫ ПРОЕКТОВ — родовой транспорт, без проектного знания (#30/#25).
# ИМЕНА файлов объявляет сам проект в mop.yaml (конвенция env_files в vars);
# БАЙТЫ отсюда: секреты в git не попадают, и из origin их привезти нельзя.
# Источник — рабочая копия проекта на управляющей машине (~/<шард>/);
# врапер копирует их из ~/puppet-env/<шард> в каждый заводимый клон.
#
# На host-узлах список приезжает с deploy (mop_env_files, вырезан из
# манифестов на мастере), в образ шарда — с `mop driver build`.
#
# Подключается настройкой MOP_BODY_EXTRA, после setup.yml. Файл ждёт
# become: yes от вызывающего — как и прочие установочные.
#
# Run:  mop deploy

- name: puppet-env dir of each shard that asked for env files
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/puppet-env/{{ item.shard }}"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0700'
  loop: "{{ mop_env_files | default([]) }}"
  loop_control:
    label: "{{ item.shard }}"

- name: Project env files, named by the project itself
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/{{ item.shard }}/{{ item.file }}"
    dest: "{{ MOP_HOME }}/puppet-env/{{ item.shard }}/"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0600'
  loop: "{{ mop_env_files | default([]) }}"
  loop_control:
    label: "{{ item.shard }}/{{ item.file }}"
