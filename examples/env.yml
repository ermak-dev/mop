# ENV-ФАЙЛЫ ПРОЕКТОВ — дело УСТАНОВКИ, а не манифеста (#25): их
# принципиально нет в git (секреты), и из origin манифест их привезти не
# может. Источник — рабочие копии на управляющей машине; врапер копирует их
# из ~/puppet-env/<проект> в каждый заводимый клон.
#
# Подключается настройкой MOP_BODY_EXTRA, после setup.yml. Файл ждёт
# become: yes от вызывающего — как и прочие установочные.
#
# Run:  mop deploy

- name: puppet-env dir for rugent
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/puppet-env/rugent"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0700'

- name: Project env files of rugent
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ MOP_HOME }}/puppet-env/rugent/"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0600'
  loop:
    - ~/rugent/.env
    - ~/rugent/.env-prod
    - ~/rugent/.providers

- name: puppet-env dir for cloudpub
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/puppet-env/cloudpub"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0700'

- name: Project env files of cloudpub
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ MOP_HOME }}/puppet-env/cloudpub/"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0600'
  loop:
    - ~/cloudpub/.env
