---
# ПРИМЕР, НЕ ЧАСТЬ ПРОДУКТА. Обвязка автора: его личные скиллы и MCP-серверы
# автоматизации рабочего стола. Пулу mop ничего из этого не нужно — пакет,
# зависимости и агент ставит deploy/setup.yml, а свой MCP-сервер папету
# прописывает врапер при каждой загрузке.
#
# Сами задачи живут в body-claude.yml: это окружение ТЕЛА, и его же печёт в
# образ шарда `mop driver build`.
#
# Run:  mop deploy

- name: Claude skills and MCP servers in the puppet bodies
  hosts: puppet
  become: no
  gather_facts: no

  tasks:
    # Узел, чьи тела — контейнеры, всего этого не получает: скиллы и MCP-серверы
    # пишутся в ~/.claude сессии папета, а её на таком узле нет. Кладёт их туда
    # сборка образа.
    - name: A node that is not its own body gets none of this
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'host'

    - name: Skills and MCP servers of this installation
      ansible.builtin.include_tasks: body-claude.yml
