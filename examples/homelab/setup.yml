---
# Окружение узлов пула — УСТАНОВКА АВТОРА, продуктом не являющаяся.
#
# Сам mop ставится двумя плейбуками в deploy/: кластер Nomad (deploy/nomad) и
# шина с агентом (deploy/setup.yml). Ни тот, ни другой не знают, какие проекты
# в пуле собираются и чем. Здесь — знают: postgres и redis для тестов cloudpub,
# тулчейн Rust, node с yarn, env-файлы проектов, сторож диска для cargo.
#
# Как инструкция это не годится — только как образец того, что вообще бывает
# нужно узлу сверх голого Nomad. У вас список будет другим.
#
# Запуск:  mop deploy homelab

- name: Ночной сторож диска
  hosts: mop_server
  become: no
  gather_facts: no

  vars:
    nomad_home: "{{ MOP_NOMAD_DATA | dirname }}"

  tasks:
    # см. sl-cleanup.nomad.hcl.
    # template, а не copy: спека несёт значения установки (датацентр, пользователь,
    # $HOME). ${...} для этого не годится -- это интерполяция HCL, Nomad стал бы
    # разрешать её сам и не нашёл бы переменной.
    - name: Deploy the sl-cleanup job spec
      ansible.builtin.template:
        src: sl-cleanup.nomad.hcl.j2
        dest: "{{ nomad_home }}/sl-cleanup.nomad.hcl"
        mode: '0644'
      register: cleanup_spec

    - name: Check the sl-cleanup job is registered
      ansible.builtin.shell: >
        NOMAD_ADDR=http://127.0.0.1:{{ MOP_NOMAD_PORT }}
        NOMAD_TOKEN=$(python3 -c "import json; print(json.load(open('{{ nomad_home }}/bootstrap.json'))['SecretID'])")
        /usr/local/bin/nomad job status sl-cleanup
      register: cleanup_status
      failed_when: false
      changed_when: false

    - name: Register the sl-cleanup job
      ansible.builtin.shell: >
        NOMAD_ADDR=http://127.0.0.1:{{ MOP_NOMAD_PORT }}
        NOMAD_TOKEN=$(python3 -c "import json; print(json.load(open('{{ nomad_home }}/bootstrap.json'))['SecretID'])")
        /usr/local/bin/nomad job run {{ nomad_home }}/sl-cleanup.nomad.hcl
      when: cleanup_spec.changed or cleanup_status.rc != 0


- name: Тулчейн и окружение проектов на узлах пула
  hosts: nomad_clients
  become: yes
  gather_facts: no

  vars:
    nextest_version: 0.9.98
    # Project env files a fresh clone cannot invent: the slave wrapper copies
    # these from ~/slave-env/<project>/ into every clone it creates, the same way
    # ~/bin/code seeds worktrees on mate. Sources live on the control machine.
    slave_env_files:
      - {project: rugent, file: ~/rugent/.env}
      - {project: rugent, file: ~/rugent/.env-prod}
      - {project: rugent, file: ~/rugent/.providers}
      - {project: cloudpub, file: ~/cloudpub/.env}

  tasks:
    # postgresql: rug test creates a per-run database via `sudo -u postgres`;
    # cmake: cloudpub's libz-ng-sys builds zlib-ng with it; the gtk/webkit dev
    # set: cloudpub's workspace includes a Tauri gui crate, and `clo test
    # --rust` builds the whole graph.
    - name: Ensure slave toolchain packages
      ansible.builtin.apt:
        name:
          - postgresql
          - cmake
          - pkg-config
          - libglib2.0-dev
          - libgtk-3-dev
          - libwebkit2gtk-4.1-dev
          - librsvg2-dev
          - libsoup-3.0-dev
          # the rest of cloudpub's own build image (Dockerfile), minus the
          # cross-compilers its release builds use
          - protobuf-compiler
          - file
          - libcap2-bin
          - libxml2
          - media-types
        state: present

    - name: Ensure postgres is running
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Ensure ~/.cargo/bin exists
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.cargo/bin"
        state: directory
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: '0755'

    - name: Install cargo-nextest {{ nextest_version }}
      ansible.builtin.unarchive:
        src: "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-{{ nextest_version }}/cargo-nextest-{{ nextest_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "{{ MOP_HOME }}/.cargo/bin"
        remote_src: yes
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: '0755'
        creates: "{{ MOP_HOME }}/.cargo/bin/cargo-nextest"

    # cargo-sweep: the size cap sl-sweep applies to a LIVE slave's target dir.
    # An age gate cannot stand in for it -- cargo rewrites fingerprints on every
    # build, so an actively built target dir never looks old (0 of 34,509 files
    # older than 3 days in a 48 GB dir; see ~/bin/cleanup). Built from source
    # rather than pinned to a release tarball: cargo-sweep ships no linux-gnu
    # binary in its releases, and it compiles in about half a minute.
    - name: Install cargo-sweep (size cap for sl-sweep tier 3)
      ansible.builtin.command: "{{ MOP_HOME }}/.cargo/bin/cargo install cargo-sweep --locked"
      become_user: "{{ MOP_USER }}"
      args:
        creates: "{{ MOP_HOME }}/.cargo/bin/cargo-sweep"

    - name: Deploy the sl-sweep script (run nightly by the sl-cleanup job)
      ansible.builtin.copy:
        src: sl-sweep.sh
        dest: /usr/local/bin/sl-sweep
        mode: '0755'

    # --- cloudpub integration-test environment ---------------------------
    # The subset of cloudpub's bin/docker-test that the rust integration
    # suite needs: trusted local postgres with a cloudpub superuser role, a
    # ru_RU test database, pg_trgm inherited via template1, redis, and
    # cloudpub.local resolving to loopback. (rug test needs none of this: it
    # provisions its own role and per-run database via `sudo -u postgres`.)
    - name: Ensure redis is present
      ansible.builtin.apt:
        name: redis-server
        state: present

    - name: Ensure redis is running
      ansible.builtin.systemd:
        name: redis-server
        state: started
        enabled: yes

    - name: Ensure ru_RU.UTF-8 locale exists (test database locale)
      ansible.builtin.command: locale-gen ru_RU.UTF-8
      register: locale_gen
      changed_when: "'done' in locale_gen.stdout"

    - name: Trust local postgres auth (clo tooling connects as -U cloudpub)
      ansible.builtin.replace:
        # Ubuntu 24.04 => postgresql 16 on every node
        path: /etc/postgresql/16/main/pg_hba.conf
        regexp: '^(local\s+all\s+all\s+)peer$'
        replace: '\1trust'
      register: pg_hba

    - name: Reload postgres auth config
      ansible.builtin.systemd:
        name: postgresql
        state: reloaded
      when: pg_hba.changed

    - name: Create cloudpub role (superuser -- the test framework drops and creates databases)
      ansible.builtin.shell: >
        [ -n "$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='cloudpub'")" ]
        || { sudo -u postgres psql -c "CREATE ROLE cloudpub SUPERUSER LOGIN PASSWORD 'cloudpub'"; echo CREATED; }
      register: pg_role
      changed_when: "'CREATED' in pg_role.stdout"

    - name: Create pg_trgm in template1 (inherited by every test-created database)
      ansible.builtin.command: sudo -u postgres psql -d template1 -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
      changed_when: false

    - name: Create test_cloudpub database
      ansible.builtin.shell: >
        [ -n "$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='test_cloudpub'")" ]
        || { sudo -u postgres createdb -O cloudpub --template=template0
        --encoding=UTF8 --locale=ru_RU.UTF-8 test_cloudpub; echo CREATED; }
      register: pg_db
      changed_when: "'CREATED' in pg_db.stdout"

    - name: Resolve cloudpub.local to loopback
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 cloudpub.local"
        regexp: 'cloudpub\.local'

    # node for cloudpub's frontend/e2e test sets, per BUILD.md: nvm + 22.12.0 (BUILD.md says 22.11.0, but server/Dockerfile pins
    # NODE_VERSION=22.12.0 and vite refuses anything older).
    # Per-user install under the pool user -- the same account the slaves run as.
    - name: Install nvm
      become_user: "{{ MOP_USER }}"
      ansible.builtin.shell: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
      args:
        creates: "{{ MOP_HOME }}/.nvm/nvm.sh"

    - name: Install node 22.12.0
      become_user: "{{ MOP_USER }}"
      ansible.builtin.shell: . ~/.nvm/nvm.sh && nvm install 22.12.0 && nvm alias default 22.12.0
      args:
        creates: "{{ MOP_HOME }}/.nvm/versions/node/v22.12.0"
        executable: /bin/bash

    - name: Install yarn
      become_user: "{{ MOP_USER }}"
      ansible.builtin.shell: . ~/.nvm/nvm.sh && npm install -g yarn
      args:
        creates: "{{ MOP_HOME }}/.nvm/versions/node/v22.12.0/bin/yarn"
        executable: /bin/bash

    - name: Create slave-env project dirs
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/slave-env/{{ item }}"
        state: directory
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: '0700'
      loop: "{{ slave_env_files | map(attribute='project') | unique }}"

    - name: Distribute project env files
      ansible.builtin.copy:
        src: "{{ item.file }}"
        dest: "{{ MOP_HOME }}/slave-env/{{ item.project }}/"
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: '0600'
      loop: "{{ slave_env_files }}"
