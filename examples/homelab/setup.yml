---
# Окружение узлов пула — УСТАНОВКА АВТОРА, продуктом не являющаяся.
#
# Сам mop ставится двумя плейбуками в deploy/: кластер Nomad (deploy/nomad) и
# шина с агентом и дисковым сторожем (deploy/setup.yml). Ни тот, ни другой не
# знают, какие проекты в пуле собираются и чем. Здесь — знают: postgres и
# redis для тестов cloudpub, тулчейн Rust, node с yarn, env-файлы проектов.
#
# Игра делится ровно там же, где делится система: сначала УЗЛОВОЕ (ключ к git,
# которым узел сеет доступ в свои тела), потом отсечка, потом ТЕЛЕСНОЕ —
# отдельным файлом body-tasks.yml, потому что его же печёт в образ шарда
# `mop driver build`.
#
# Как инструкция это не годится — только как образец того, что вообще бывает
# нужно узлу и телу сверх голого Nomad. У вас список будет другим.
#
# Запуск:  mop deploy

- name: Тулчейн и окружение проектов на узлах пула
  hosts: puppet
  become: yes
  gather_facts: no

  vars:
    # Origin шардов этого пула. Клон папета ходит на него по ssh, и узел обязан
    # знать и ключ хоста, и чем представиться. Остальные значения установки
    # уехали в body-tasks.yml -- туда, где ими пользуются.
    git_host: git.ermak.dev

  tasks:
    # Клон заводит сам папет, по ssh, ДО claude -- и без ключа и доверенного
    # host key падает на `Host key verification failed` с кодом 128, а Nomad
    # уводит аллокацию в рестарт с получасовым backoff. Поймано на свежем узле:
    # deploy зелёный, узел выглядит настроенным, папет не поднимается вовсе.
    # На старых узлах ключ лежал от личной раскатки хозяина, поэтому промах и
    # не проявлялся.
    - name: SSH dir of the pool user
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.ssh"
        state: directory
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: '0700'

    - name: Git identity of the pool user
      ansible.builtin.copy:
        src: "{{ lookup('env', 'HOME') }}/.ssh/{{ item.name }}"
        dest: "{{ MOP_HOME }}/.ssh/{{ item.name }}"
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: "{{ item.mode }}"
      loop:
        - {name: id_rsa, mode: '0600'}
        - {name: id_rsa.pub, mode: '0644'}
      loop_control:
        label: "{{ item.name }}"

    # Ключ хоста снимаем с управляющей машины и кладём явно: интерактивного
    # «yes» в клоне из-под Nomad ввести некому, а StrictHostKeyChecking=no
    # означал бы клон откуда угодно.
    - name: Host key of the git server
      delegate_to: localhost
      become: no
      run_once: yes
      ansible.builtin.command: ssh-keyscan -t ed25519 {{ git_host }}
      register: git_hostkey
      changed_when: false

    - name: Trust the git host key
      ansible.builtin.known_hosts:
        path: "{{ MOP_HOME }}/.ssh/known_hosts"
        name: "{{ git_host }}"
        key: "{{ git_hostkey.stdout_lines | reject('match', '^#') | first }}"
        state: present
      become_user: "{{ MOP_USER }}"

    # ВЫШЕ ОТСЕЧКИ, и это не порядок ради порядка. Ключ нужен УЗЛУ с любым
    # драйвером: узел, который сам телом не бывает, всё равно сеет .ssh/id_rsa
    # и .ssh/known_hosts внутрь каждого своего тела (MOP_BODY_SEED,
    # mop/driver/pve.py). Пока отсечка стояла выше, первый же pve-узел остался
    # без ключа: deploy зелёный, узел выглядит настроенным, а папет падает на
    # `git clone` -- ровно тот отказ, про который написано пятью строками выше,
    # только на другом узле. Ключ пришлось класть руками.

    # Это окружение ПАПЕТА, а не узла: на узле, чьи тела —
    # контейнеры, оно должно стоять В ТЕЛЕ, и кладёт его туда
    # сборка образа (mop driver build), а не этот прогон.
    - name: A node that is not its own body gets none of this
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'host'

    - name: What a body of this installation must be
      ansible.builtin.include_tasks: body-tasks.yml
