# Проверки mop (#678): единственная обязательная комбинация — Python 3.12
# и PostgreSQL 17. Полный строгий suite и web/dist проверяются одним test job.
# Django runner создаёт отдельные пустые БД для изолированных прогонов.
#
# Раннер -- shell-исполнитель `builder` с тегом docker, под непривилегированным
# пользователем: image: он не видит, и шаги задачи шли бы на самом хосте
# (так и было: apt-get без прав, красное за 1-2 с). Поэтому задача -- один
# `docker run`, как у rugent: всё, что требует root (apt, pip, useradd),
# идёт внутри контейнера, а хост раннера только монтирует checkout.
#
# Docker, а не рабочая копия: в образе всегда все библиотеки, и SKIPPED от
# недостающей (#220: без jinja2 рендер юнитов пропускался, код 0) не
# выглядит зелёным; пустой HOME -- та изоляция, за которую воевал #217; а
# shell-раннер на контроллере отдал бы каждому push'у токен Nomad, сиды NATS
# и .env установки. В контейнер едут только объявленные check-команды и
# синтетические fixture inputs — ни окружения раннера, ни секретов установки,
# ни шагов deploy.
#
# MOP_TESTS_STRICT=1 -- контракт #229: под ней любой SKIPPED -- отказ.
#
# Выкладка (#240): зелёный master раскатывает установку сам. builder ходит
# по ssh на сервер mop отдельным ключом, и на сервере у этого ключа в
# authorized_keys `restrict,from="…",command="…"` -- принудительная команда
# `mop deploy --from-ci` (#239): клиент не шлёт никакой команды, решает
# сервер, и ключ не умеет ничего, кроме как раскатить зелёный master. Ключ,
# known_hosts и адрес -- защищённые переменные CI установки: их видят только
# конвейеры защищённой ветки master, ветки папетов -- никогда. В репозитории
# нет ни хоста, ни ключа: копия проекта в другом месте задачи просто не видит.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

stages: [test, deploy]

.tests:
  stage: test
  tags: [docker]
  variables:
    MOP_TESTS_STRICT: "1"
    # Каждый файл tests/ (hermetic.py среди них) -- той же командой, что у
    # людей и папетов (#271): упавшие -- с выводом, итог строкой, код 1 при
    # любом красном. -v -- строка на файл в журнале задачи. Полный suite
    # идёт непривилегированным ci; root-only UID gate #674 прогоняется
    # SETUP'ом выше под root, в этом списке его нет.
    TESTS:
      value: bin/mop dev test -v
      expand: false
    # Внутри контейнера, под root:
    #   git -- клоны во временных каталогах (agent, manifest); openssl --
    #   закреплённый сертификат (creds), без него проверка молча не идёт;
    #   jq -- им врапер пишет файл хуков claude (spec, #223), как в теле;
    #   библиотеки mop -- одним списком из mop/common/deps.py, тем же, что ставит
    #   deploy, плюс jinja2, которым проверки рендерят шаблоны ролей;
    #   непривилегированный ci с пустым домом: проверки не видят ни root'а,
    #   ни чужого ~/.config/mop.
    SETUP:
      value: |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends git openssl jq curl ca-certificates tmux libstdc++6 libatomic1 >/dev/null
        # python-ldap серверного extra (#693) -- только sdist: компилятор и
        # заголовки libldap/libsasl2 для pip wheel ниже.
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends gcc libc6-dev libldap-dev libsasl2-dev >/dev/null
        export PATH="/opt/mop-node/bin:$PATH"
        # Native backup/restore использует matching-major клиент PostgreSQL 17.
        # Пакет берётся из подписанного upstream apt repo.
        install -d /usr/share/postgresql-common/pgdg
        curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
        printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt trixie-pgdg main' > /etc/apt/sources.list.d/pgdg.list
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends "postgresql-client-$POSTGRES_MAJOR" >/dev/null
        export PATH="/usr/lib/postgresql/$POSTGRES_MAJOR/bin:$PATH"
        # Один набор wheels для runner и чистых client venv: декларации
        # остаются в package metadata, но дочерние проверки не зависят от
        # повторной сетевой установки тех же библиотек в каждом новом HOME.
        pip wheel -q --disable-pip-version-check --wheel-dir /opt/mop-wheels '.[server]' jinja2 'setuptools>=64'
        pip install -q --root-user-action=ignore --disable-pip-version-check --no-index --find-links /opt/mop-wheels 'mop[server]' jinja2
        export PIP_NO_INDEX=1 PIP_FIND_LINKS=/opt/mop-wheels
        # Только новая owned Docker fixture: отдельный uid и Unix executor.
        python3 tests/_build_uid_fixture.py
        for attempt in $(seq 1 60); do
          pg_isready -h postgres -U mop_ci && break
          test "$attempt" -lt 60
          sleep 1
        done
        useradd --home-dir /tmp/ci-home ci
        install -d -o ci -m 0700 /tmp/ci-home
        chown -R ci /io /tmp/ci-home
        # #674: единственный root-шаг прогона. Под root гоняется узкий gate
        # двух настоящих cross-UID случаев #669 (пара root/nobody уже есть в
        # образе) -- реальный SO_PEERCRED двух OS-пиров и настоящий
        # PostgreSQL, не мок. Весь остальной прогон -- непривилегированным
        # ci строкой ниже; отказ gate красит job до начала suite.
        python3 tests/_credential_uid_fixture.py
        exec su ci -s /bin/bash -c "$TESTS"
      expand: false
  script:
    # Отдельная сеть и БД каждой задачи: никаких credentials установки.
    - docker network create "mop-ci-$CI_JOB_ID"
    - >-
      docker run --rm -d --name "mop-ci-db-$CI_JOB_ID"
      --network "mop-ci-$CI_JOB_ID" --network-alias postgres
      -e POSTGRES_DB=mop_ci -e POSTGRES_USER=mop_ci
      -e POSTGRES_PASSWORD=isolated-test-only "$POSTGRES_IMAGE"
      bash -euc 'openssl req -x509 -newkey rsa:2048 -nodes -days 2
      -subj /CN=postgres -addext subjectAltName=DNS:postgres
      -keyout /tmp/mop-test-server.key -out /tmp/mop-test-server.crt >/dev/null 2>&1;
      chmod 600 /tmp/mop-test-server.key;
      chown postgres:postgres /tmp/mop-test-server.key /tmp/mop-test-server.crt;
      exec docker-entrypoint.sh postgres -c ssl=on
      -c ssl_cert_file=/tmp/mop-test-server.crt -c ssl_key_file=/tmp/mop-test-server.key'
    - >-
      docker exec "mop-ci-db-$CI_JOB_ID" bash -ec
      'for attempt in $(seq 1 60); do test -s /tmp/mop-test-server.crt && pg_isready -U mop_ci && exit 0; sleep 1; done; exit 1'
    - docker cp "mop-ci-db-$CI_JOB_ID:/tmp/mop-test-server.crt" "$CI_PROJECT_DIR/.test-postgres-ca.pem"
    # Native TLS/ACL broker запускается только тестом в owned runner namespace.
    - mkdir "/tmp/mop-ci-nats-$CI_JOB_ID"
    - docker create --name "mop-ci-nats-image-$CI_JOB_ID" nats:2.10.26
    # Из Node image берём только toolchain: все mop-команды работают на Python 3.12.
    - mkdir "/tmp/mop-ci-node-$CI_JOB_ID"
    - mkdir -p "/tmp/mop-ci-node-$CI_JOB_ID/bin" "/tmp/mop-ci-node-$CI_JOB_ID/lib/node_modules"
    - docker create --name "mop-ci-node-image-$CI_JOB_ID" "$NODE_IMAGE"
    - docker cp "mop-ci-node-image-$CI_JOB_ID:/usr/local/bin/node" "/tmp/mop-ci-node-$CI_JOB_ID/bin/node"
    - docker cp "mop-ci-node-image-$CI_JOB_ID:/usr/local/lib/node_modules/npm" "/tmp/mop-ci-node-$CI_JOB_ID/lib/node_modules/"
    - ln -s ../lib/node_modules/npm/bin/npm-cli.js "/tmp/mop-ci-node-$CI_JOB_ID/bin/npm"
    - ln -s ../lib/node_modules/npm/bin/npx-cli.js "/tmp/mop-ci-node-$CI_JOB_ID/bin/npx"
    - chmod -R a+rX "/tmp/mop-ci-node-$CI_JOB_ID"
    - docker cp "mop-ci-nats-image-$CI_JOB_ID:/nats-server" "/tmp/mop-ci-nats-$CI_JOB_ID/nats-server"
    - |
      export PYTHON_TESTS="$TESTS"
      export TESTS='
      python_status=0
      bash -c "$PYTHON_TESTS" || python_status=$?
      web_status=0
      bash -c "$CHECK" || web_status=$?
      if [ "$python_status" -ne 0 ] || [ "$web_status" -ne 0 ]; then
        exit 1
      fi'
      docker run --rm --network "mop-ci-$CI_JOB_ID" \
        -v "$CI_PROJECT_DIR:/io" -w /io \
        -v mop-ci-pip:/root/.cache/pip \
        -v mop-ci-npm:/tmp/ci-home/.npm \
        -v "/tmp/mop-ci-nats-$CI_JOB_ID:/opt/mop-nats:ro" \
        -v "/tmp/mop-ci-node-$CI_JOB_ID:/opt/mop-node:ro" \
        -e MOP_TEST_NATS_BINARY=/opt/mop-nats/nats-server \
        -e MOP_TESTS_STRICT -e TESTS -e PYTHON_TESTS -e CHECK -e POSTGRES_MAJOR -e MOP_TEST_POSTGRES_HOST=postgres \
        "$PYTHON_IMAGE" bash -euc "$SETUP"
  after_script:
    - docker rm -f "mop-ci-db-$CI_JOB_ID" || true
    - docker rm -f "mop-ci-nats-image-$CI_JOB_ID" || true
    - docker rm -f "mop-ci-node-image-$CI_JOB_ID" || true
    - rm -rf "/tmp/mop-ci-nats-$CI_JOB_ID"
    - rm -rf "/tmp/mop-ci-node-$CI_JOB_ID"
    - docker network rm "mop-ci-$CI_JOB_ID" || true
    # И при отказе: контейнер оставил checkout чужим (ci, root), и
    # следующая задача раннера его бы не вычистила -- отдаём пользователю
    # раннера, как rugent.
    - docker run --rm -v "$CI_PROJECT_DIR:/io" alpine chown -R "$(id -u):$(id -g)" /io

test:py3.12:
  extends: .tests
  variables:
    # Оба обязательных gate исполняются в этом job даже при красном другом:
    # полный непривилегированный suite (TESTS) и узкий root-only UID gate
    # #674 из SETUP. Каждый отказ красит job.
    TESTS: bin/mop dev test -v
    PYTHON_IMAGE: python:3.12-slim-trixie
    POSTGRES_IMAGE: postgres:17-bookworm
    POSTGRES_MAJOR: "17"
    # Node нужен только frontend-гейтам; Python compatibility остаётся 3.12.
    NODE_IMAGE: node:22-bookworm
    # Все три frontend-гейта (#678): build --check, types и полный Vitest.
    # Каждый со своим кодом -- без fail-fast: ранний отказ web-команд не
    # должен скрывать остальные, красит любой.
    CHECK:
      value: |
        web_build_status=0
        bin/mop dev web build --check || web_build_status=$?
        web_types_status=0
        bin/mop dev web test --types || web_types_status=$?
        web_tests_status=0
        bin/mop dev web test || web_tests_status=$?
        test "$web_build_status" -eq 0 && test "$web_types_status" -eq 0 && test "$web_tests_status" -eq 0
      expand: false

deploy:mop:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $MOP_DEPLOY_TARGET
  tags: [docker]
  needs: [test:py3.12]
  # Одна выкладка за раз: два master'а подряд не раскатываются внахлёст.
  resource_group: mop-deploy
  variables:
    DEPLOY_KEY: "$CI_BUILDS_DIR/mop-deploy-$CI_JOB_ID.key"
  script:
    # Ключ -- копией 0600: ssh отвергает ключ, открытый другим, а права
    # файла переменной решает раннер.
    - (umask 077 && cp "$MOP_DEPLOY_SSH_KEY" "$DEPLOY_KEY")
    - chmod 600 "$DEPLOY_KEY"
    # Без удалённой команды: её задаёт сервер (command= в authorized_keys).
    # Отказ ssh или deploy -- отказ задачи.
    - >-
      ssh -T -i "$DEPLOY_KEY" -o IdentitiesOnly=yes -o BatchMode=yes
      -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$MOP_DEPLOY_KNOWN_HOSTS"
      "$MOP_DEPLOY_TARGET"
  after_script:
    # И при отказе: копия ключа не переживает задачу.
    - rm -f "$DEPLOY_KEY"
