# Узел-гипервизор: тело папета — контейнер LXC, а не сам узел (docs/DRIVER.md).
---
mop_driver: pve

# Память под чужих жильцов машины: планировщик считает её неразмещаемой.
# hyper — гипервизор, и на нём же стоят боевые VM; арифметика в docs/DRIVER.md.
mop_reserved_mb: 87822

# Потолки на ОДНО ТЕЛО. Проект вправе попросить меньше своим .mop, больше —
# нет: просит чужой репозиторий, а решает машина, на которой тело встанет.
mop_body_mem_cap_mb: 8192
mop_body_disk_cap_gb: 50
