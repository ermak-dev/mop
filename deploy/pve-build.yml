---
# Образ проекта: `mop driver build <проект> [--fresh]`.
#
# Сборочное тело → то, чем обязано быть любое тело (роль body) → пакет mop →
# файлы установки и манифест проекта → остановить → на место образа. Дальше
# каждое тело папета — клон этого образа: на lvm-thin связанный и мгновенный.
#
# Инкрементально (#60). Сборочное тело — ПОЛНАЯ копия нынешнего образа, и
# плейбук в нём играется идемпотентно: creates, state=present, сверки версий
# — качается только новое. Раньше сборка начиналась со сноса образа и тянула
# всё заново (claude CLI 234 МБ, chromium 658 МБ, rustup, ffmpeg): 40-90
# минут по каналу 22.09, четыре раза за день, а обрыв посередине оставлял
# проект вообще без образа. Теперь старый образ стоит, пока новый не готов.
#
# Почему копия, а не снятие флага шаблона: `pct set --template 0` флаг
# снимает, но том образа остаётся базовым (base-*, read-only, k-флаг
# активации) — контейнер не стартует, и обратно в шаблон не превращается.
# Проверено на hyper 22.09 одноразовым контейнером.
#
# Цена инкремента названа: чистоты он не даёт — то, чего в плейбуке уже
# нет, в образе останется. За этим `--fresh`: сборочное тело из базового
# образа, всё заново. И тела проекта на этом узле сносятся до сборки (это
# делает `mop driver build` на управляющей машине, mop/image.py): у образа с
# живым клоном не отнять место.
#
# Обрыв посередине: сборочное тело стоит под своим именем, и следующий
# прогон ПРОДОЛЖАЕТ в нём — восстановление одной командой, той же.
#
# Сборкой, а не подъёмом на месте. Поднимать тело из базового образа и гонять
# плейбук при каждом `ensure` соблазнительно — одним механизмом меньше, — но
# тогда падение плейбука видно в три часа ночи внутри врапера, и выглядит оно
# как «папет не поднимается».
#
# Ключ сборки. Тело стоит в своей сети за NAT узла, и управляющая машина
# достаёт до него только через сам узел (ProxyJump). Значит для сборки ей
# нужен ключ, которого у тела иначе нет. Ключ этот временный: он кладётся
# рядом с ключом узла на время сборки и снимается перед тем, как образ
# запечатан. Постоянного ключа мастера в образе нет — он был бы второй дорогой
# к телу, мимо единственного места, где проверяется проектирование.
#
# Run:  mop driver build <проект> [--fresh] [--force]

- name: Bake the project's image on the Proxmox nodes
  hosts: puppet
  become: no
  gather_facts: no

  vars:
    pve: "sudo -n /usr/local/sbin/mop-pve"
    build_key: "{{ lookup('env', 'HOME') }}/.config/mop/body-build"

  tasks:
    - name: Only a node whose bodies are containers has an image to build
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'pve'

    - name: A project must be named
      ansible.builtin.assert:
        that: mop_project | default('') | length > 0
        fail_msg: "mop driver build <project>"

    # База VMID этого гипервизора -- тот же файл, что играет игра узла.
    - ansible.builtin.include_role:
        name: pve
        tasks_from: vmid

    # Номер и адрес спрашиваем у драйвера, а не считаем здесь второй раз:
    # разойдись два вычисления — `ensure` искал бы образ не там, и увидели бы
    # мы это на первом подъёме папета, а не на сборке.
    - name: Ask the driver for the image's vmid, name and network
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys
            sys.path.insert(0, sys.argv[1])
            from mop.driver import pve
            print(pve.template_vmid(sys.argv[2]), pve.template_name(sys.argv[2]),
                  pve.GATEWAY, pve.PREFIXLEN, pve.template_address(sys.argv[2]))
          - "{{ playbook_dir }}/.."
          - "{{ mop_project }}"
      environment:
        # База ЭТОГО узла, а не общая настройка установки: номер и адрес
        # образа обязаны считаться от неё, иначе два гипервизора метят в один
        # номер и один адрес (#101). Вычисление одно -- драйвер; окружение
        # лишь говорит ему, про чей узел спрашивают.
        MOP_PVE_VMID_BASE: "{{ pve_vmid_min }}"
      delegate_to: localhost
      changed_when: false
      register: tmpl

    - name: Name what came back
      ansible.builtin.set_fact:
        tmpl_vmid: "{{ tmpl.stdout.split()[0] }}"
        tmpl_name: "{{ tmpl.stdout.split()[1] }}"
        pve_gw: "{{ tmpl.stdout.split()[2] }}"
        pve_cidr: "{{ tmpl.stdout.split()[3] }}"
        tmpl_ip: "{{ tmpl.stdout.split()[4] }}"

    # Что стоит на узле: есть ли образ, осталось ли сборочное тело от
    # оборванного прогона, не стоят ли ещё тела проекта.
    - name: What stands on this node
      ansible.builtin.command: "{{ pve }} list"
      register: standing
      changed_when: false

    # Номер сборочного тела выбирает драйвер по списку: оборванную сборку
    # продолжаем в её теле, иначе берём свободный номер из диапазона
    # шаблонов (pve.stage_vmid, проверено в tests/driver.py).
    - name: Ask the driver where to build
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys
            sys.path.insert(0, sys.argv[1])
            from mop.driver import pve
            listing = pve.parse_list(sys.argv[3])
            v = pve.stage_vmid(sys.argv[2], listing)
            print(v, pve.stage_name(sys.argv[2]), pve.address_of_vmid(v))
          - "{{ playbook_dir }}/.."
          - "{{ mop_project }}"
          - "{{ standing.stdout }}"
      environment:
        # База ЭТОГО узла, а не общая настройка установки: номер и адрес
        # образа обязаны считаться от неё, иначе два гипервизора метят в один
        # номер и один адрес (#101). Вычисление одно -- драйвер; окружение
        # лишь говорит ему, про чей узел спрашивают.
        MOP_PVE_VMID_BASE: "{{ pve_vmid_min }}"
      delegate_to: localhost
      changed_when: false
      register: stage

    - name: Name the build body
      ansible.builtin.set_fact:
        stage_vmid: "{{ stage.stdout.split()[0] }}"
        stage_name: "{{ stage.stdout.split()[1] }}"
        stage_ip: "{{ stage.stdout.split()[2] }}"
        have_image: "{{ standing.stdout_lines | select('search', ' ' ~ tmpl_name ~ ' ') | list | length > 0 }}"
        have_stage: "{{ standing.stdout_lines | select('search', ' ' ~ stage.stdout.split()[1] ~ ' ') | list | length > 0 }}"
        project_bodies: "{{ standing.stdout_lines | map('split') | map(attribute=1) | select('match', '^pu-' ~ (mop_project | regex_escape) ~ '-[0-9]+$') | list }}"

    # Образ с живым клоном не заменить, поэтому тел проекта на узле быть не
    # должно. Их снимает `mop driver build` до плейбука (останов джобов и
    # снос тел); что осталось — сироты, и это дело `mop sweep`, а не
    # сборки: снести чужую работу молча хуже отказа.
    - name: No body of the project may still stand here
      ansible.builtin.assert:
        that: project_bodies | length == 0
        fail_msg: >-
          bodies of {{ mop_project }} still stand on {{ inventory_hostname }}:
          {{ project_bodies | join(', ') }} — the image cannot be replaced under
          them; orphans go with mop sweep, live puppets with mop driver build --force

    # Размеры тела: чего просит проект (mop.yaml), но не выше потолка этой
    # машины. Просит чужой репозиторий, а решает узел, на котором тело будет
    # стоять, — иначе манифест это не настройка, а способ занять гипервизор.
    # Потолки узловые (config.NODE_SCOPED), то есть переопределяются в
    # инвентаре на хосте.
    #
    # Порядок старшинства целиком: узел > проект > установка > дефолт.
    - name: How big a body of this project may be here
      ansible.builtin.set_fact:
        body_mem: "{{ [(mop_project_asks | default({})).get('MOP_MEM_MB', MOP_MEM_MB) | int,
                       MOP_BODY_MEM_CAP_MB | int] | min }}"
        body_disk: "{{ [(mop_project_asks | default({})).get('MOP_DISK_GB', MOP_DISK_GB) | int,
                        MOP_BODY_DISK_CAP_GB | int] | min }}"
        body_cores: "{{ [(mop_project_asks | default({})).get('MOP_CORES', MOP_CORES) | int,
                         MOP_BODY_CORES_CAP | int] | min }}"

    - name: Say what the body will be built with
      ansible.builtin.debug:
        msg: >-
          {{ mop_project }} on {{ inventory_hostname }}: {{ body_mem }} MB,
          {{ body_disk }} GB, {{ body_cores }} cores
          {{ '(capped by the node)' if (mop_project_asks | default({})) and
             (body_mem | int < (mop_project_asks.MOP_MEM_MB | default(0) | int)
              or body_disk | int < (mop_project_asks.MOP_DISK_GB | default(0) | int)
              or body_cores | int < (mop_project_asks.MOP_CORES | default(0) | int)) else '' }}

    # run_once, а не `creates`: ключ ОДИН на контроллер, а задача играется по
    # разу на каждый гипервизор. При стратегии linear оба хоста проходят шаг
    # одновременно, оба видят, что файла нет, и оба зовут ssh-keygen —
    # проигравший получает приглашение на перезапись и ненулевой код (#99).
    # `creates` тут бессилен: он проверяет до, а гонка происходит после.
    - name: A temporary key for reaching the body from here
      ansible.builtin.command:
        cmd: "ssh-keygen -t ed25519 -N '' -C mop-build -f {{ build_key }}"
        creates: "{{ build_key }}"
      delegate_to: localhost
      run_once: true

    - name: Read the node's key and the build key
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: keyfiles
      loop:
        - {path: "{{ MOP_HOME }}/.ssh/mop-body.pub", where: node}
        - {path: "{{ build_key }}.pub", where: control}
      loop_control:
        label: "{{ item.where }}"
      delegate_to: "{{ (item.where == 'node') | ternary(inventory_hostname, 'localhost') }}"

    - name: Name the two keys apart
      ansible.builtin.set_fact:
        node_key: "{{ keyfiles.results[0].content | b64decode | trim }}"
        control_key: "{{ keyfiles.results[1].content | b64decode | trim }}"

    # Откуда растёт сборочное тело — три случая, и каждый назван вслух:
    #   оборванная сборка   продолжаем в её теле как есть;
    #   есть образ          полная копия образа, плейбук доложит разницу;
    #   ничего / --fresh    контейнер из базового образа, всё заново.
    - name: Where the build body comes from
      ansible.builtin.set_fact:
        build_from: >-
          {{ 'stage' if (have_stage | bool and not (mop_fresh | default(false) | bool))
             else ('image' if (have_image | bool and not (mop_fresh | default(false) | bool))
             else 'base') }}

    - name: Say so
      ansible.builtin.debug:
        msg: >-
          {{ mop_project }} on {{ inventory_hostname }}:
          {{ {'stage': 'resuming the build body ' ~ stage_name ~ ' left by a previous run',
              'image': 'incremental — a full copy of ' ~ tmpl_name ~ ' (' ~ tmpl_vmid ~ ')',
              'base': 'fresh — from the base image'}[build_from] }}
          as {{ stage_name }} ({{ stage_vmid }}) at {{ stage_ip }}

    # --fresh на оборванной сборке: её тело в мусор, начинаем с базы.
    - name: A fresh build starts without the leftovers
      ansible.builtin.command: "{{ pve }} destroy {{ stage_vmid }}"
      when: have_stage | bool and build_from == 'base'
      changed_when: true

    - name: The build body, a full copy of the image
      ansible.builtin.command: >-
        {{ pve }} clone {{ tmpl_vmid }} {{ stage_vmid }} {{ stage_name }}
        {{ MOP_PVE_STORAGE }} {{ stage_ip }}/{{ pve_cidr }} {{ pve_gw }}
        {{ MOP_PVE_BRIDGE }} full
      when: build_from == 'image'
      changed_when: true

    # Копия несёт размеры СТАРОГО образа, а манифест мог поменяться: память
    # и ядра ставятся заново, диск — только вверх (тонкий том не ужать; в
    # меньшую сторону доезжает только --fresh).
    - name: The build body takes today's sizes
      ansible.builtin.command: >-
        {{ pve }} size {{ stage_vmid }} {{ body_cores }} {{ body_mem }} {{ body_disk }}
      when: build_from != 'base'
      register: resized
      changed_when: resized.stdout | length > 0

    # Пароли — со STDIN и только здесь, при сборке образа. В node.env они не
    # едут и в NODE_SCOPED не входят: тот файл лежит на узлах с правами 0644,
    # и на host-узле его читает любой папет — общий $HOME. Пусто значит
    # «пароля нет», и аккаунт остаётся заблокированным.
    # Пароль уезжает файлом, а не аргументом задачи, и `no_log` стоит только
    # на той задаче, что файл пишет. Пока метка висела на самом создании,
    # отказ приходил без единого слова — «the output has been hidden», — и
    # диагноз приходилось искать в журнале гипервизора, хотя обёртка пишет
    # причину внятно (#102). Секрет при этом по-прежнему не попадает ни в
    # лог, ни в список процессов: он идёт через stdin, а файл 0600 и снимается
    # в любом исходе.
    - name: Create the build body
      when: build_from == 'base'
      block:
        - name: A file to hand the root password over by
          ansible.builtin.tempfile:
            state: file
            prefix: mop-body-pw.
          register: body_pw

        - name: The password itself
          ansible.builtin.copy:
            content: "{{ mop_body_root_password | default('') }}"
            dest: "{{ body_pw.path }}"
            mode: "0600"
          no_log: true

        - name: The build body, a container from the base image
          ansible.builtin.shell:
            cmd: >-
              {{ pve }} create {{ stage_vmid }} {{ stage_name }} {{ MOP_PVE_TEMPLATE }}
              {{ MOP_PVE_STORAGE }} {{ body_cores }} {{ body_mem }}
              {{ body_disk }} {{ MOP_PVE_BRIDGE }} {{ stage_ip }}/{{ pve_cidr }}
              {{ pve_gw }} {{ MOP_HOME }}/.ssh/mop-body.pub
              < {{ body_pw.path | quote }}
          changed_when: true
      always:
        - name: The password file goes away whatever happened
          ansible.builtin.file:
            path: "{{ body_pw.path }}"
            state: absent
          when: body_pw.path is defined

    # Пересозданное тело приезжает с новым ключом хоста, и accept-new тут не
    # лечит: запись под этим адресом уже есть, и ssh читает смену ключа как
    # атаку. Драйвер снимает старую запись на узле, эта строка — на
    # управляющей машине, откуда идёт сборка. Без неё вторая сборка образа
    # падает на «host key verification failed», а первая проходит.
    - name: Forget the address's previous host key
      ansible.builtin.command: "ssh-keygen -R {{ stage_ip }} -f {{ lookup('env', 'HOME') }}/.ssh/known_hosts-mop-body"
      delegate_to: localhost
      changed_when: false
      failed_when: false

    - name: Start it
      ansible.builtin.command: "{{ pve }} start {{ stage_vmid }}"
      changed_when: true

    # Отдельной пробы сети нет: bootstrap начинается с `apt-get update`, и
    # пока сеть у тела не поднялась, он же и есть проба. Прежняя проба ходила
    # глаголом exec, который входит в тело под пользователем пула, — а его на
    # этом шаге ещё нет, так что сорок раз подряд она мерила не то.
    # И на копии образа тоже: глагол идемпотентен, а его `apt-get update`
    # заодно освежает списки пакетов — без этого установка нового пакета в
    # старый образ падала бы на 404 по устаревшим индексам.
    # Тот же приём, что и у создания тела (#102): пароль файлом, `no_log`
    # только на записи файла. Здесь молчание стоило бы дороже — задача идёт с
    # двенадцатью повторами, и стойкий отказ молчал бы минуту.
    - name: Bring the body up to what a node is
      block:
        - name: A file to hand the user password over by
          ansible.builtin.tempfile:
            state: file
            prefix: mop-user-pw.
          register: user_pw

        - name: The password itself
          ansible.builtin.copy:
            content: "{{ mop_body_user_password | default('') }}"
            dest: "{{ user_pw.path }}"
            mode: "0600"
          no_log: true

        - name: The pool user, sshd, sudo and a lingering session bus
          ansible.builtin.shell:
            cmd: "{{ pve }} bootstrap {{ stage_vmid }} < {{ user_pw.path | quote }}"
          register: boot
          until: boot.rc == 0
          retries: 12
          delay: 5
          changed_when: true
      always:
        - name: The password file goes away whatever happened
          ansible.builtin.file:
            path: "{{ user_pw.path }}"
            state: absent
          when: user_pw.path is defined

    - name: Let both the node and this build machine in
      ansible.builtin.shell:
        cmd: "{{ pve }} keys {{ stage_vmid }}"
        stdin: "{{ node_key }}\n{{ control_key }}\n"
      changed_when: true

    # Тело за NAT узла, и дорога к нему у управляющей машины одна — через сам
    # узел. ProxyJump, а не proxmox_pct_remote: pct-транспорт платит запуском
    # lxc-attach за каждый модуль, и сборка на нём идёт минутами дольше.
    - name: Take the body into the inventory for the rest of the run
      ansible.builtin.add_host:
        name: "{{ stage_name }}"
        groups: mop_building
        ansible_host: "{{ stage_ip }}"
        ansible_user: "{{ MOP_USER }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: "{{ build_key }}"
        # IdentitiesOnly: без него ssh сперва предъявляет каждый ключ из
        # агента, и тело успевает отказать столько раз, что включает штраф за
        # источник — после чего роняет и верный ключ тоже.
        # ServerAlive* — чтобы молчащий транспорт падал, а не висел. Замерено
        # 22.09: на просевшем транзите (260 КБ/с вместо 1.4 МБ/с) сборка
        # встала намертво в apt — `apt-get` спал в anon_pipe_write, то есть
        # писал в трубу, которую перестали читать, а ansible на своём конце
        # ждал в ep_poll. Обе стороны живые, данные не идут, таймаута нет ни
        # у одной: прогон висел бы до утра, и в логе это неотличимо от
        # медленной загрузки. Пять минут тишины транспорта (30 × 10) — это
        # про сам канал, а не про молчание apt: на живом соединении sshd
        # отвечает на keepalive независимо от того, печатает ли что-то
        # команда, так что здоровым прогонам это ничего не стоит.
        ansible_ssh_common_args: >-
          -o ProxyJump={{ inventory_hostname }}
          -o ServerAliveInterval=30
          -o ServerAliveCountMax=10
          -o IdentitiesOnly=yes
          -o PreferredAuthentications=publickey
          -o StrictHostKeyChecking=accept-new
          -o UserKnownHostsFile={{ lookup('env', 'HOME') }}/.ssh/known_hosts-mop-body
        mop_body_of: "{{ inventory_hostname }}"
        mop_body_vmid: "{{ stage_vmid }}"
      changed_when: false


- name: What the image must contain
  hosts: mop_building
  become: no
  gather_facts: no

  vars:
    mop_tgz: "/tmp/mop-package-{{ mop_project }}.tgz"
    mirror_tmp: "/tmp/mop-mirror-{{ mop_project }}.git"
    mirror_tgz: "/tmp/mop-mirror-{{ mop_project }}.tgz"

  tasks:
    - name: Wait for sshd inside the body
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: What a body must be
      ansible.builtin.include_role:
        name: body

    # Старая копия — в мусор: архив поверх неё оставил бы файлы, которых в
    # пакете уже нет (инкремент играет по копии образа).
    - name: Where the package goes, emptied first
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/mop"
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]

    # Пакет mop нужен телу ради одного файла — session.py: пробу живости и
    # канал сообщений агент исполняет внутри тела, и импортировать их снаружи
    # нечем. Возим пакет целиком по той же причине, по какой его возит игра
    # агента: возить один файл значит завести второе место, где записано, что
    # именно телу нужно.
    # Архивом, а не synchronize: тот строит свой ssh сам и теряет при этом
    # ansible_ssh_common_args, то есть ProxyJump, — и честно пытается достать
    # 10.77.0.2 с управляющей машины напрямую, которой в эту сеть хода нет.
    # unarchive же идёт обычным соединением ansible, со всеми его аргументами.
    #
    - name: Pack the mop package up
      ansible.builtin.command:
        # .env никогда не уезжает с управляющей машины: там креды GitLab,
        # которым в пуле делать нечего, а в теле папета — тем более.
        cmd: >-
          tar czf {{ mop_tgz }} -C {{ lookup('env', 'HOME') }}/mop
          --exclude=.git --exclude=__pycache__ --exclude=.env
          --exclude=inventory.ini --exclude=inventory.yaml .
      delegate_to: localhost
      changed_when: true

    - name: The mop package, for session.py inside the body
      ansible.builtin.unarchive:
        src: "{{ mop_tgz }}"
        dest: "{{ MOP_HOME }}/mop/"

    # Тот же набор, что игра агента ставит на узлы, и по той же причине: в
    # теле работает `mop mcp` -- узловой профиль MCP-сервера, и импортирует он
    # весь пакет. Без python-nomad сервер не стартует, claude показывает «1
    # failed» в /mcp, а папет остаётся без инструментов -- живой, свободный и
    # бесполезный.
    # Зеркало проекта в образ: дальше каждое тело клонирует репозиторий из него
    # локально, а не тянет по сети заново. Врапер сам смотрит, есть ли зеркало,
    # и без него клонирует как раньше -- у драйвера host его не бывает вовсе.
    #
    # Снимается на управляющей машине, а не в сборочном теле, и это не про
    # удобство: ключа к git в теле на этом шаге нет и заводить его там незачем.
    # Приватный ключ узла попадает в тело позже, при подъёме папета (MOP_BODY_SEED),
    # а в образе ему делать нечего -- образ живёт дольше любой ротации ключа.
    # run_once: зеркало одинаково для всех гипервизоров, а пути на контроллере
    # названы проектом и только им. Без этого два сборочных тела играли шаг
    # одновременно: второй `rm -rf` сносил клон, который первый в этот момент
    # делал, распаковка шла из архива, который сосед вправе удалить, и прогон
    # мог выйти зелёным с испорченным зеркалом внутри образа (#100).
    - name: Take a fresh mirror of the project
      ansible.builtin.shell: |
        set -e
        rm -rf {{ mirror_tmp }} {{ mirror_tgz }}
        git clone --mirror -q {{ mop_origin | quote }} {{ mirror_tmp }}
        tar czf {{ mirror_tgz }} -C {{ mirror_tmp }} .
      delegate_to: localhost
      become: no
      changed_when: true
      run_once: true

    # Сначала снести: инкремент играет по копии образа, и архив поверх старого
    # зеркала оставил бы в нём протухшие ссылки и объекты.
    - name: Where the mirrors live in the body
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.cache/mop-mirror/{{ mop_project }}.git"
        state: "{{ item }}"
        mode: "0755"
      loop: [absent, directory]

    - name: Mirror of the project, for bodies to clone from locally
      ansible.builtin.unarchive:
        src: "{{ mirror_tgz }}"
        dest: "{{ MOP_HOME }}/.cache/mop-mirror/{{ mop_project }}.git/"

    # Тоже один раз, и после всех распаковок: шаги идут барьером, так что к
    # этой задаче каждое тело своё зеркало уже забрало.
    - name: Drop the mirror's copy on the control machine
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["{{ mirror_tmp }}", "{{ mirror_tgz }}"]
      delegate_to: localhost
      become: no
      run_once: true

    # Список один на узел, тело и `mop setup` (mop/deps.py), приезжает
    # --extra-vars от `mop deploy`.
    - name: Python dependencies of a puppet
      ansible.builtin.pip:
        name: "{{ MOP_PIP_DEPS.split(',') }}"
        extra_args: --user --break-system-packages
        state: present

    # Свой MCP-сервер -- часть продукта: без него папет без инструментов.
    # Регистрирует сам claude (`claude mcp add` пишет ~/.claude.json). На узлах
    # это делает deploy/setup.yml; в теле -- здесь, потому что ~/.claude.json
    # у тела свой.
    - name: Register the pool MCP server for claude inside the body
      ansible.builtin.shell:
        cmd: |
          claude mcp remove -s user mop >/dev/null 2>&1 || true
          exec claude mcp add -s user mop -- '{{ MOP_HOME }}/mop/bin/mop' mcp
      environment:
        PATH: "{{ MOP_PUPPET_PATH | replace('{HOME}', MOP_HOME) }}"
      changed_when: false


# Тулчейн, базы, env-файлы, скиллы и свои MCP-серверы -- дело установки, не
# продукта: файлы называет настройка MOP_BODY_EXTRA, пусто значит «ничего сверх
# обязательного». Без этого крючка deploy/ пришлось бы обрастать чужими
# тулчейнами, а образ проекта всё равно остался бы неполным.
#
# Отдельной игрой, а не задачей в предыдущей, и причин две. Первая: `become` не
# бывает атрибутом include, его наследуют только от игры. Вторая важнее -- у
# двух половин разные умолчания: продуктовые задачи тела идут под
# пользователем пула (pip --user, пакет mop в его $HOME), а установочные -- под
# root, как и в прогоне по узлам. Слить их в одну игру значит выбрать одно
# умолчание на обе и получить root-овый ~/.local у папета.
- name: What this installation adds to a body
  hosts: mop_building
  become: yes
  gather_facts: no

  tasks:
    - name: Nothing to add when the installation names nothing
      ansible.builtin.meta: end_host
      when: MOP_BODY_EXTRA | default('') | length == 0

    # include_tasks с явным путём, а не роль: файл окружения папетов -- часть
    # установки (sandbox.yaml в корне), и ролевое дерево ему ни к чему. Путь
    # считается от плейбука, потому что вызывающих у файла двое -- прогон по
    # узлам и эта сборка.
    - name: Task files this installation names
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../{{ item | trim }}"
      loop: "{{ MOP_BODY_EXTRA.split(',') | select | list }}"

    # Манифест самого проекта (#25): сначала его конфигурация, потом его
    # задачи — после общих файлов установки, чтобы проект мог на них
    # опираться. Оба файла лежат на управляющей машине: их вырезал
    # `mop driver build` из зеркала origin ещё до плейбука.
    - name: The project's own configuration, when it has one
      # length > 0, а не голая строка в when: условие обязано дать boolean,
      # строку ansible отвергает — поймано первой же живой сборкой #26.
      when: (mop_project_vars | default('')) | length > 0
      ansible.builtin.include_vars:
        file: "{{ mop_project_vars }}"

    - name: The project's own tasks, when it has any
      when: (mop_project_tasks | default('')) | length > 0
      ansible.builtin.include_tasks: "{{ mop_project_tasks }}"

    # Кэш crates тоже в образ, и греется он единственным честным способом --
    # разрешением зависимостей настоящего дерева. Дерево берём из зеркала: это
    # локальный клон, ему не нужны ни сеть, ни ключ.
    #
    # После установочного, и порядок здесь не произволен: cargo ставит оно, а
    # не продукт. Пока прогрев стоял в игре продукта, он честно отрабатывал
    # веткой «cargo нет -- греть нечем», задуманной для проектов не на Rust, —
    # и отказ был неотличим от штатного пропуска. Поймано на образе cloudpub:
    # плейбук зелёный, образ собран, кэш crates пуст.
    - name: Warm up the crates cache from the project's own tree
      become: yes
      become_user: "{{ MOP_USER }}"
      ansible.builtin.shell: |
        set -e
        command -v cargo >/dev/null || exit 0
        mirror="$HOME/.cache/mop-mirror/{{ mop_project }}.git"
        [ -d "$mirror" ] || exit 0
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        git clone -q "$mirror" "$tmp/src"
        [ -f "$tmp/src/Cargo.toml" ] || exit 0
        cd "$tmp/src" && { cargo fetch --locked || cargo fetch || true; }
      environment:
        PATH: "{{ MOP_PUPPET_PATH | replace('{HOME}', MOP_HOME) }}"
      changed_when: true


- name: Seal the image
  hosts: puppet
  become: no
  gather_facts: no

  vars:
    pve: "sudo -n /usr/local/sbin/mop-pve"

  tasks:
    - name: Nothing to seal where bodies are not containers
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'pve'

    # Ключ сборки снимается до того, как образ станет шаблоном: иначе он
    # размножился бы в каждое тело и стал второй постоянной дорогой к папету —
    # мимо агента, то есть мимо единственной проверки проектирования.
    - name: Only the node's key survives into the image
      ansible.builtin.shell:
        cmd: "{{ pve }} keys {{ stage_vmid }}"
        stdin: "{{ node_key }}\n"
      changed_when: true

    - name: Stop the build body
      ansible.builtin.command: "{{ pve }} stop {{ stage_vmid }}"
      changed_when: true

    # Подмена образа — только теперь, когда новый собран целиком. Обрыв
    # между сносом и запечатыванием оставляет сборочное тело: следующий
    # прогон продолжит в нём и дойдёт сюда снова.
    - name: The previous image makes way
      ansible.builtin.command: "{{ pve }} destroy {{ tmpl_vmid }}"
      changed_when: true

    # Полной копией: связанный клон зависел бы от сборочного тела, которое
    # сейчас будет снесено.
    - name: The image, a full copy of the build body
      ansible.builtin.command: >-
        {{ pve }} clone {{ stage_vmid }} {{ tmpl_vmid }} {{ tmpl_name }}
        {{ MOP_PVE_STORAGE }} {{ tmpl_ip }}/{{ pve_cidr }} {{ pve_gw }}
        {{ MOP_PVE_BRIDGE }} full
      changed_when: true

    - name: Turn it into the project's image
      ansible.builtin.command: "{{ pve }} template {{ tmpl_vmid }}"
      changed_when: true

    - name: The build body has served
      ansible.builtin.command: "{{ pve }} destroy {{ stage_vmid }}"
      changed_when: true

    - name: Say what a puppet of this project will now grow from
      ansible.builtin.debug:
        msg: >-
          {{ tmpl_name }} ({{ tmpl_vmid }}) on {{ inventory_hostname }} —
          bodies of project {{ mop_project }} are clones of it now
