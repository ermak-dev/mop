---
# Образ шарда: `mop driver build <шард>`.
#
# Тело из базового образа → то, чем обязано быть ЛЮБОЕ тело (body-tasks.yml) →
# пакет mop → остановить → шаблон. Дальше каждое тело папета — клон этого
# шаблона: на lvm-thin связанный и мгновенный.
#
# СБОРКОЙ, А НЕ ПОДЪЁМОМ НА МЕСТЕ. Поднимать тело из базового образа и гонять
# плейбук при каждом `ensure` соблазнительно — одним механизмом меньше, — но
# тогда падение плейбука видно в три часа ночи внутри врапера, и выглядит оно
# как «папет не поднимается».
#
# КЛЮЧ СБОРКИ. Тело стоит в своей сети за NAT узла, и управляющая машина
# достаёт до него только через сам узел (ProxyJump). Значит для сборки ей
# нужен ключ, которого у тела иначе нет. Ключ этот ВРЕМЕННЫЙ: он кладётся
# рядом с ключом узла на время сборки и снимается перед тем, как образ
# запечатан. Постоянного ключа мастера в образе нет — он был бы второй дорогой
# к телу, мимо единственного места, где проверяется шардирование.
#
# Run:  mop driver build <шард>

- name: Bake the shard's image on the hypervisor
  hosts: puppet
  become: no
  gather_facts: no

  vars:
    pve: "sudo -n /usr/local/sbin/mop-pve"
    build_key: "{{ lookup('env', 'HOME') }}/.config/mop/body-build"

  tasks:
    - name: Only a node whose bodies are containers has an image to build
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'pve'

    - name: A shard must be named
      ansible.builtin.assert:
        that: mop_shard | default('') | length > 0
        fail_msg: "mop driver build <shard>"

    # Номер и адрес спрашиваем У ДРАЙВЕРА, а не считаем здесь второй раз:
    # разойдись два вычисления — `ensure` искал бы образ не там, и увидели бы
    # мы это на первом подъёме папета, а не на сборке.
    - name: Ask the driver for the image's vmid, name and network
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sys
            sys.path.insert(0, sys.argv[1])
            from mop.driver import pve
            print(pve.template_vmid(sys.argv[2]), pve.template_name(sys.argv[2]),
                  pve.GATEWAY, pve.PREFIXLEN)
          - "{{ playbook_dir }}/.."
          - "{{ mop_shard }}"
      delegate_to: localhost
      changed_when: false
      register: tmpl

    - name: Name what came back
      ansible.builtin.set_fact:
        tmpl_vmid: "{{ tmpl.stdout.split()[0] }}"
        tmpl_name: "{{ tmpl.stdout.split()[1] }}"
        pve_gw: "{{ tmpl.stdout.split()[2] }}"
        pve_cidr: "{{ tmpl.stdout.split()[3] }}"

    # Адрес сборочного тела — ШЛЮЗ ПЛЮС ОДИН. Живые тела стоят с него же, но
    # выше: address_of начинает с сети + 2, и пересечься им негде.
    # Размеры тела: чего просит ПРОЕКТ (mop.yaml), но не выше потолка ЭТОЙ
    # машины. Просит чужой репозиторий, а решает узел, на котором тело будет
    # стоять, — иначе манифест это не настройка, а способ занять гипервизор.
    # Потолки узловые (config.NODE_SCOPED), то есть переопределяются в
    # инвентаре на хосте.
    #
    # Порядок старшинства целиком: узел > шард > установка > дефолт.
    - name: How big a body of this shard may be here
      ansible.builtin.set_fact:
        body_mem: "{{ [(mop_shard_asks | default({})).get('MOP_PUPPET_MEM_MAX_MB', MOP_PUPPET_MEM_MAX_MB) | int,
                       MOP_BODY_MEM_CAP_MB | int] | min }}"
        body_disk: "{{ [(mop_shard_asks | default({})).get('MOP_PVE_DISK_GB', MOP_PVE_DISK_GB) | int,
                        MOP_BODY_DISK_CAP_GB | int] | min }}"
        body_cores: "{{ [(mop_shard_asks | default({})).get('MOP_PVE_CORES', MOP_PVE_CORES) | int,
                         MOP_BODY_CORES_CAP | int] | min }}"

    - name: Say what the body will be built with
      ansible.builtin.debug:
        msg: >-
          {{ mop_shard }} on {{ inventory_hostname }}: {{ body_mem }} MB,
          {{ body_disk }} GB, {{ body_cores }} cores
          {{ '(capped by the node)' if (mop_shard_asks | default({})) and
             (body_mem | int < (mop_shard_asks.MOP_PUPPET_MEM_MAX_MB | default(0) | int)
              or body_disk | int < (mop_shard_asks.MOP_PVE_DISK_GB | default(0) | int)
              or body_cores | int < (mop_shard_asks.MOP_PVE_CORES | default(0) | int)) else '' }}

    - name: Its address while it is being built
      ansible.builtin.set_fact:
        tmpl_ip: "{{ '.'.join(pve_gw.split('.')[0:3]) }}.{{ pve_gw.split('.')[3] | int + 1 }}"

    - name: A temporary key for reaching the body from here
      ansible.builtin.command:
        cmd: "ssh-keygen -t ed25519 -N '' -C mop-build -f {{ build_key }}"
        creates: "{{ build_key }}"
      delegate_to: localhost

    - name: Read the node's key and the build key
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: keyfiles
      loop:
        - {path: "{{ MOP_HOME }}/.ssh/mop-body.pub", where: node}
        - {path: "{{ build_key }}.pub", where: control}
      loop_control:
        label: "{{ item.where }}"
      delegate_to: "{{ (item.where == 'node') | ternary(inventory_hostname, 'localhost') }}"

    - name: Name the two keys apart
      ansible.builtin.set_fact:
        node_key: "{{ keyfiles.results[0].content | b64decode | trim }}"
        control_key: "{{ keyfiles.results[1].content | b64decode | trim }}"

    # Пересборка начинается со сноса: образ собирается начисто, иначе в нём
    # накапливается то, чего в плейбуке уже нет.
    - name: Throw away the previous image
      ansible.builtin.command: "{{ pve }} destroy {{ tmpl_vmid }}"
      changed_when: true

    # Пароли — СО STDIN и только здесь, при сборке образа. В node.env они не
    # едут и в NODE_SCOPED не входят: тот файл лежит на узлах с правами 0644,
    # и на host-узле его читает любой папет — общий $HOME. Пусто значит
    # «пароля нет», и аккаунт остаётся заблокированным.
    - name: Raise a container from the base image
      ansible.builtin.shell:
        cmd: >-
          {{ pve }} create {{ tmpl_vmid }} {{ tmpl_name }} {{ MOP_PVE_TEMPLATE }}
          {{ MOP_PVE_STORAGE }} {{ body_cores }} {{ body_mem }}
          {{ body_disk }} {{ MOP_PVE_BRIDGE }} {{ tmpl_ip }}/{{ pve_cidr }}
          {{ pve_gw }} {{ MOP_HOME }}/.ssh/mop-body.pub
        stdin: "{{ mop_body_root_password | default('') }}"
        stdin_add_newline: false
      changed_when: true
      no_log: true

    # Пересозданное тело приезжает с НОВЫМ ключом хоста, и accept-new тут не
    # лечит: запись под этим адресом уже есть, и ssh читает смену ключа как
    # атаку. Драйвер снимает старую запись на узле, эта строка — на
    # управляющей машине, откуда идёт сборка. Без неё ВТОРАЯ сборка образа
    # падает на «host key verification failed», а первая проходит.
    - name: Forget the address's previous host key
      ansible.builtin.command: "ssh-keygen -R {{ tmpl_ip }} -f {{ lookup('env', 'HOME') }}/.ssh/known_hosts-mop-body"
      delegate_to: localhost
      changed_when: false
      failed_when: false

    - name: Start it
      ansible.builtin.command: "{{ pve }} start {{ tmpl_vmid }}"
      changed_when: true

    # Отдельной пробы сети нет: bootstrap начинается с `apt-get update`, и
    # пока сеть у тела не поднялась, он же и есть проба. Прежняя проба ходила
    # глаголом exec, который входит В ТЕЛО ПОД ПОЛЬЗОВАТЕЛЕМ ПУЛА, — а его на
    # этом шаге ещё нет, так что сорок раз подряд она мерила не то.
    - name: The pool user, sshd, sudo and a lingering session bus
      ansible.builtin.shell:
        cmd: "{{ pve }} bootstrap {{ tmpl_vmid }}"
        stdin: "{{ mop_body_user_password | default('') }}"
        stdin_add_newline: false
      register: boot
      until: boot.rc == 0
      retries: 12
      delay: 5
      changed_when: true
      no_log: true

    - name: Let both the node and this build machine in
      ansible.builtin.shell:
        cmd: "{{ pve }} keys {{ tmpl_vmid }}"
        stdin: "{{ node_key }}\n{{ control_key }}\n"
      changed_when: true

    # Тело за NAT узла, и дорога к нему у управляющей машины одна — через сам
    # узел. ProxyJump, а не proxmox_pct_remote: pct-транспорт платит запуском
    # lxc-attach за КАЖДЫЙ модуль, и сборка на нём идёт минутами дольше.
    - name: Take the body into the inventory for the rest of the run
      ansible.builtin.add_host:
        name: "{{ tmpl_name }}"
        groups: mop_building
        ansible_host: "{{ tmpl_ip }}"
        ansible_user: "{{ MOP_USER }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: "{{ build_key }}"
        # IdentitiesOnly: без него ssh сперва предъявляет КАЖДЫЙ ключ из
        # агента, и тело успевает отказать столько раз, что включает штраф за
        # источник — после чего роняет и верный ключ тоже.
        ansible_ssh_common_args: >-
          -o ProxyJump={{ inventory_hostname }}
          -o IdentitiesOnly=yes
          -o PreferredAuthentications=publickey
          -o StrictHostKeyChecking=accept-new
          -o UserKnownHostsFile={{ lookup('env', 'HOME') }}/.ssh/known_hosts-mop-body
        mop_body_of: "{{ inventory_hostname }}"
        mop_body_vmid: "{{ tmpl_vmid }}"
      changed_when: false


- name: What the image must contain
  hosts: mop_building
  become: no
  gather_facts: no

  vars:
    mop_tgz: "/tmp/mop-package-{{ mop_shard }}.tgz"
    mirror_tmp: "/tmp/mop-mirror-{{ mop_shard }}.git"
    mirror_tgz: "/tmp/mop-mirror-{{ mop_shard }}.tgz"

  tasks:
    - name: Wait for sshd inside the body
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: What a body must be
      ansible.builtin.include_role:
        name: body

    - name: Where the package goes
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/mop"
        state: directory
        mode: "0755"

    # Пакет mop нужен телу ради ОДНОГО файла — session.py: пробу живости и
    # канал сообщений агент исполняет внутри тела, и импортировать их снаружи
    # нечем. Возим пакет целиком по той же причине, по какой его возит игра
    # агента: возить один файл значит завести второе место, где записано, что
    # именно телу нужно.
    # Архивом, а не synchronize: тот строит свой ssh САМ и теряет при этом
    # ansible_ssh_common_args, то есть ProxyJump, — и честно пытается достать
    # 10.77.0.2 с управляющей машины напрямую, которой в эту сеть хода нет.
    # unarchive же идёт обычным соединением ansible, со всеми его аргументами.
    #
    # delete=yes тут не нужен: образ каждый раз собирается начисто, устаревать
    # в нём нечему.
    - name: Pack the mop package up
      ansible.builtin.command:
        # .env НИКОГДА не уезжает с управляющей машины: там креды GitLab,
        # которым в пуле делать нечего, а в теле папета — тем более.
        cmd: >-
          tar czf {{ mop_tgz }} -C {{ lookup('env', 'HOME') }}/mop
          --exclude=.git --exclude=__pycache__ --exclude=.env
          --exclude=inventory.ini --exclude=inventory.yaml .
      delegate_to: localhost
      changed_when: true

    - name: The mop package, for session.py inside the body
      ansible.builtin.unarchive:
        src: "{{ mop_tgz }}"
        dest: "{{ MOP_HOME }}/mop/"

    # Тот же набор, что игра агента ставит на узлы, и по той же причине: в
    # теле работает `mop mcp` -- узловой профиль MCP-сервера, и импортирует он
    # весь пакет. Без python-nomad сервер не стартует, claude показывает «1
    # failed» в /mcp, а папет остаётся БЕЗ ИНСТРУМЕНТОВ -- живой, свободный и
    # бесполезный.
    # ЗЕРКАЛО ШАРДА В ОБРАЗ: дальше каждое тело клонирует репозиторий из него
    # локально, а не тянет по сети заново. Врапер сам смотрит, есть ли зеркало,
    # и без него клонирует как раньше -- у драйвера host его не бывает вовсе.
    #
    # Снимается НА УПРАВЛЯЮЩЕЙ МАШИНЕ, а не в сборочном теле, и это не про
    # удобство: ключа к git в теле на этом шаге нет и заводить его там незачем.
    # Приватный ключ узла попадает в тело позже, при подъёме папета (MOP_BODY_SEED),
    # а в ОБРАЗЕ ему делать нечего -- образ живёт дольше любой ротации ключа.
    - name: Take a fresh mirror of the shard
      ansible.builtin.shell: |
        set -e
        rm -rf {{ mirror_tmp }} {{ mirror_tgz }}
        git clone --mirror -q {{ mop_origin | quote }} {{ mirror_tmp }}
        tar czf {{ mirror_tgz }} -C {{ mirror_tmp }} .
      delegate_to: localhost
      become: no
      changed_when: true

    - name: Where the mirrors live in the body
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.cache/mop-mirror/{{ mop_shard }}.git"
        state: directory
        mode: "0755"

    - name: Mirror of the shard, for bodies to clone from locally
      ansible.builtin.unarchive:
        src: "{{ mirror_tgz }}"
        dest: "{{ MOP_HOME }}/.cache/mop-mirror/{{ mop_shard }}.git/"

    - name: Drop the mirror's copy on the control machine
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["{{ mirror_tmp }}", "{{ mirror_tgz }}"]
      delegate_to: localhost
      become: no

    - name: Python dependencies of a puppet
      ansible.builtin.pip:
        name: [nats-py, mcp, python-nomad, requests]
        extra_args: --user --break-system-packages
        state: present

    # Свой MCP-сервер -- часть продукта: без него папет без инструментов.
    # Регистрирует сам claude (`claude mcp add` пишет ~/.claude.json). На узлах
    # это делает deploy/setup.yml; в теле -- здесь, потому что ~/.claude.json
    # у тела свой.
    - name: Register the pool MCP server for claude inside the body
      ansible.builtin.shell:
        cmd: |
          claude mcp remove -s user mop >/dev/null 2>&1 || true
          exec claude mcp add -s user mop -- '{{ MOP_HOME }}/mop/bin/mop' mcp
      environment:
        PATH: "{{ MOP_PUPPET_PATH | replace('{HOME}', MOP_HOME) }}"
      changed_when: false


# Тулчейн, базы, env-файлы, скиллы и свои MCP-серверы -- дело УСТАНОВКИ, не
# продукта: файлы называет настройка MOP_BODY_EXTRA, пусто значит «ничего сверх
# обязательного». Без этого крючка deploy/ пришлось бы обрастать чужими
# тулчейнами, а образ шарда всё равно остался бы неполным.
#
# ОТДЕЛЬНОЙ ИГРОЙ, а не задачей в предыдущей, и причин две. Первая: `become` не
# бывает атрибутом include, его наследуют только от игры. Вторая важнее -- у
# двух половин разные умолчания: продуктовые задачи тела идут ПОД
# ПОЛЬЗОВАТЕЛЕМ ПУЛА (pip --user, пакет mop в его $HOME), а установочные -- под
# root, как и в прогоне по узлам. Слить их в одну игру значит выбрать одно
# умолчание на обе и получить root-овый ~/.local у папета.
- name: What this installation adds to a body
  hosts: mop_building
  become: yes
  gather_facts: no

  tasks:
    - name: Nothing to add when the installation names nothing
      ansible.builtin.meta: end_host
      when: MOP_BODY_EXTRA | default('') | length == 0

    # include_tasks с явным путём, а не роль: setup.yaml -- ПРИМЕР установки,
    # и ролевое дерево ему ни к чему. Путь считается от плейбука, потому что
    # вызывающих у файла двое -- прогон по узлам и эта сборка.
    - name: Task files this installation names
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../{{ item | trim }}"
      loop: "{{ MOP_BODY_EXTRA.split(',') | select | list }}"

    # Манифест САМОГО ШАРДА (#25): сначала его конфигурация, потом его
    # задачи — после общих файлов установки, чтобы проект мог на них
    # опираться. Оба файла лежат на управляющей машине: их вырезал
    # `mop driver build` из зеркала origin ещё до плейбука.
    - name: The shard's own configuration, when it has one
      # length > 0, а не голая строка в when: условие обязано дать boolean,
      # строку ansible отвергает — поймано первой же живой сборкой #26.
      when: (mop_shard_vars | default('')) | length > 0
      ansible.builtin.include_vars:
        file: "{{ mop_shard_vars }}"

    - name: The shard's own tasks, when it has any
      when: (mop_shard_tasks | default('')) | length > 0
      ansible.builtin.include_tasks: "{{ mop_shard_tasks }}"

    # Кэш crates тоже в образ, и греется он единственным честным способом --
    # разрешением зависимостей настоящего дерева. Дерево берём ИЗ ЗЕРКАЛА: это
    # локальный клон, ему не нужны ни сеть, ни ключ.
    #
    # ПОСЛЕ установочного, и порядок здесь не произволен: cargo ставит оно, а
    # не продукт. Пока прогрев стоял в игре продукта, он честно отрабатывал
    # веткой «cargo нет -- греть нечем», задуманной для проектов не на Rust, —
    # и отказ был неотличим от штатного пропуска. Поймано на образе cloudpub:
    # плейбук зелёный, образ собран, кэш crates пуст.
    - name: Warm up the crates cache from the shard's own tree
      become: yes
      become_user: "{{ MOP_USER }}"
      ansible.builtin.shell: |
        set -e
        command -v cargo >/dev/null || exit 0
        mirror="$HOME/.cache/mop-mirror/{{ mop_shard }}.git"
        [ -d "$mirror" ] || exit 0
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        git clone -q "$mirror" "$tmp/src"
        [ -f "$tmp/src/Cargo.toml" ] || exit 0
        cd "$tmp/src" && { cargo fetch --locked || cargo fetch || true; }
      environment:
        PATH: "{{ MOP_PUPPET_PATH | replace('{HOME}', MOP_HOME) }}"
      changed_when: true


- name: Seal the image
  hosts: puppet
  become: no
  gather_facts: no

  vars:
    pve: "sudo -n /usr/local/sbin/mop-pve"

  tasks:
    - name: Nothing to seal where bodies are not containers
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'pve'

    # Ключ сборки снимается ДО того, как образ станет шаблоном: иначе он
    # размножился бы в каждое тело и стал второй постоянной дорогой к папету —
    # мимо агента, то есть мимо единственной проверки шардирования.
    - name: Only the node's key survives into the image
      ansible.builtin.shell:
        cmd: "{{ pve }} keys {{ tmpl_vmid }}"
        stdin: "{{ node_key }}\n"
      changed_when: true

    - name: Stop it
      ansible.builtin.command: "{{ pve }} stop {{ tmpl_vmid }}"
      changed_when: true

    - name: Turn it into the shard's image
      ansible.builtin.command: "{{ pve }} template {{ tmpl_vmid }}"
      changed_when: true

    - name: Say what a puppet of this shard will now grow from
      ansible.builtin.debug:
        msg: >-
          {{ tmpl_name }} ({{ tmpl_vmid }}) on {{ inventory_hostname }} —
          bodies of shard {{ mop_shard }} are clones of it now
