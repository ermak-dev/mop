# Общие переменные игр deploy/ (#157): одно определение вместо копии в каждой
# игре. Здесь не настройки установки -- те приходят --extra-vars из
# config.SETTINGS, и второй ярус старшинства сломал бы цепочку молча, -- а
# производные, которые раньше повторяла каждая игра.
#
# Рядом с плейбуками, а не с инвентарём: так файл читают все входы -- site.yml
# и плейбук из deploy/ напрямую (проверено на ansible-core 2.21).

# Пароли лежат на управляющей машине, а не в репозитории; lookup('password')
# заводит файл при первом обращении и возвращает то же значение дальше.
# Пароли папетов тоже здесь: lookup исполняется на контроллере, роль
# bootstrap везёт их серверу (#83).
secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"

# Проекты считает `mop deploy` из ростера и своей памяти
# (mop/cli/pool/deploy.py) и передаёт --extra-vars. Пустой список --
# законное состояние пустого пула: сервер поднимется, мастеров ещё нет.
projects: "{{ mop_projects | default([]) }}"

# Посев реестра (#540): путь к снятому на контроллере снимку v1, который
# передаёт `mop server deploy` --extra-vars. Пустой дефолт -- ручной
# ansible-прогон ничего не сеет: источник посева один, префлайт.
mop_registry_seed: ""

# Признак отказа стейджинга (#540): реестр контроллера непредставим, и
# префлайт напечатал причину локально. False по умолчанию: у ручного
# прогона отказа не было, и fail-задача молчит.
mop_registry_seed_refused: false

# Откуда везут пакет mop: дерево, из которого идёт сам плейбук. realpath, а не
# голый путь: плейбук, запущенный через симлинк на каталог deploy/, иначе
# отдал бы «..» от симлинка, а не от репозитория.
mop_source: "{{ lookup('pipe', 'realpath ' ~ ((playbook_dir ~ '/..') | quote)) }}"

# Чего пакет не везёт никуда -- ни на узел, ни на сервер, ни в тело.
mop_package_excludes:
  - .git
  - __pycache__
  # .env никогда не уезжает с управляющей машины. keys.distribute возит на
  # узлы только названное явно (secrets.env), и общий синк, тащащий весь файл
  # с кредами GitLab, сводил бы эту фильтрацию к нулю. На узле пойман
  # 2026-08-29: лежал целиком, 0600, со всеми секретами проекта.
  - .env
  # Карта установки -- кто есть кто и где -- дело управляющей машины. Узел о
  # соседях не спрашивает, а всё своё берёт из node.env.
  - inventory.ini
  - inventory.yaml
  # Тулчейн дашборда -- у разработчика и в CI (#297): на серверы и в тела
  # едет только собранный web/dist, а node_modules весит сотни мегабайт.
  - web/node_modules
