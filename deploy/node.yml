---
# Чем обязан быть УЗЕЛ — машина, на которой Nomad размещает папетов.
#
# Слой появился после свежего узла (gpu, Debian 12): прогон падал на первом же
# `cargo install`, а до шины не доходил вовсе. Причина шире одного cargo --
# плейбуки молча полагались на то, что базовое поставлено руками. На узлах,
# заведённых давно, так и было, поэтому промах не проявлялся годами.
#
# Здесь только УЗЛОВОЕ -- то, без чего узел не может ни принять задачу, ни
# ответить на шину:
#   rsync  -- им ansible.posix.synchronize возит пакет mop и скиллы;
#   curl   -- им плейбуки тянут бинари и установщики.
# Всё остальное (git, tmux, jq, claude) переехало в deploy/body.yml: это
# обязанности ТЕЛА, в котором работает папет. Пока тело равно узлу, оба
# плейбука играют по одной группе и разницы не видно; на узле-гипервизоре
# Proxmox узлу из набора тела не нужно ничего, а телу нужно всё.
#
# Слой идёт ПЕРВЫМ в site.yml: и окружение узлов, и шина уже пользуются этим
# набором, а не доставляют его.
#
# Run:  mop deploy

- name: Base prerequisites of a pool node
  hosts: puppet
  become: no
  gather_facts: no

  tasks:
    - name: Ensure the tools a node itself runs on
      become: yes
      ansible.builtin.apt:
        name:
          - rsync
          - curl
        state: present
