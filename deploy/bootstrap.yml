---
# Bootstrap песочницы папета (#62, docs/BOOTSTRAP.md): играет СЕРВЕР по
# запросу узла при каждом старте — `mop bootstrap serve` зовёт этот плейбук
# с инвентарём из одной машины по адресу (тело либо узел, где тело равно
# узлу), под пользователем пула, ключом сервера.
#
# Здесь только рамка: задачи и конфигурация — файлы проекта, которые сервер
# держит в ~/.config/mop/bootstrap/ (кладут `mop deploy` из origin, `mop add`
# и `mop bootstrap push` из рабочей копии мастера). От root, как и задачи
# песочницы: пул доверяет репозиториям своих проектов; что трогает дом
# пользователя пула, называет его явно (become_user).
#
# Переменные прогона: mop_project, mop_puppet, mop_clone (путь клона папета),
# плюс настройки установки (MOP_HOME, MOP_USER, …).
#
# Run:  сервером, из mop/server/bootstrap.py; руками — незачем.

- name: Bootstrap of a puppet's sandbox
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: Wait for sshd inside the sandbox
      ansible.builtin.wait_for_connection:
        timeout: 60

    # Секреты проекта (#127, #128) -- каталог целиком, заново при каждом
    # старте: новое появляется, удалённое исчезает. До задач проекта: те
    # могут на них опираться. Врапер кладёт файлы в клон, переменные в сессию.
    - name: The project's secrets, removed before they are laid anew
      when: mop_secrets_dir is defined
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.config/mop/project-secrets/{{ mop_project }}"
        state: absent

    - name: Where a body keeps its project's secrets
      when: mop_secrets_dir is defined
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.config/mop/project-secrets"
        state: directory
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: "0700"

    - name: The project's secrets
      when: mop_secrets_dir is defined
      ansible.builtin.copy:
        src: "{{ mop_secrets_dir }}/"
        dest: "{{ MOP_HOME }}/.config/mop/project-secrets/{{ mop_project }}/"
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: "0600"
        directory_mode: "0700"
      no_log: true

    - name: The project's bootstrap configuration, when it has one
      when: mop_bootstrap_vars is defined
      ansible.builtin.include_vars:
        file: "{{ mop_bootstrap_vars }}"

    - name: The project's bootstrap tasks
      when: mop_bootstrap_tasks is defined
      ansible.builtin.include_tasks: "{{ mop_bootstrap_tasks }}"
