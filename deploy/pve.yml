---
# Узел, чьи тела — контейнеры. Игра идёт только по таким: условие смотрит на
# драйвер, а не на имя группы — список драйверов живёт в mop/driver/, и второе
# его место здесь разошлось бы с первым молча.
#
# Run:  mop deploy

- name: A Proxmox node, where a puppet's body is a container
  hosts: puppet
  become: yes
  gather_facts: no

  tasks:
    - name: Nodes that are their own body need none of this
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'pve'

    - name: What a Proxmox node must be
      ansible.builtin.include_role:
        name: pve

# Дорога с сервера к телам (#59): маршруты к куску сети каждого гипервизора
# через его адрес в локалке. Отдельной игрой по группе server, потому что
# гипервизоры только что назвали свои адреса и блоки — здесь их собирают.
- name: Routes from the server to the bodies
  hosts: server
  become: yes
  gather_facts: no

  tasks:
    - name: What the server must route to
      ansible.builtin.include_role:
        name: pve
        tasks_from: server
