---
# Узел, чьи тела — контейнеры. Игра идёт только по таким: условие смотрит на
# драйвер, а не на имя группы — список драйверов живёт в mop/driver/, и второе
# его место здесь разошлось бы с первым молча.
#
# Run:  mop deploy

- name: A hypervisor node, where a puppet's body is a container
  hosts: puppet
  become: yes
  gather_facts: no

  tasks:
    - name: Nodes that are their own body need none of this
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'pve'

    - name: What a hypervisor must be
      ansible.builtin.include_role:
        name: pve
