# Проекты пула: узкий прогон для `mop project add|delete|limit`.
#
# Завод проекта -- дело одного сервера: пользователь puppet-<проект> в
# конфиге NATS, пароль проекта в каталоге, из которого сервер раздаёт его
# узлам в ответе bootstrap'а (#83), и лимиты. На узлы прогон не ходит (#114):
# кред папета они получают только от сервера, в момент подъёма.
#
# Задачи не свои: это те же файлы ролей bus, bootstrap и cluster, которые
# играет полная установка. Второй копии нет намеренно -- разойдясь, узкий
# прогон заводил бы проект, а полный его снимал.
#
# Запуск: mop project add <origin> | mop project delete <имя>

- name: NATS users of the pool's projects
  hosts: server
  become: yes
  gather_facts: no

  vars:
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    nats_nodes: "{{ groups['puppet'] }}"
    projects: "{{ mop_projects | default([]) }}"
  tasks:
    - ansible.builtin.include_role:
        name: bus
        tasks_from: projects
    # Пароль проекта -- серверу, чтобы тот отдал его узлу в ответе
    # bootstrap'а. Без этого заведённый проект доезжал бы до сервера
    # только полным `mop deploy`, а папет до него не поднимался бы.
    - ansible.builtin.include_role:
        name: bootstrap
        tasks_from: creds
    # Лимиты папетов (#107): тот же файл задач, что играет роль cluster.
    - ansible.builtin.include_role:
        name: cluster
        tasks_from: limits

