# Проекты пула: узкий прогон для `mop project add|delete|limit`.
#
# Завод проекта -- дело одного сервера: реестр на сервер, и сервер сам
# заводит пароль проекта и пользователя puppet-<проект> (`mop cluster users`,
# #116), плюс лимиты. На узлы прогон не ходит (#114): кред папета они
# получают только от сервера, в момент подъёма.
#
# Задачи не свои: это те же файлы ролей bus, bootstrap и cluster, которые
# играет полная установка. Второй копии нет намеренно -- разойдясь, узкий
# прогон заводил бы проект, а полный его снимал.
#
# Запуск: mop project add <origin> | mop project delete <имя>

- name: NATS users of the pool's projects
  hosts: server
  become: yes
  gather_facts: no

  vars:
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    nats_nodes: "{{ groups['puppet'] }}"
    projects: "{{ mop_projects | default([]) }}"
  tasks:
    - ansible.builtin.include_role:
        name: bus
        tasks_from: projects
    # Пароли снятых проектов -- прочь с сервера (заводит их сам сервер).
    - ansible.builtin.include_role:
        name: bootstrap
        tasks_from: creds
    # Лимиты папетов (#107): тот же файл задач, что играет роль cluster.
    - ansible.builtin.include_role:
        name: cluster
        tasks_from: limits

