---
# Чем обязано быть ТЕЛО — то, в чём работает папет.
#
# Раскол с deploy/node.yml не косметический: узел отвечает на вопрос, ГДЕ
# стоит папет, тело — В ЧЁМ он живёт (docs/DRIVER.md). У драйвера host тело
# равно узлу, и игра идёт по той же группе puppet; на узле-гипервизоре она
# выходит сразу — его тела строит `mop driver build`, и гоняет по ним ЭТИ ЖЕ
# задачи, только со своим инвентарём.
#
# Сами задачи живут в deploy/body-tasks.yml: у «чем обязано быть тело» два
# вызывающих и обязано быть одно определение.
#
# Run:  mop deploy

- name: What any puppet body must be
  hosts: puppet
  become: no
  gather_facts: no

  tasks:
    # Условие смотрит на ДРАЙВЕР, а не на имя группы: список драйверов живёт
    # в mop/driver/, и второе его место здесь разошлось бы с первым молча.
    - name: A node that is not its own body is not a body
      ansible.builtin.meta: end_host
      when: mop_driver | default('host') != 'host'

    - name: What a body must be
      ansible.builtin.include_tasks: body-tasks.yml
