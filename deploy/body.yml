---
# Чем обязано быть ТЕЛО — то, в чём работает папет.
#
# Раскол с ролью node не косметический: узел отвечает на вопрос, ГДЕ стоит
# папет, тело — В ЧЁМ он живёт (docs/DRIVER.md). У драйвера host тело равно
# узлу, и игра идёт по той же группе puppet; на узле-гипервизоре она выходит
# сразу — его тела строит `mop driver build`, и он подключает ЭТУ ЖЕ роль.
#
# Run:  mop deploy

- name: What any puppet body must be
  hosts: puppet
  become: no
  gather_facts: no

  tasks:
    # Условие смотрит на ДРАЙВЕР, а не на имя группы: список драйверов живёт
    # в mop/driver/, и второе его место здесь разошлось бы с первым молча.
    - name: A node that is not its own body is not a body
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'host'

    - name: What a body must be
      ansible.builtin.include_role:
        name: body

    # Что установка добавляет к телу сверх обязательного. ТОТ ЖЕ список и тот
    # же способ, которым его подключает сборка образа (deploy/pve-build.yml):
    # у «чем обязано быть тело этой установки» два вызывающих и одно
    # определение.
    #
    # apply, а не become рядом с include: атрибутом включения become не
    # бывает, ansible отказывает прогону целиком. У двух половин разные
    # умолчания -- продуктовые задачи тела идут под пользователем пула,
    # установочные от root, -- и выбрать одно на игру значит заставить
    # вторую половину переспрашивать в каждой задаче.
    #
    # Пока здесь стояло умолчание игры (become: no), прогон был зелёным
    # на всём, что только ПРОВЕРЯЕТ состояние, и падал на первом чтении
    # чужого файла: pg_hba.conf, 0640 postgres.
    - name: What this installation adds to a body
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../{{ item | trim }}"
        apply:
          become: yes
      loop: "{{ (MOP_BODY_EXTRA | default('')).split(',') | select | list }}"

# ЧТО ПРОЕКТ ГОВОРИТ О СВОЁМ ОКРУЖЕНИИ (#25/#27). Узел применяется
# манифестам шардов установки: vars и tasks из mop.yaml каждого, уже
# вырезанные на управляющей машине из его origin (bin/deploy) — плейбук не
# парсит сам и второго, снисходительного разбора не заводит.
#
# Секреты сюда не попадают ПРИНЦИПИАЛЬНО: их нет в git, и на host-узлах их
# возит examples/env.yml установки. А вот задачи исполняются от root: узел
# доверяет репозиториям, названным в MOP_SHARD_ORIGINS, — это записанное
# решение эпика #25, сменившее прежнее «проекту отданы только размеры».
#
# Нет манифеста — нечего применять, и узел про этот шард молчит: общее
# (MOP_BODY_EXTRA выше) уже стоит.
- name: What each shard's manifest adds to this node
  hosts: puppet
  become: yes
  gather_facts: no

  tasks:
    - name: A node that is not its own body is not a body
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'host'

    - name: No shard has a manifest
      ansible.builtin.meta: end_host
      when: (mop_manifests | default({})) | length == 0

    # СНАЧАЛА конфигурация всех, ПОТОМ задачи всех: у include_vars нет охвата
    # на один include, и переменные проектов живут в одном словаре узла.
    # Совпавшее имя между проектами перебивается по порядку — единственная
    # цена простоты; имена в vars манифеста — внутреннее дело проекта.
    - name: Configuration of each shard that has one
      ansible.builtin.include_vars:
        file: "{{ item.value.vars }}"
      loop: "{{ mop_manifests | dict2items | selectattr('value.vars', 'defined') | list }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Tasks of each shard that has any
      ansible.builtin.include_tasks: "{{ item.value.tasks }}"
      loop: "{{ mop_manifests | dict2items | selectattr('value.tasks', 'defined') | list }}"
      loop_control:
        label: "{{ item.key }}"
