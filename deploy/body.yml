---
# Чем обязано быть тело — то, в чём работает папет.
#
# Раскол с ролью node не косметический: узел отвечает на вопрос, где стоит
# папет, тело — в чём он живёт (docs/DRIVER.md). У драйвера host тело равно
# узлу, и игра идёт по той же группе puppet; на узле-гипервизоре она выходит
# сразу — его тела строит `mop driver build`, и он подключает эту же роль.
#
# Run:  mop deploy

- name: What any puppet body must be
  hosts: puppet
  become: no
  gather_facts: no

  tasks:
    # Условие смотрит на драйвер, а не на имя группы: список драйверов живёт
    # в mop/driver/, и второе его место здесь разошлось бы с первым молча.
    - name: A node that is not its own body is not a body
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'host'

    - name: What a body must be
      ansible.builtin.include_role:
        name: body

    # Что установка добавляет к телу сверх обязательного. Тот же список и тот
    # же способ, которым его подключает сборка образа (deploy/pve-build.yml):
    # у «чем обязано быть тело этой установки» два вызывающих и одно
    # определение.
    #
    # apply, а не become рядом с include: атрибутом включения become не
    # бывает, ansible отказывает прогону целиком. У двух половин разные
    # умолчания -- продуктовые задачи тела идут под пользователем пула,
    # установочные от root, -- и выбрать одно на игру значит заставить
    # вторую половину переспрашивать в каждой задаче.
    #
    # Пока здесь стояло умолчание игры (become: no), прогон был зелёным
    # на всём, что только проверяет состояние, и падал на первом чтении
    # чужого файла: pg_hba.conf, 0640 postgres.
    - name: What this installation adds to a body
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../{{ item | trim }}"
        apply:
          become: yes
      loop: "{{ (MOP_BODY_EXTRA | default('')).split(',') | select | list }}"

# Что проект просит от узла (#32): задачи .mop/node.yaml каждого шарда,
# вырезанные на управляющей машине из его origin. Без отсечки по драйверу:
# узловое нужно узлу всегда, даже если папет в нём не живёт (симметрия
# сеянию git-ключа в роли node). Общего узлового в продукте уже хватает —
# у большинства проектов этой половины нет вовсе, и игра пуста.
- name: What each shard's manifest asks of this node
  hosts: puppet
  become: yes
  gather_facts: no

  tasks:
    - name: No shard has node tasks
      ansible.builtin.meta: end_host
      when: (mop_manifests | default({}))
             | dict2items | selectattr('value.node_tasks', 'defined')
             | list | length == 0

    - name: Node tasks of each shard that has them
      ansible.builtin.include_tasks: "{{ item.value.node_tasks }}"
      loop: "{{ mop_manifests | dict2items | selectattr('value.node_tasks', 'defined') | list }}"
      loop_control:
        label: "{{ item.key }}"

# Что проекту нужно в теле (#25/#27/#32): vars и tasks его
# .mop/workspace.yaml. Файлы подготовлены на управляющей машине из origin
# (bin/deploy) — плейбук не парсит сам и второго разбора не заводит.
# Копирование файлов — задачами копирования самого манифеста: формат ansible
# декларативен, и отдельных конвенций транспорту не нужно.
#
# Секреты в задачах остаются секретами: src — путь на управляющей машине,
# в git их по-прежнему нет. А вот задачи исполняются от root: узел доверяет
# репозиториям, чьи origin'ы в памяти шардов, — запи
- name: What each shard's manifest adds to a body
  hosts: puppet
  become: yes
  gather_facts: no

  tasks:
    - name: A node that is not its own body is not a body
      ansible.builtin.meta: end_host
      when: mop_driver | default(MOP_DRIVER) != 'host'

    - name: No shard has workspace tasks
      ansible.builtin.meta: end_host
      when: (mop_manifests | default({}))
             | dict2items | selectattr('value.ws_tasks', 'defined')
             | list | length == 0

    # Сначала конфигурация всех, потом задачи всех: у include_vars нет охвата
    # на один include, и переменные проектов живут в одном словаре узла.
    # Совпавшее имя между проектами перебивается по порядку — единственная
    # цена простоты; имена в vars манифеста — внутреннее дело проекта.
    - name: Workspace configuration of each shard that has one
      ansible.builtin.include_vars:
        file: "{{ item.value.ws_vars }}"
      loop: "{{ mop_manifests | dict2items | selectattr('value.ws_vars', 'defined') | list }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Workspace tasks of each shard that has any
      ansible.builtin.include_tasks: "{{ item.value.ws_tasks }}"
      loop: "{{ mop_manifests | dict2items | selectattr('value.ws_tasks', 'defined') | list }}"
      loop_control:
        label: "{{ item.key }}"
