---
# Чем обязано быть ТЕЛО — то, в чём работает папет.
#
# Раскол с deploy/node.yml не косметический: узел отвечает на вопрос, ГДЕ
# стоит папет, тело — В ЧЁМ он живёт (docs/DRIVER.md). Пока тело равно узлу
# (драйвер host), обе игры идут по группе puppet, и набор на машине тот же,
# что был одной игрой. На узле-гипервизоре Proxmox эта игра поедет по телам —
# контейнерам, — а узлу из неё не нужно ничего.
#
# Что именно нужно телу:
#   git    -- клон папету заводит врапер (mop/puppets.py), из спеки джоба;
#   tmux   -- в нём живёт сессия папета, ею же меряется его состояние;
#   jq     -- им врапер гасит первый запуск claude (edit_json в puppets.py);
#   claude -- собственно папет; его же зовёт `claude mcp add` в deploy/setup.yml.
#
# ГРАНИЦУ ПРОЕКТА ЭТА ИГРА НЕ НАРУШАЕТ: здесь то, чем обязано быть ЛЮБОЕ тело.
# Тулчейн, базы и env-файлы конкретного проекта остаются в examples/.
#
# Run:  mop deploy

- name: What any puppet body must be
  hosts: "{{ mop_bodies | default('puppet') }}"
  become: no
  gather_facts: no

  tasks:
    - name: Ensure the tools a puppet works with
      become: yes
      ansible.builtin.apt:
        name:
          - git
          - tmux
          - jq
          - rsync
          - curl
        state: present

    # Нативный установщик, а не npm: claude кладёт себя в ~/.local/share/claude
    # и симлинкует в ~/.local/bin -- ровно туда, куда смотрит MOP_PUPPET_PATH.
    # Под пользователем пула, а не под root: PATH папета -- это его домашний
    # каталог, и claude из /root узел бы не увидел.
    #
    # creates, а не state=latest: ставим один раз, дальше claude обновляет себя
    # сам, и прогон deploy не имеет права подменить версию под работающим
    # папетом.
    - name: Install the claude CLI
      ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
      args:
        creates: "{{ MOP_HOME }}/.local/bin/claude"
