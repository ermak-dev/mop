# Шина пула mop: сервер NATS и агент на каждом узле.
#
# Заменила собой `alloc exec`. Раньше мастер гонял шелл внутрь аллокации и
# платил websocket-рукопожатием за каждую пробу, а команда ехала в query-строке
# URL и упиралась в 8 КБ, которыми nginx режет URI. Теперь на узле сидит
# подписчик с закрытым набором глаголов (mop/agent.py, субъекты — docs/BUS.md).
#
# ЭТОТ ПЛЕЙБУК -- АВАРИЙНЫЙ ПУТЬ ПУЛА. Дороги на узел мимо шины больше нет, и
# единственное, чем поднимают упавшего агента или чинят креды, -- это он.
# Поэтому он обязан работать на голом ssh и ничего не занимать у самого mop.
#
# Пароли не лежат в репозитории и не задаются руками: lookup('password') заводит
# файл на управляющей машине при первом прогоне и переиспользует дальше.
# Потерять их не страшно -- новый прогон раздаст новые сразу и серверу, и узлам.
#
# Запуск:  mop deploy
#
# Симлинк ~/etc/nats обязателен, как и ~/etc/nomad: таблицы «имя -> плейбук»
# нигде нет, путь и есть таблица.

# Имя узла в Nomad и имя в инвентаре — одно и то же имя: клиент Nomad
# объявляется как `name = inventory_hostname` (deploy/nomad/client.hcl.j2).
# Агент подписывается на субъект того же имени, и расхождение читалось бы как
# выключенный узел.
- name: Bus address on the LAN
  hosts: puppet:master
  gather_facts: no

  tasks:
    # На LAN-адрес -- тот же, на который Nomad-клиент ходит за RPC. Публичное
    # имя тут не годится в принципе: оно резолвится в адрес роутера, а хайрпин
    # на порт шины он не делает -- первый же прогон дал connection refused на
    # <публичный адрес>:4222 с обоих узлов. Порт наружу не проброшен и
    # проброшен быть не должен.
    - name: Bus address on the LAN
      ansible.builtin.set_fact:
        nats_lan: "nats://{{ MOP_SERVER_LAN }}:{{ MOP_NATS_PORT }}"

- name: NATS server for the mop bus
  hosts: server
  become: yes
  gather_facts: no

  vars:
    # Пароли лежат ЗДЕСЬ, на управляющей машине, а не в репозитории; lookup
    # заводит файл при первом обращении и возвращает то же значение дальше.
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    nats_tgz: "https://github.com/nats-io/nats-server/releases/download/v{{ MOP_NATS_VERSION }}/nats-server-v{{ MOP_NATS_VERSION }}-linux-amd64.tar.gz"
    nats_nodes: "{{ groups['puppet'] }}"
    # Шарды считает `mop deploy` из ростера Nomad и своей памяти (см. bin/deploy)
    # и передаёт сюда --extra-vars. Пустой список -- законное состояние пустого
    # пула: сервер поднимется, мастеров просто ещё нет.
    shards: "{{ mop_shards | default([]) }}"
  tasks:
    - ansible.builtin.include_role:
        name: bus
        tasks_from: server


- name: mop-agent on the puppet hosts
  hosts: puppet
  gather_facts: no

  vars:
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    mop_home: "{{ MOP_HOME }}/mop"
    # UID спрашиваем У УЗЛА, а не берём настройкой. Настройка была одна на
    # весь пул и по факту утверждала, что UID пользователя всюду одинаков; на
    # узле с другим UID юнит агента уехал бы с чужим XDG_RUNTIME_DIR, и это
    # ровно тот отказ, который не видно: session.py не нашёл бы каталог
    # сокетов, а живые папета читались бы мёртвыми.
    # ansible_facts[...], а не голое имя факта: с 2.24 ansible перестаёт
    # поднимать факты в переменные, и getent_passwd без префикса умрёт.
    mop_uid: "{{ ansible_facts['getent_passwd'][MOP_USER][1] }}"
    nats_addr: "{{ nats_lan }}"
    nats_user: "node-{{ inventory_hostname }}"
    nats_password: "{{ lookup('password', secrets_dir + '/nats-node-' + inventory_hostname + '.pass length=32 chars=ascii_letters,digits') }}"
    shards: "{{ mop_shards | default([]) }}"
  roles:
    - bus


- name: Bus credentials on the master
  hosts: master
  gather_facts: no

  vars:
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    nats_addr: "{{ nats_lan }}"
    nats_user: admin
    nats_password: "{{ lookup('password', secrets_dir + '/nats-admin.pass length=32 chars=ascii_letters,digits') }}"
    shards: "{{ mop_shards | default([]) }}"
  tasks:
    - ansible.builtin.include_role:
        name: bus
        tasks_from: master


- name: Disk watchdog job
  hosts: server
  gather_facts: no

  vars:
    nomad_home: "{{ MOP_NOMAD_DATA | dirname }}"
  tasks:
    - ansible.builtin.include_role:
        name: bus
        tasks_from: watchdog
