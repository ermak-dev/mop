# Шина пула mop: сервер NATS и агент на каждом узле.
#
# Заменила собой `alloc exec`. Раньше мастер гонял шелл внутрь аллокации и
# платил websocket-рукопожатием за каждую пробу, а команда ехала в query-строке
# URL и упиралась в 8 КБ, которыми nginx режет URI. Теперь на узле сидит
# подписчик с закрытым набором глаголов (mop/agent.py, субъекты — docs/BUS.md).
#
# ЭТОТ ПЛЕЙБУК -- АВАРИЙНЫЙ ПУТЬ ПУЛА. Дороги на узел мимо шины больше нет, и
# единственное, чем поднимают упавшего агента или чинят креды, -- это он.
# Поэтому он обязан работать на голом ssh и ничего не занимать у самого mop.
#
# Пароли не лежат в репозитории и не задаются руками: lookup('password') заводит
# файл на управляющей машине при первом прогоне и переиспользует дальше.
# Потерять их не страшно -- новый прогон раздаст новые сразу и серверу, и узлам.
#
# Запуск:  mop deploy
#
# Симлинк ~/etc/nats обязателен, как и ~/etc/nomad: таблицы «имя -> плейбук»
# нигде нет, путь и есть таблица.

# Имя узла в Nomad, имя в инвентаре и ssh-алиас — одно и то же имя: клиент
# Nomad объявляется как `name = inventory_hostname` (deploy/nomad/client.hcl.j2).
# Раньше они расходились у gamer, и mop нёс ради этого настройку с таблицей
# имён; агент, подписавшийся не на тот субъект, выглядел как выключенный узел.
- name: Bus address on the LAN
  hosts: puppet:master
  gather_facts: no

  tasks:
    # На LAN-адрес -- тот же, на который Nomad-клиент ходит за RPC. Публичное
    # имя тут не годится в принципе: оно резолвится в адрес роутера, а хайрпин
    # на порт шины он не делает -- первый же прогон дал connection refused на
    # <публичный адрес>:4222 с обоих узлов. Порт наружу не проброшен и
    # проброшен быть не должен.
    - name: Bus address on the LAN
      ansible.builtin.set_fact:
        nats_lan: "nats://{{ MOP_SERVER_LAN }}:{{ MOP_NATS_PORT }}"


- name: NATS server for the mop bus
  hosts: server
  become: yes
  gather_facts: no

  vars:
    # Пароли лежат ЗДЕСЬ, на управляющей машине, а не в репозитории; lookup
    # заводит файл при первом обращении и возвращает то же значение дальше.
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    nats_tgz: "https://github.com/nats-io/nats-server/releases/download/v{{ MOP_NATS_VERSION }}/nats-server-v{{ MOP_NATS_VERSION }}-linux-amd64.tar.gz"
    nats_nodes: "{{ groups['puppet'] }}"
    # Шарды считает `mop deploy` из ростера Nomad и своей памяти (см. bin/deploy)
    # и передаёт сюда --extra-vars. Пустой список -- законное состояние пустого
    # пула: сервер поднимется, мастеров просто ещё нет.
    shards: "{{ mop_shards | default([]) }}"

  tasks:
    - name: Unpack nats-server {{ MOP_NATS_VERSION }}
      ansible.builtin.unarchive:
        src: "{{ nats_tgz }}"
        dest: /tmp
        remote_src: yes
        creates: "/tmp/nats-server-v{{ MOP_NATS_VERSION }}-linux-amd64/nats-server"

    - name: Install nats-server
      ansible.builtin.copy:
        src: "/tmp/nats-server-v{{ MOP_NATS_VERSION }}-linux-amd64/nats-server"
        dest: /usr/local/bin/nats-server
        remote_src: yes
        mode: "0755"
      notify: restart nats

    - name: Config dir
      ansible.builtin.file:
        path: /etc/nats
        state: directory
        mode: "0755"

    - name: Server config
      ansible.builtin.template:
        src: nats-server.conf.j2
        dest: /etc/nats/nats-server.conf
        # Пароли внутри: читает только root, под которым служба и ходит.
        mode: "0600"
      notify: restart nats

    - name: Systemd unit
      ansible.builtin.template:
        src: nats.service.j2
        dest: /etc/systemd/system/nats.service
        mode: "0644"
      notify: restart nats

    - name: Enable and start
      ansible.builtin.systemd:
        name: nats
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: restart nats
      ansible.builtin.systemd:
        name: nats
        state: restarted
        daemon_reload: yes


# Агент на рабочих узлах.
#
# Пакет mop возим ЗДЕСЬ, хотя его же возит examples/homelab/claude.yml для MCP-сервера.
# Дубль осознанный: игра, которая запускает агента, обязана привезти его код
# сама. Пока она этого не делала, `mop deploy nats` после правки agent.py
# поднимал на узлах СТАРЫЙ агент -- и первый же прогон это показал: креды в
# bus.json уже несли новое поле, а агент рядом о нём не знал и падал на
# соединении. Аварийный путь, зависящий от соседнего плейбука, -- не аварийный
# путь.
- name: mop-agent on the puppet hosts
  hosts: puppet
  gather_facts: no

  vars:
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    mop_home: "{{ MOP_HOME }}/mop"
    # UID спрашиваем У УЗЛА, а не берём настройкой. Настройка была одна на
    # весь пул и по факту утверждала, что UID пользователя всюду одинаков; на
    # узле с другим UID юнит агента уехал бы с чужим XDG_RUNTIME_DIR, и это
    # ровно тот отказ, который не видно: session.py не нашёл бы каталог
    # сокетов, а живые папета читались бы мёртвыми.
    # ansible_facts[...], а не голое имя факта: с 2.24 ansible перестаёт
    # поднимать факты в переменные, и getent_passwd без префикса умрёт.
    mop_uid: "{{ ansible_facts['getent_passwd'][MOP_USER][1] }}"
    nats_addr: "{{ nats_lan }}"
    nats_user: "node-{{ inventory_hostname }}"
    nats_password: "{{ lookup('password', secrets_dir + '/nats-node-' + inventory_hostname + '.pass length=32 chars=ascii_letters,digits') }}"
    shards: "{{ mop_shards | default([]) }}"

  tasks:
    - name: UID of the pool user on this node
      ansible.builtin.getent:
        database: passwd
        key: "{{ MOP_USER }}"

    - name: Ensure python3-pip
      become: yes
      ansible.builtin.apt:
        name: python3-pip
        state: present

    # Всё, что нужно самому mop на узле: клиент шины, MCP-сервер узлового
    # профиля и то, что он импортирует.
    - name: Python dependencies of mop
      ansible.builtin.pip:
        name: [nats-py, mcp, python-nomad, requests]
        extra_args: --user --break-system-packages
        state: present

    - name: Sync the mop package from the control machine
      ansible.posix.synchronize:
        src: "{{ lookup('env', 'HOME') }}/mop/"
        dest: "{{ mop_home }}/"
        delete: yes
        recursive: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          # .env НИКОГДА не уезжает на узлы. keys.distribute возит туда только
          # названное явно (secrets.env), и общий rsync, тащащий весь файл с
          # кредами GitLab, сводил бы эту фильтрацию к нулю. На узле пойман
          # 2026-08-29: лежал целиком, 0600, со всеми секретами проекта.
          - "--exclude=.env"
      notify: restart mop-agent

    # Свой MCP-сервер -- часть продукта: без него папет без инструментов.
    # Регистрирует сам claude (`claude mcp add` пишет ~/.claude.json), ручного
    # мерджа больше нет. CLI не умеет сравнивать желаемое с фактом (токены
    # прячет даже от get), поэтому приводим тупо: снять и поставить. Скоап
    # user: локальный прилип бы к каталогу запуска.
    - name: Register the pool MCP server for claude
      ansible.builtin.shell:
        cmd: |
          claude mcp remove -s user mop >/dev/null 2>&1 || true
          exec claude mcp add -s user mop -- '{{ MOP_HOME }}/mop/bin/mop' mcp
      # claude на узле живёт в nvm, которого нет в PATH неинтерактивного ssh;
      # MOP_PUPPET_PATH -- уже готовый PATH папета, им же и ищем.
      environment:
        PATH: "{{ MOP_PUPPET_PATH | replace('{HOME}', MOP_HOME) }}"
      changed_when: false

    - name: Credentials dir
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.config/mop"
        state: directory
        mode: "0700"

    - name: Bus credentials for the agent
      ansible.builtin.template:
        src: bus.json.j2
        dest: "{{ MOP_HOME }}/.config/mop/bus.json"
        mode: "0600"
      notify: restart mop-agent

    # Креды на КАЖДЫЙ шард, а не одни на узел. Врапер подсовывает их сессии
    # папета через MOP_BUS_CONFIG, и без этого папет ходил бы под кредом агента
    # -- то есть мог бы написать в чужой проект, а агент бы этого не поймал:
    # он видит, кого спрашивают, но не видит, кто спрашивает.
    - name: Bus credentials for the puppets, one per shard
      ansible.builtin.template:
        src: bus.json.j2
        dest: "{{ MOP_HOME }}/.config/mop/bus-{{ item }}.json"
        mode: "0600"
      loop: "{{ shards }}"
      vars:
        nats_user: "puppet-{{ item }}"
        nats_password: "{{ lookup('password', secrets_dir + '/nats-puppet-' + item + '.pass length=32 chars=ascii_letters,digits') }}"

    # Токен Nomad возили на узлы, чтобы узловой mop mcp дотягивался до соседей
    # и до инбокса мастера, и цена была названа прямо: папет, добравшийся до
    # файла, мог снести чужие джобы. Шина даёт ту же связь правами по субъектам,
    # поэтому полномочия узлам больше не нужны. Перестать раздавать мало --
    # старая копия так и лежала бы.
    - name: Drop the Nomad management token from the pool
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.config/nomad/bootstrap.json"
        state: absent

    - name: Agent unit
      become: yes
      ansible.builtin.template:
        src: mop-agent.service.j2
        dest: /etc/systemd/system/mop-agent.service
        mode: "0644"
      notify: restart mop-agent

    - name: Enable and start the agent
      become: yes
      ansible.builtin.systemd:
        name: mop-agent
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Flush handlers before checking
      ansible.builtin.meta: flush_handlers

    # Дисковый сторож — объекты mop (клоны, target-каталоги), а не проекта,
    # поэтому едет ядром, а не examples. Скрипт ставится на узлы, джоб
    # регистрируется ниже отдельной игрой на сервере. Он обязан работать при
    # выключенном мастере -- иначе теряется единственная уборка, которой всё
    # равно (сироты не требуют суждений о живых папетах).
    - name: Deploy the pu-sweep script (disk watchdog)
      become: yes
      ansible.builtin.copy:
        src: pu-sweep.sh
        dest: /usr/local/bin/pu-sweep
        mode: "0755"

    # Прогон плейбука без этой проверки не отличает «юнит запущен» от «агент
    # подписался»: systemd доволен процессом, который упал в реконнект.
    - name: Confirm the agent is connected
      ansible.builtin.command: /usr/bin/python3 -m mop.agent --check
      args:
        chdir: "{{ mop_home }}"
      environment:
        MOP_NODE: "{{ inventory_hostname }}"
      changed_when: false

  handlers:
    - name: restart mop-agent
      become: yes
      ansible.builtin.systemd:
        name: mop-agent
        state: restarted
        daemon_reload: yes


# Управляющая машина: только креды. Агента здесь нет и не нужно -- папетов на
# ней не живёт, а инбокс мастера слушает сам `mop mcp`.
- name: Bus credentials on the master
  hosts: master
  gather_facts: no

  vars:
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    nats_addr: "{{ nats_lan }}"
    nats_user: admin
    nats_password: "{{ lookup('password', secrets_dir + '/nats-admin.pass length=32 chars=ascii_letters,digits') }}"
    shards: "{{ mop_shards | default([]) }}"

  tasks:
    - name: Python client for the bus
      ansible.builtin.pip:
        name: nats-py
        extra_args: --user --break-system-packages
        state: present

    - name: Credentials dir
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.config/mop"
        state: directory
        mode: "0700"

    - name: Operator credentials
      ansible.builtin.template:
        src: bus.json.j2
        dest: "{{ MOP_HOME }}/.config/mop/bus.json"
        mode: "0600"

    # По креденшлу на шард: их подхватывает `mop master`, и именно они делают
    # мастера слепым к чужим проектам.
    - name: Master credentials, one per shard
      ansible.builtin.template:
        src: bus.json.j2
        dest: "{{ MOP_HOME }}/.config/mop/bus-{{ item }}.json"
        mode: "0600"
      loop: "{{ shards }}"
      vars:
        nats_user: "master-{{ item }}"
        nats_password: "{{ lookup('password', secrets_dir + '/nats-master-' + item + '.pass length=32 chars=ascii_letters,digits') }}"

    # Скилл /master -- интерфейс мастер-сессии, как ~/bin/mop. Сам он живёт в
    # репозитории, снаружи только симлинк: правка через ~/.claude попадала бы
    # в тот же файл, но проходила бы мимо истории.
    - name: Claude skills dir
      ansible.builtin.file:
        path: "{{ MOP_HOME }}/.claude/skills"
        state: directory
        mode: "0755"

    - name: Master skill symlink
      ansible.builtin.file:
        src: "{{ playbook_dir | dirname }}/skills/master"
        dest: "{{ MOP_HOME }}/.claude/skills/master"
        state: link
        force: true


# Джоб дискового сторожа. Регистрируется СЕРВЕРОМ: токен есть только у него,
# а спека несут значения установки (датацентр, пользователь, $HOME, пороги) --
# всё приезжает --extra-vars от `mop deploy`, плейбуки .env не читают.
- name: Disk watchdog job
  hosts: server
  gather_facts: no

  vars:
    nomad_home: "{{ MOP_NOMAD_DATA | dirname }}"

  tasks:
    # template, а не copy: спека несёт значения установки. ${...} для этого не
    # годится -- это интерполяция HCL, Nomad стал бы разрешать её сам и не
    # нашёл бы переменной.
    - name: Deploy the pu-cleanup job spec
      ansible.builtin.template:
        src: pu-cleanup.nomad.hcl.j2
        dest: "{{ nomad_home }}/pu-cleanup.nomad.hcl"
        mode: "0644"
      register: cleanup_spec

    - name: Check the pu-cleanup job is registered
      ansible.builtin.shell: >
        NOMAD_ADDR=http://127.0.0.1:{{ MOP_NOMAD_PORT }}
        NOMAD_TOKEN=$(python3 -c "import json; print(json.load(open('{{ nomad_home }}/bootstrap.json'))['SecretID'])")
        /usr/local/bin/nomad job status pu-cleanup
      register: cleanup_status
      failed_when: false
      changed_when: false

    - name: Register the pu-cleanup job
      ansible.builtin.shell: >
        NOMAD_ADDR=http://127.0.0.1:{{ MOP_NOMAD_PORT }}
        NOMAD_TOKEN=$(python3 -c "import json; print(json.load(open('{{ nomad_home }}/bootstrap.json'))['SecretID'])")
        /usr/local/bin/nomad job run {{ nomad_home }}/pu-cleanup.nomad.hcl
      when: cleanup_spec.changed or cleanup_status.rc != 0
