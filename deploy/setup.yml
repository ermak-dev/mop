# Шина пула mop: сервер NATS и агент на каждом узле.
#
# Заменила собой `alloc exec`. Раньше мастер гонял шелл внутрь аллокации и
# платил websocket-рукопожатием за каждую пробу, а команда ехала в query-строке
# URL и упиралась в 8 КБ, которыми nginx режет URI. Теперь на узле сидит
# подписчик с закрытым набором глаголов (mop/agent.py, субъекты — docs/BUS.md).
#
# Этот плейбук -- аварийный путь пула. Дороги на узел мимо шины больше нет, и
# единственное, чем поднимают упавшего агента или чинят креды, -- это он.
# Поэтому он обязан работать на голом ssh и ничего не занимать у самого mop.
#
# Пароли не лежат в репозитории и не задаются руками: lookup('password') заводит
# файл на контроллере при первом прогоне и переиспользует дальше. Потерять их
# не страшно -- новый прогон раздаст новые сразу и серверу, и узлам. Каталог
# паролей (secrets_dir) и список проектов (projects) -- deploy/group_vars/all.yml.
#
# Контроллер -- сервер: там репозиторий, .env, ssh к узлам и secrets/. Машина
# оператора в инвентаре не значится и ansible не видит: свои креды она
# получает командой `mop join`, скилл и проверку проекта делает `mop master`.
# Что мастеру положено, контроллер собирает себе сам в конце `mop deploy`
# (~/.config/mop/servers/<адрес>/), и join везёт ровно этот каталог.
#
# Запуск:  mop deploy
#
# Симлинк ~/etc/nats обязателен, как и ~/etc/nomad: таблицы «имя -> плейбук»
# нигде нет, путь и есть таблица.

# Имя узла в Nomad и имя в инвентаре — одно и то же имя: клиент Nomad
# объявляется как `name = inventory_hostname` (deploy/nomad/client.hcl.j2).
# Агент подписывается на субъект того же имени, и расхождение читалось бы как
# выключенный узел.
- name: Bus address on the LAN
  hosts: puppet
  gather_facts: no

  tasks:
    # На LAN-адрес -- тот же, на который Nomad-клиент ходит за RPC. Публичное
    # имя тут не годится в принципе: оно резолвится в адрес роутера, а хайрпин
    # на порт шины он не делает -- первый же прогон дал connection refused на
    # <публичный адрес>:4222 с обоих узлов. Порт наружу не проброшен и
    # проброшен быть не должен.
    - name: Bus address on the LAN
      ansible.builtin.set_fact:
        nats_lan: "nats://{{ MOP_SERVER_LAN }}:{{ MOP_NATS_PORT }}"

- name: NATS server for the mop bus
  hosts: server
  become: yes
  gather_facts: no

  vars:
    nats_tgz: "https://github.com/nats-io/nats-server/releases/download/v{{ MOP_NATS_VERSION }}/nats-server-v{{ MOP_NATS_VERSION }}-linux-amd64.tar.gz"
    nats_nodes: "{{ groups['puppet'] }}"
  tasks:
    # NATS работает под пользователем пула (#115). В полной игре его уже
    # завела игра сервера Nomad, но этот плейбук -- аварийный путь и обязан
    # подниматься сам.
    - ansible.builtin.include_role:
        name: node
        tasks_from: user
    # Пакет mop -- до шины (#116): пользователей шины пишет `mop cluster
    # users` на сервере.
    - ansible.builtin.include_role:
        name: web
        tasks_from: package
    - ansible.builtin.include_role:
        name: bus
        tasks_from: server


# Ключ сервера к песочницам (#62) — до игры агентов: узлам нужна его
# публичная часть (роль bus кладёт её на узел и, где тело равно узлу, в
# authorized_keys пользователя пула).
- name: Bootstrap key of the server
  hosts: server
  gather_facts: no

  tasks:
    - ansible.builtin.include_role:
        name: bootstrap
        tasks_from: key


- name: mop-agent on the puppet hosts
  hosts: puppet
  gather_facts: no

  vars:
    mop_home: "{{ MOP_HOME }}/mop"
    # UID спрашиваем у узла, а не берём настройкой. Настройка была одна на
    # весь пул и по факту утверждала, что UID пользователя всюду одинаков; на
    # узле с другим UID юнит агента уехал бы с чужим XDG_RUNTIME_DIR, и это
    # ровно тот отказ, который не видно: session.py не нашёл бы каталог
    # сокетов, а живые папета читались бы мёртвыми.
    # ansible_facts[...], а не голое имя факта: с 2.24 ansible перестаёт
    # поднимать факты в переменные, и getent_passwd без префикса умрёт.
    mop_uid: "{{ ansible_facts['getent_passwd'][MOP_USER][1] }}"
    nats_addr: "{{ nats_lan }}"
    nats_user: "node-{{ inventory_hostname }}"
    nats_password: "{{ lookup('password', secrets_dir + '/nats-node-' + inventory_hostname + '.pass length=32 chars=ascii_letters,digits') }}"
  roles:
    - bus


- name: Disk watchdog job
  hosts: server
  gather_facts: no

  vars:
    nomad_home: "{{ MOP_NOMAD_DATA | dirname }}"
  tasks:
    - ansible.builtin.include_role:
        name: bus
        tasks_from: watchdog


# TLS-прокси (#96): одна точка входа для людей -- дашборд в корне, шина по
# WebSocket на /nats. До дашборда и сервисов сервера: их каталог сервера
# ходит на шину через этот прокси (#97). Сквозная проверка -- в роли web.
- name: TLS proxy on the server
  hosts: server
  become: yes
  gather_facts: no

  roles:
    - proxy


# Дашборд пула (docs/WEB.md): тот же сервер, что и шина, -- машина, которая
# включена всегда, и единственная, кроме машин операторов, где мастеру
# положено быть. Идёт после шины и после игры сервера Nomad: креды, которые
# роль кладёт дашборду, рождаются там.
- name: Pool dashboard on the server
  hosts: server
  become: no
  gather_facts: no

  roles:
    - web


# Bootstrap песочниц (#62, docs/BOOTSTRAP.md): подписчик на сервере, который
# играет .mop/bootstrap.yaml проекта при каждом старте папета. После дашборда:
# пакет mop и креды оператора на сервер привозит роль web.
- name: Bootstrap of sandboxes, on the server
  hosts: server
  become: no
  gather_facts: no

  roles:
    - bootstrap


# Сервис кластера (#80, mop/cluster.py): подписчик на сервере, который держит
# токен Nomad и отвечает глаголами пула на шине. После дашборда по той же
# причине, что и bootstrap: пакет и креды привозит роль web.
- name: Cluster service, on the server
  hosts: server
  become: no
  gather_facts: no
  roles:
    - cluster
