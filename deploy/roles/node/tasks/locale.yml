# Локаль машины: MOP_LOCALE, сгенерированная и объявленная системной.
#
# Отдельным файлом в роли узла, потому что нужна и управляющим машинам
# (`mop setup` зовёт его include_role'ом), и узлам пула: вторая копия
# разошлась бы с первой молча, а
# расхождение здесь -- это ansible, который не стартует, и вывод команд в
# вопросительных знаках.
#
# UTF-8 обязателен: ansible берёт локаль из окружения и на не-UTF-8 отказывается
# работать вовсе. C.UTF-8 встроена в glibc и генерации не требует -- для неё
# задача ничего не делает и падать ей не на чем.
- name: Locales are generated by a package that a minimal image lacks
  become: yes
  ansible.builtin.apt:
    name: locales
    state: present
  when: not MOP_LOCALE.upper().startswith('C.')

- name: The installation's locale is generated
  become: yes
  community.general.locale_gen:
    name: "{{ MOP_LOCALE }}"
    state: present
  when: not MOP_LOCALE.upper().startswith('C.')
  register: locale_made
  failed_when: false

# Запасной путь: community.general есть не на всякой машине, а локаль нужна
# раньше, чем что-либо ещё. locale-gen читает /etc/locale.gen, поэтому строку
# кладём сами.
- name: The same by hand, where the collection is missing
  become: yes
  when: not MOP_LOCALE.upper().startswith('C.') and locale_made is failed
  block:
    - ansible.builtin.lineinfile:
        path: /etc/locale.gen
        regexp: "^#?\\s*{{ MOP_LOCALE }} "
        line: "{{ MOP_LOCALE }} UTF-8"
        create: yes
    - ansible.builtin.command: locale-gen
      changed_when: true

- name: The installation's locale is the system one
  become: yes
  ansible.builtin.copy:
    dest: /etc/default/locale
    mode: "0644"
    content: |
      LANG={{ MOP_LOCALE }}
      LC_ALL={{ MOP_LOCALE }}
