# Чем обязан быть узел — машина, на которой Nomad размещает папетов.
#
# Слой появился после свежего узла (gpu, Debian 12): прогон падал на первом же
# `cargo install`, а до шины не доходил вовсе. Плейбуки молча полагались на то,
# что базовое поставлено руками; на узлах, заведённых давно, так и было,
# поэтому промах не проявлялся годами.
#
# Здесь только узловое — то, без чего узел не может ни принять задачу, ни
# ответить на шину. Всё про папета (git, tmux, jq, claude) живёт в роли body:
# это обязанности тела. Пока тело равно узлу, разницы не видно; на
# узле-гипервизоре узлу из набора тела не нужно ничего, а телу нужно всё.
- name: Ensure the tools a node itself runs on
  become: yes
  ansible.builtin.apt:
    name:
      - rsync
      - curl
    state: present

# GIT-доступ пула: ключ личности и доверенный ключ хоста форжа (#32). Узел
# обязан иметь это при любом драйвере, даже если папет в нём не живёт, — он
# сеет то же самое в каждое своё тело (MOP_BODY_SEED). Хост форжа —
# обязательная настройка MOP_GIT_HOST: молча угадывать чужой forge хуже
# громкого отказа. Механизм — часть продукта; значение — установки.

# Пользователь пула -- служебный: дом, ключи, sudo на mop-pve у гипервизора.
# На обжитых узлах он совпадал с оператором и был заведён руками до плейбуков,
# и первая же задача, трогающая его дом, падала на свежем узле с «failed to
# look up user» (#65). become на самой задаче: игра узла идёт без become, а
# passwd правит только root. Дом -- явно владельцу: каталог, созданный root'ом
# до пользователя, `user` не переписывает, и он остался бы чужим.
- name: The pool user
  become: yes
  ansible.builtin.user:
    name: "{{ MOP_USER }}"
    home: "{{ MOP_HOME }}"
    shell: /bin/bash
    create_home: yes

- name: Home of the pool user
  become: yes
  ansible.builtin.file:
    path: "{{ MOP_HOME }}"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"

- name: SSH dir of the pool user
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.ssh"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0700'

# Какой ключ -- настройка MOP_GIT_KEY (дефолт: первый из стандартных имён на
# контроллере), а имя на узле то же, что на контроллере: ssh подхватывает
# стандартные имена сам, а тело сеет оба (MOP_BODY_SEED). Наличие файла
# проверяет `mop deploy` до прогона.
- name: Git identity of the pool user
  ansible.builtin.copy:
    src: "{{ MOP_GIT_KEY }}{{ item.suffix }}"
    dest: "{{ MOP_HOME }}/.ssh/{{ MOP_GIT_KEY | basename }}{{ item.suffix }}"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "{{ item.mode }}"
  loop:
    - {suffix: '', mode: '0600'}
    - {suffix: '.pub', mode: '0644'}
  loop_control:
    label: "{{ MOP_GIT_KEY | basename }}{{ item.suffix }}"

# Ключ хоста снимаем с управляющей машины и кладём явно: интерактивного
# «yes» в клоне из-под Nomad ввести некому, а StrictHostKeyChecking=no
# означал бы клон откуда угодно.
- name: Host key of the git server
  delegate_to: localhost
  become: no
  run_once: yes
  ansible.builtin.command: ssh-keyscan -t ed25519 {{ MOP_GIT_HOST }}
  register: git_hostkey
  changed_when: false

- name: Trust the git host key
  ansible.builtin.known_hosts:
    path: "{{ MOP_HOME }}/.ssh/known_hosts"
    name: "{{ MOP_GIT_HOST }}"
    key: "{{ git_hostkey.stdout_lines | reject('match', '^#') | first }}"
    state: present
  become_user: "{{ MOP_USER }}"

# Выше отсечки, и это не порядок ради порядка. Ключ нужен узлу с любым
# драйвером: узел, который сам телом не бывает, всё равно сеет .ssh/id_rsa
# и .ssh/known_hosts внутрь каждого своего тела (MOP_BODY_SEED,
# mop/driver/pve.py). Пока отсечка стояла выше, первый же pve-узел остался
# без ключа: deploy зелёный, узел выглядит настроенным, а папет падает на
# `git clone` -- ровно тот отказ, про который написано пятью строками выше,
# только на другом узле. Ключ пришлось класть руками.
