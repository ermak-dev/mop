# Bootstrap песочниц на сервере (#62, docs/BOOTSTRAP.md): ansible, файлы
# проектов, юнит подписчика. Идёт после дашборда: пакет mop и креды оператора
# на сервер привозит роль web, и здесь они уже лежат.
#
# Сервер, а не узел и не машина оператора: bootstrap играется при КАЖДОМ
# старте песочницы, в том числе когда Nomad перезапускает аллокацию сам, а
# мастера нет вовсе; сервер — машина, которая включена всегда, и у неё
# есть дорога к телам (#59).
# Со свежими списками: сервер живёт долго, и его кэш apt протухает — первая
# же раскатка упала на 404 по версии пакета, которой в зеркале уже нет.
- name: Ansible, to play a project's bootstrap into a sandbox
  become: yes
  ansible.builtin.apt:
    name: ansible
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Where the puppets' workspaces live
  become: yes
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/mop/bootstrap"
    state: directory
    mode: "0700"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"

# workspace -- файл папета (#133): его кладут глаголы жизненного цикла папета
# у сервиса кластера, и deploy его не трогает (#134). Переход: копии, которые
# deploy раскладывал проектам из origin (<проект>-tasks|vars.yml), снимаются
# -- их больше никто не играет, а лежащие путали бы `mop bootstrap check`.
- name: Workspaces the deploy used to lay per project
  become: yes
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/mop/bootstrap/{{ item.0 }}-{{ item.1 }}.yml"
    state: absent
  loop: "{{ (mop_projects | default([])) | product(['tasks', 'vars']) | list }}"
  loop_control:
    label: "{{ item.0 }}-{{ item.1 }}"

# Пароли папетов, которые сервер раздаёт узлам при bootstrap'е (#83).
- ansible.builtin.include_tasks: creds.yml

# Пакет на сервер привозит роль web -- та же машина, тот же каталог, -- и
# второй rsync здесь ничего не менял бы: первый уже всё привёз, а подписчик
# оставался на старом коде (поймано первой раскаткой: юнит не перезапустился).
# Поэтому перезапуск -- по результату ТОГО синка: зарегистрированная
# переменная переживает игру.
- name: The package changed under the service
  ansible.builtin.debug:
    msg: "mop package or bus identity changed on the server — restarting mop-bootstrap"
  # Пакет или идентичность сервера на шине (#104): старое соединение
  # держит прежнего пользователя до рестарта.
  changed_when: (mop_server_package | default({})) is changed or (mop_server_version | default({})) is changed or (mop_server_identity | default({})) is changed
  notify: restart mop-bootstrap

- name: Systemd unit
  become: yes
  ansible.builtin.template:
    src: mop-bootstrap.service.j2
    dest: /etc/systemd/system/mop-bootstrap.service
    mode: "0644"
  notify: restart mop-bootstrap

- name: Enable and start
  become: yes
  ansible.builtin.systemd:
    name: mop-bootstrap
    enabled: yes
    state: started
    daemon_reload: yes

- name: Apply the restart now, before the check
  ansible.builtin.meta: flush_handlers

# Прогоном, а не чтением статуса: юнит в реконнекте systemd устраивает, а
# папет тем временем не поднимется — узел ждёт ответа, которого нет.
- name: The service answers on the bus
  become: yes
  become_user: "{{ MOP_USER }}"
  ansible.builtin.command: "{{ MOP_HOME }}/mop/bin/mop bootstrap check"
  environment:
    MOP_SERVER_LAN: "{{ MOP_SERVER_LAN }}"
    MOP_NATS_PORT: "{{ MOP_NATS_PORT }}"
    MOP_HTTPS_PORT: "{{ MOP_HTTPS_PORT }}"
  register: boot_check
  until: boot_check.rc == 0
  retries: 10
  delay: 3
  changed_when: false
