# База VMID этого гипервизора -- в одном месте на всех, кто её спрашивает.
#
# Отдельным файлом, потому что спрашивают двое: игра узла (роль pve) и сборка
# образа (deploy/pve-build.yml), а сборка запускается сама по себе, без роли.
# Второе такое же выражение разошлось бы с первым молча, и разошлось бы оно в
# НОМЕРАХ: два гипервизора метили бы в один номер и один адрес образа (#101).
#
# База -- свойство ЭТОГО гипервизора (строка хоста в инвентаре), а сеть одна
# на пул: от абсолютного VMID разные базы дают разные куски одной плоской
# сети (#58), и второй гипервизор отличается ровно базой.
- name: The VMID range of this hypervisor
  ansible.builtin.set_fact:
    pve_vmid_min: "{{ (mop_pve_vmid_base | default(MOP_PVE_VMID_BASE)) | int }}"
    pve_vmid_max: "{{ ((mop_pve_vmid_base | default(MOP_PVE_VMID_BASE)) | int) + 999 }}"
