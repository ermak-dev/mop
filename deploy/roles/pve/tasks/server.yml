# Сервер: маршруты к телам каждого гипервизора (#59). Играется по группе
# server второй игрой deploy/pve.yml, после того как гипервизоры назвали свои
# адреса и блоки (main.yml).
#
# Юнитом systemd, а не строкой в /etc/network: у сервера может быть любой
# сетевой стек (ifupdown, networkd, NM), а `ip route replace` идемпотентен
# при любом из них и переживает перезагрузку вместе с юнитом. Маршрут,
# добавленный руками 22.09, живёт до перезагрузки — он не замена этому.
#
# Это ЗАПИСАННОЕ РЕШЕНИЕ о доступе, а не побочное следствие маршрута:
# прямая дорога из локалки к телу идёт мимо агента — единственного места,
# где проверяется, чей это папет, — и ровно от этого отказались для
# постоянного ключа мастера в образе (deploy/pve-build.yml). Маршрут даёт
# только СЕТЬ; войти в тело он не даёт: в телах PasswordAuthentication no,
# вход по ключу, а ключей в образе — только узла. Серверу дорога нужна
# ради bootstrap'а песочниц (#62) и диагностики.
- name: Hypervisors that announced their slice of the bodies' network
  ansible.builtin.set_fact:
    pve_hops: >-
      {{ groups['puppet'] | map('extract', hostvars)
         | selectattr('pve_routes', 'defined')
         | map(attribute='inventory_hostname') | list }}

# Срез сети тел считается из базы VMID узла, и база у каждого гипервизора
# обязана быть своя (docstring pve.address_of_vmid, #58). Ничто этого не
# проверяло: два узла на общем дефолте объявляли один и тот же срез, прогон
# молча ставил каждую подсеть дважды, второй `ip route replace` затирал
# первый, и до правды дело доходило проверкой маршрута ниже — чей отказ про
# адресацию не говорит ничего. Совпавший срез означает вдобавок одинаковые
# АДРЕСА тел на двух машинах: маршрут тут лишь первый симптом (#93).
- name: No two hypervisors may announce the same slice of the bodies' network
  ansible.builtin.assert:
    that: announced | length == announced | unique | list | length
    fail_msg: >-
      announced by more than one hypervisor:
      {% for c in announced | unique %}
      {%- if (announced | select('equalto', c) | list | length) > 1 %}{{ c }} {% endif %}
      {%- endfor %}
      Their VMID bases collide, so their slices -- and their bodies'
      addresses -- collide too. Give each hypervisor its own base in the
      inventory: mop_pve_vmid_base under its host in the proxmox group.
      Who announced what:
      {% for h in pve_hops %}{{ h }}={{ hostvars[h].pve_routes | join(',') }} {% endfor %}
  vars:
    announced: "{{ pve_hops | map('extract', hostvars, 'pve_routes') | flatten }}"
  when: pve_hops | length > 0

- name: The routes, as a unit that survives a reboot
  ansible.builtin.template:
    src: mop-routes.service.j2
    dest: /etc/systemd/system/mop-routes.service
    mode: "0644"
  register: routes_unit
  when: pve_hops | length > 0

- name: Apply them now
  ansible.builtin.systemd:
    name: mop-routes
    enabled: yes
    state: "{{ 'restarted' if routes_unit.changed else 'started' }}"
    daemon_reload: yes
  when: pve_hops | length > 0

# Гипервизоров нет — юнита нет: пул без тел не держит маршрутов в никуда.
- name: No hypervisors, no routes
  ansible.builtin.systemd:
    name: mop-routes
    enabled: no
    state: stopped
  failed_when: false
  when: pve_hops | length == 0

- name: Drop the unit with them
  ansible.builtin.file:
    path: /etc/systemd/system/mop-routes.service
    state: absent
  when: pve_hops | length == 0

# Проверка прогоном, а не чтением юнита: маршрут в таблице — единственное,
# что здесь имеет значение.
- name: Ask the kernel where each hypervisor's slice goes
  ansible.builtin.command: "ip -4 route get {{ hostvars[item].pve_routes[0].split('/')[0] }}"
  loop: "{{ pve_hops }}"
  register: route_check
  changed_when: false

# Вердикт отдельной задачей, а не failed_when у команды: у команды нет
# fail_msg, и отказ показывал голый вывод `ip route` при rc=0. Понять из него,
# что next hop — ЧУЖОЙ гипервизор, можно было только сходив за pve_lan каждого
# узла руками (#94).
- name: The server reaches each hypervisor's slice through it
  ansible.builtin.assert:
    that: "('via ' ~ hostvars[item.item].pve_lan) in item.stdout"
    fail_msg: >-
      the bodies of {{ item.item }} ({{ hostvars[item.item].pve_lan }}) are not
      reached through it: the kernel sends {{ item.item ~ "'s" }} slice
      {{ hostvars[item.item].pve_routes[0] }} to
      {{ item.stdout.split('via ')[1].split()[0] if 'via ' in item.stdout
         else 'a directly attached network' }}.
      Two usual causes: another hypervisor announced the same slice (the check
      above names them), or mop-routes has not been restarted since its next
      hop changed -- systemctl restart mop-routes.
    success_msg: "{{ item.item }}: {{ hostvars[item.item].pve_routes[0] }} via {{ hostvars[item.item].pve_lan }}"
  loop: "{{ route_check.results }}"
  loop_control:
    label: "{{ item.item }}"
