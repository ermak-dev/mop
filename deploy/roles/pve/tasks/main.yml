# Чем обязан быть узел-гипервизор — тот, у которого тело папета не он сам, а
# контейнер LXC (docs/DRIVER.md).
#
# Три вещи, и каждая существует потому, что без неё тело молча не работает:
#   сеть     — отдельный мост с NAT: адрес тела выводится из имени, и
#              раздавать такие адреса в чужой локалке значит однажды
#              столкнуться с её DHCP;
#   ключ     — пара ключей узла к своим телам плюс отдельный known_hosts:
#              пересозданное тело приезжает с новым ключом хоста, и общий
#              known_hosts превратил бы каждый рецикл в «агент молчит»;
#   обёртка  — /usr/local/sbin/mop-pve, единственная дорога агента к
#              жизненному циклу тел. Выдать пользователю пула `pct` целиком
#              значило бы выдать root на гипервизоре вместе с соседними
#              боевыми контейнерами.
#
# Роль не несёт настроек: ни defaults, ни vars. Значения приходят цепочкой
# окружение > node.env > .env > дефолт (config.py), и второй ярус старшинства
# здесь сломал бы её молча. Ниже только разбор уже полученных значений.
- name: Take the bodies' network apart
  ansible.builtin.set_fact:
    # Сеть разбираем строкой, а шлюз берём готовым (MOP_PVE_GATEWAY): его
    # считает config.py, и второе вычисление здесь однажды дало бы другой
    # адрес — молча, потому что мост встал бы, а тела просто не достучались.
    pve_net: "{{ MOP_PVE_SUBNET.split('/')[0] }}"
    pve_cidr: "{{ MOP_PVE_SUBNET.split('/')[1] }}"
    pve_gw: "{{ MOP_PVE_GATEWAY }}"

- name: Nodes that are their own body need none of this
  ansible.builtin.meta: end_host
  when: mop_driver | default(MOP_DRIVER) != 'pve'

# База VMID -- общий файл: её же спрашивает сборка образа.
- ansible.builtin.include_tasks: vmid.yml

# ── сеть тел ─────────────────────────────────────────────────────────
# Мост без портов: наружу тела ходят NAT'ом через сам узел. Правила NAT
# висят на самом мосте (post-up), а не отдельным юнитом: поднимается
# интерфейс — поднимаются правила, и рассогласоваться им негде.
- name: Bridge for the bodies
  ansible.builtin.copy:
    dest: /etc/network/interfaces.d/mop
    mode: "0644"
    content: |
      # mop: мост тел папетов. Заводит deploy/pve.yml, править руками
      # незачем -- значения приезжают из MOP_PVE_BRIDGE и MOP_PVE_SUBNET.
      auto {{ MOP_PVE_BRIDGE }}
      iface {{ MOP_PVE_BRIDGE }} inet static
          address {{ pve_gw }}/{{ pve_cidr }}
          bridge-ports none
          bridge-stp off
          bridge-fd 0
          post-up echo 1 > /proc/sys/net/ipv4/ip_forward
          post-up iptables -t nat -C POSTROUTING -s {{ pve_net }}/{{ pve_cidr }} ! -o {{ MOP_PVE_BRIDGE }} -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s {{ pve_net }}/{{ pve_cidr }} ! -o {{ MOP_PVE_BRIDGE }} -j MASQUERADE
          post-up iptables -C FORWARD -i {{ MOP_PVE_BRIDGE }} -j ACCEPT 2>/dev/null || iptables -A FORWARD -i {{ MOP_PVE_BRIDGE }} -j ACCEPT
          post-up iptables -C FORWARD -o {{ MOP_PVE_BRIDGE }} -j ACCEPT 2>/dev/null || iptables -A FORWARD -o {{ MOP_PVE_BRIDGE }} -j ACCEPT
  register: pve_bridge

- name: Raise the bridge
  ansible.builtin.command: "ifup {{ MOP_PVE_BRIDGE }}"
  when: pve_bridge.changed
  changed_when: true
  failed_when: false

# ifup на уже поднятом мосте ничего не делает, поэтому правила после
# правки конфига приходится досыпать отдельно -- иначе тело молча теряет
# выход наружу ровно до перезагрузки узла.
- name: Confirm the bridge is up and NAT is in place
  ansible.builtin.shell: |
    set -e
    ip link show {{ MOP_PVE_BRIDGE }} >/dev/null
    sysctl -qw net.ipv4.ip_forward=1
    iptables -t nat -C POSTROUTING -s {{ pve_net }}/{{ pve_cidr }} ! -o {{ MOP_PVE_BRIDGE }} -j MASQUERADE 2>/dev/null \
      || iptables -t nat -A POSTROUTING -s {{ pve_net }}/{{ pve_cidr }} ! -o {{ MOP_PVE_BRIDGE }} -j MASQUERADE
    iptables -C FORWARD -i {{ MOP_PVE_BRIDGE }} -j ACCEPT 2>/dev/null \
      || iptables -A FORWARD -i {{ MOP_PVE_BRIDGE }} -j ACCEPT
    iptables -C FORWARD -o {{ MOP_PVE_BRIDGE }} -j ACCEPT 2>/dev/null \
      || iptables -A FORWARD -o {{ MOP_PVE_BRIDGE }} -j ACCEPT
  changed_when: false

# ── root-обёртка ─────────────────────────────────────────────────────
- name: The one road to a body's life cycle
  ansible.builtin.template:
    src: mop-pve.j2
    dest: /usr/local/sbin/mop-pve
    mode: "0755"

# Право названо поимённо и ровно одно. `pct` целиком здесь был бы root:
# `pct exec` входит в любой контейнер узла, включая боевые.
- name: The pool user may call it, and only it
  ansible.builtin.copy:
    dest: /etc/sudoers.d/mop-pve
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      {{ MOP_USER }} ALL=(root) NOPASSWD: /usr/local/sbin/mop-pve

# ── ключ узла к своим телам ──────────────────────────────────────────
# Ключ узла, не мастера. Мастер и так ходит ssh на узлы, но его ключ в
# образе создал бы вторую дорогу к телу -- мимо единственного места, где
# проверяется проектирование. Агент сверяет проект субъекта с настоящим origin
# клона; ssh о проектах не знает ничего.
- name: A keypair of its own for reaching the bodies
  become_user: "{{ MOP_USER }}"
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N '' -C mop-body@{{ inventory_hostname }} -f {{ MOP_HOME }}/.ssh/mop-body
    creates: "{{ MOP_HOME }}/.ssh/mop-body"

- name: A known_hosts of its own for them
  become_user: "{{ MOP_USER }}"
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.ssh/known_hosts-mop-body"
    state: touch
    mode: "0600"
    access_time: preserve
    modification_time: preserve

# ── базовый образ ────────────────────────────────────────────────────
- name: The base image the project templates grow from
  ansible.builtin.shell: |
    set -e
    vol={{ MOP_PVE_TEMPLATE }}
    store=${vol%%:*}; file=${vol##*/}
    pveam list "$store" 2>/dev/null | grep -q "$file" && exit 0
    pveam update >/dev/null
    pveam download "$store" "$file"
  register: pve_image
  changed_when: "'download' in pve_image.stdout"

# ── дорога к телам снаружи (#59) ─────────────────────────────────────
# Тела за NAT узла, и снаружи до них одна дорога — через сам узел: FORWARD
# пропускает в обе стороны, MASQUERADE трогает только исходящие, серверу не
# хватало ровно маршрута (проверено на живом сервере 22.09: один `ip route
# add` — и тело отвечает за 0.146 мс). Здесь узел называет, ЧТО раздать:
# свой адрес со стороны сервера и блоки своего куска сети; раздаёт их
# серверу вторая игра deploy/pve.yml (tasks_from: server).
#
# Адрес — тот, с которого узел сам ходит на сервер (src у `ip route get`):
# именно он и есть следующий хоп для сервера, и повторять его в инвентаре
# вторым местом незачем.
#
# Имя резолвим здесь же, на узле: `ip route get` принимает адрес и только его,
# а MOP_SERVER_LAN — законно и имя (#98). Резолв в DNS-картине самого узла, а
# не контроллера: маршрут считает узел, и адрес ему нужен тот, который он сам
# получит. getent отвечает и на имя, и на адрес, так что обе формы настройки
# работают одинаково.
- name: The node's address as the server sees it
  ansible.builtin.shell: |
    set -eu
    addr="$(getent ahostsv4 {{ MOP_SERVER_LAN | quote }} | awk 'NR==1 {print $1}')"
    if [ -z "$addr" ]; then
        echo "this node cannot resolve {{ MOP_SERVER_LAN }}: the server must be" \
             "reachable by that name from every node" >&2
        exit 1
    fi
    ip -4 -o route get "$addr"
  register: pve_toward_server
  changed_when: false

# Блоки считает драйвер, на управляющей машине и с базой ЭТОГО узла: второе
# вычисление в jinja разошлось бы с формулой адреса молча, а формула —
# одна (pve.routes_of, проверена в tests/driver.py).
- name: Routes to this node's bodies, from the driver
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys
        sys.path.insert(0, sys.argv[1])
        from mop.driver import pve
        print(" ".join(pve.routes_of(sys.argv[2], int(sys.argv[3]))))
      - "{{ playbook_dir }}/.."
      - "{{ MOP_PVE_SUBNET }}"
      - "{{ pve_vmid_min }}"
  delegate_to: localhost
  become: no
  changed_when: false
  register: pve_route_list

- name: Name both for the server's play
  ansible.builtin.set_fact:
    pve_lan: "{{ pve_toward_server.stdout.split()[pve_toward_server.stdout.split().index('src') + 1] }}"
    pve_routes: "{{ pve_route_list.stdout.split() }}"
