# LLM-прокси на сервере (CLIProxyAPI, #380, эпик #379): подписки claude и
# codex и Anthropic-совместимые ключи (GLM) за одним /v1/messages для всех
# профилей папетов и мастера. Пул аккаунтов, ротация и refresh токенов --
# внутри прокси; узлы держат один токен прокси (secrets.env, #382), никаких
# секретов провайдеров на узлах больше нет.
#
# Сервер, как дашборд и шина: машина, включённая всегда, -- и единственная,
# кому положено быть освежителем чужих OAuth-токенов (провайдеры ротируют
# refresh-токен, второй освежитель убивал бы первый). Управление -- панелью
# самого прокси через TLS-прокси (/llm/, роль proxy), аккаунты лежат в его
# auth-dir на сервере.
#
# Ключи не задаются руками и не ездят по репозиторию: lookup('password')
# заводит файл в secrets/ при первом прогоне, как пароли шины. Клиентский
# ключ прокси потом уезжает узлам через secrets.env профиля (#382),
# management-ключ не покидает сервер: панель спрашивает его у человека,
# сервис будет читать aggregate'ом с петли (#383).
---
# Бинарь пиннуется версией из настроек, как nats-server: обновление --
# правка MOP_LLM_PROXY_VERSION и прогон. Распаковка -- в версионируемый
# каталог, а в /usr/local/bin бинарь ложит copy по содержимому: рестарт
# заказывают только настоящие обновления, а не каждый прогон.
- name: Release tarball of CLIProxyAPI
  ansible.builtin.get_url:
    url: "{{ llm_proxy_tgz }}"
    dest: "/tmp/cli-proxy-api-{{ MOP_LLM_PROXY_VERSION }}.tar.gz"
    mode: "0600"

- name: Unpacked release
  ansible.builtin.file:
    path: "/tmp/cli-proxy-api-{{ MOP_LLM_PROXY_VERSION }}"
    state: directory
    mode: "0700"

- name: Extract the release
  ansible.builtin.command:
    argv:
      - tar
      - -xzf
      - /tmp/cli-proxy-api-{{ MOP_LLM_PROXY_VERSION }}.tar.gz
      - -C
      - /tmp/cli-proxy-api-{{ MOP_LLM_PROXY_VERSION }}
      - cli-proxy-api
    creates: "/tmp/cli-proxy-api-{{ MOP_LLM_PROXY_VERSION }}/cli-proxy-api"

- name: The binary
  become: yes
  ansible.builtin.copy:
    src: "/tmp/cli-proxy-api-{{ MOP_LLM_PROXY_VERSION }}/cli-proxy-api"
    dest: /usr/local/bin/cli-proxy-api
    mode: "0755"
    remote_src: yes
  notify: restart mop-llm-proxy

# Дом прокси: конфиг и auth-dir с аккаунтами провайдеров. 0700 пользователю
# пула -- то же, что дому кредита claude (#281): секреты OAuth внутри.
- name: State dir of the LLM proxy
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/mop/llm-proxy"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0700"

# Панель (management.html) приезжает со сборкой, а не «latest на момент
# первого захода» (#525, инцидент #523: бинарник 8.0.16 при ассете 8.0.8).
# Ассет живёт в отдельном репозитории Management-Center со своей нумерацией
# -- потому и настройка отдельная, не MOP_LLM_PROXY_VERSION. Каталог static/
# обязан завести до get_url: тот родителей не создаёт, а прокси без env
# (юнит не задаёт ни WRITABLE_PATH, ни MANAGEMENT_STATIC_PATH) ищет панель
# ровно здесь -- «каталог конфига + static», fallback managementasset.StaticDir.
- name: Static dir for the baked panel
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/mop/llm-proxy/static"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0700"

- name: Baked panel of the management UI
  ansible.builtin.get_url:
    url: "{{ llm_proxy_panel_html }}"
    dest: "{{ MOP_HOME }}/.config/mop/llm-proxy/static/management.html"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0644"

# Конфиг -- только при начальной установке: дальше его редактирует человек
# панелью (провайдеры, ключи, модели), и повторный рендер стирал бы эти
# правки молча. Скелет шаблона -- то, с чего установка стартует; изменения
# скелета на живой установке вносятся руками по этому же шаблону.
- name: Is the config already there
  ansible.builtin.stat:
    path: "{{ MOP_HOME }}/.config/mop/llm-proxy/config.yaml"
  register: llm_proxy_conf

- name: Config, only at first install
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ MOP_HOME }}/.config/mop/llm-proxy/config.yaml"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0600"
  no_log: yes
  when: not llm_proxy_conf.stat.exists
  notify: restart mop-llm-proxy

# Переход на петлю для живой установки (#558): config.yaml после первой
# установки принадлежит панели, и повторный рендер стёр бы её правки. Правка
# адресная -- только поле server.host, и в двух формах файла: рендер первого
# запуска (YAML, «host: "0.0.0.0"» или без кавычек) и однострочный JSON,
# которым файл переписывает сам прокси по сохранению из панели
# («server":{"host":"0.0.0.0"»). Оба регэкспа привязаны к своей секции
# server -- чужой host-ключ (если панель заведёт свой) не трогается; ветка
# YAML начинается с \n, а не ^: модуль replace компилирует шаблон без
# флагов, и встроенные глобальные флаги посередине ломают компиляцию на
# Python 3.11+. Рестарт обязателен: смена host перевязывает листенер,
# hot-reload на неё не опираемся (наблюдатель перечитывает конфиг, но не
# адрес привязки); секундный простой LLM -- цена управляемого шага. no_log
# и без diff: в файле лежат клиентские ключи и хэш management-ключа, и лог
# CI-деплоя не должен их разносить. Идемпотентно: 127.0.0.1 уже в файле --
# совпадения нет, рестарта нет.
- name: Close the LLM API port on a live installation
  ansible.builtin.replace:
    path: "{{ MOP_HOME }}/.config/mop/llm-proxy/config.yaml"
    regexp: '(server:\n)([ \t]*)host:[ \t]*"?0\.0\.0\.0"?'
    replace: '\1\2host: "127.0.0.1"'
  when: MOP_LLM_PROXY_LAN == "0"
  no_log: yes
  notify: restart mop-llm-proxy

- name: Close the LLM API port in the panel's one-line JSON
  ansible.builtin.replace:
    path: "{{ MOP_HOME }}/.config/mop/llm-proxy/config.yaml"
    regexp: '("server"\s*:\s*\{\s*"host"\s*:\s*)"0\.0\.0\.0"'
    replace: '\g<1>"127.0.0.1"'
  when: MOP_LLM_PROXY_LAN == "0"
  no_log: yes
  notify: restart mop-llm-proxy

# Структурное подтверждение замены (#558): не только пробы портов ниже, но
# и сам файл -- from_yaml читает и YAML, и JSON, которым пишет панель.
# Ловит и возвращённое панелью 0.0.0.0, и регэксп, промахнувшийся мимо
# формы. Тоже no_log: содержимое файла -- не для журнала деплоя.
- name: Slurp the live proxy config
  ansible.builtin.slurp:
    src: "{{ MOP_HOME }}/.config/mop/llm-proxy/config.yaml"
  register: llm_proxy_live_conf
  no_log: yes
  when: MOP_LLM_PROXY_LAN == "0"

- name: The live config binds the loopback
  ansible.builtin.assert:
    that:
      - (llm_proxy_live_conf.content | b64decode | from_yaml).server.host == '127.0.0.1'
  no_log: yes
  when: MOP_LLM_PROXY_LAN == "0"

- name: Systemd unit
  become: yes
  ansible.builtin.template:
    src: mop-llm-proxy.service.j2
    dest: /etc/systemd/system/mop-llm-proxy.service
    mode: "0644"
  notify: restart mop-llm-proxy

- name: Enable and start
  become: yes
  ansible.builtin.systemd:
    name: mop-llm-proxy
    enabled: yes
    state: started
    daemon_reload: yes

- name: Apply the restart now, before the check
  ansible.builtin.meta: flush_handlers

# Прогоном, а не чтением статуса: юнит в бесконечном рестарте systemd вполне
# устраивает. /v1/models без аккаунтов отвечает пустым списком -- но ключ
# проверяет и он: 401 значил бы, что конфиг с другим ключом.
- name: The proxy answers on the LLM API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ MOP_LLM_PROXY_PORT }}/v1/models"
    headers:
      Authorization: "Bearer {{ llm_proxy_client_key }}"
    status_code: 200
  no_log: yes
  register: llm_proxy_health
  until: llm_proxy_health.status == 200
  retries: 20
  delay: 3

# Шлюз панели берёт ключ из закрытой копии, а живой config.yaml после
# первого рендера не обновляется. Одна проверка уже поднятого прокси ловит
# рассинхрон до выдачи панели: повторы 401 банят 127.0.0.1 на полчаса.
# Ни ключ, ни ответ config (с хэшем ключа) не попадают в вывод ansible.
- name: The panel gateway key is accepted by the proxy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ MOP_LLM_PROXY_PORT }}/v8/management/config"
    headers:
      Authorization: "Bearer {{ lookup('file', MOP_HOME + '/.config/mop/secrets/llm-proxy-mgmt.pass') }}"
    status_code: 200
  no_log: true

# Management API отвечает только с петли (allow-remote: false) -- прогон и
# спрашивает с неё. Снаружи этот же порт обязан молчать, и с флагом #558
# («закрыть») молчит весь сокет: соединение с LAN-адреса отвергнуто на
# уровне привязки, до любого HTTP-кода. Две ветки по флагу: закрытый порт
# ловит отказ соединения (wait_for state=stopped), открытый -- прежние коды
# авторизации management. Проба порта не проверяет ответ петли: её уже
# держит «The panel gateway key is accepted by the proxy» выше.
- name: The LAN socket of the LLM API is closed
  ansible.builtin.wait_for:
    host: "{{ MOP_SERVER_LAN }}"
    port: "{{ MOP_LLM_PROXY_PORT }}"
    state: stopped
    timeout: 5
  when: MOP_LLM_PROXY_LAN == "0"

- name: Management refuses non-localhost on the API port
  ansible.builtin.uri:
    url: "http://{{ MOP_SERVER_LAN }}:{{ MOP_LLM_PROXY_PORT }}/v8/management/credentials"
    status_code: [403, 401]
  register: llm_proxy_remote
  failed_when: llm_proxy_remote.status not in [401, 403, 404]
  when: MOP_LLM_PROXY_LAN == "1"
