# Хендлеры роли: перезапуски, которые заказывают задачи через notify.
- name: restart nats
  ansible.builtin.systemd:
    name: nats
    state: restarted
    daemon_reload: yes

# Новый users.conf без смены основного конфига: соединения не рвём.
# Не systemd reloaded: SIGHUP о своей судьбе не говорит, и отвергнутый
# конфиг nats держал бы молча, а прогон был бы зелёным (#211). Команда
# сверяет дайджест работающего конфига с файлом и валит прогон с причиной.
- name: reload nats
  become: yes
  become_user: "{{ MOP_USER }}"
  ansible.builtin.command: "{{ MOP_HOME }}/mop/bin/mop cluster reload"
  environment:
    MOP_NATS_MONITOR_PORT: "{{ MOP_NATS_MONITOR_PORT }}"


# Агент на рабочих узлах.
#
# Пакет mop возим здесь, хотя его же возит sandbox.yaml для MCP-сервера.
# Дубль осознанный: игра, которая запускает агента, обязана привезти его код
# сама. Пока она этого не делала, `mop deploy nats` после правки agent.py
# поднимал на узлах старый агент -- и первый же прогон это показал: креды в
# bus.json уже несли новое поле, а агент рядом о нём не знал и падал на
# соединении. Аварийный путь, зависящий от соседнего плейбука, -- не аварийный
# путь.
- name: restart mop-agent
  become: yes
  ansible.builtin.systemd:
    name: mop-agent
    state: restarted
    daemon_reload: yes


# Сервис auth callout (#206): после смены пакета -- на новом коде.
- name: restart mop-callout
  become: yes
  ansible.builtin.systemd:
    name: mop-callout
    state: restarted
    daemon_reload: yes
