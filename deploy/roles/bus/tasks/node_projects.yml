# Креды папетов на узле больше не лежат (#114): их привозит в тело ответ
# bootstrap'а (`mop driver run`, #83), и узел в покое не хранит ничего
# проектного. Раньше роль клала `bus-<проект>.json` на каждый узел, и
# поэтому `mop project add` ходил ansible'ом по всем узлам.
#
# Снимаем оставшиеся файлы только там, где тела -- контейнеры: на таком узле
# папет не живёт, и файл -- секрет в покое, которым никто не пользуется. На
# узле host тело и есть узел, и тот же путь пишет `mop driver run` для живого
# папета: сносить его значит выбить из-под сессии кред, которым её `mop mcp`
# ходит на шину.
- name: Bus credentials the node no longer keeps
  when: mop_driver | default(MOP_DRIVER) != 'host'
  become: yes
  ansible.builtin.find:
    paths: "{{ MOP_HOME }}/.config/mop"
    patterns: "bus-*.json"
  register: mop_bus_files

- name: Drop them
  when: mop_driver | default(MOP_DRIVER) != 'host'
  become: yes
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ mop_bus_files.files | default([]) | map(attribute='path') | list }}"
