# Агент шины на узле: пакет mop, зависимости, креды, юнит, сторож диска.
#
# Роль не несёт настроек: всё, что ей нужно, приходит переменными игры —
# они там и остались, потому что часть из них ленивая (mop_uid берётся из
# getent, который отрабатывает первой задачей).
- name: UID of the pool user on this node
  ansible.builtin.getent:
    database: passwd
    key: "{{ MOP_USER }}"

# Зависимости и пакет -- общими задачами (роль common, #157).
- ansible.builtin.include_role:
    name: common
    tasks_from: pip
  vars:
    pip_pool_user: true

- ansible.builtin.include_role:
    name: common
    tasks_from: package
  vars:
    package_dest: "{{ mop_home }}"

- name: A new package restarts the agent
  ansible.builtin.debug:
    msg: "mop package changed — restarting mop-agent"
  changed_when: mop_package is changed
  notify: restart mop-agent

# rsync кладёт файлы от того, кто зашёл; при входе root пакет в доме пула
# принадлежал бы root, и врапер под пользователем пула не смог бы даже
# писать __pycache__.
- name: The package belongs to the pool user
  become: yes
  ansible.builtin.file:
    path: "{{ mop_home }}"
    state: directory
    recurse: yes
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"

# Свой MCP-сервер (роль common). Только там, где claude и стоит: на узле,
# чьи тела — контейнеры, его регистрирует сборка образа, внутри тела.
- ansible.builtin.include_role:
    name: common
    tasks_from: mcp
  vars:
    mcp_pool_user: true
  when: mop_driver | default(MOP_DRIVER) == 'host'

# Только владелец: режим ~/.config -- дело машины, а не наш. Первый прогон
# с явным 0755 ослабил 0700 на двух узлах.
- name: Credentials dir
  become: yes
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"

- name: Credentials dir of mop
  become: yes
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/mop"
    state: directory
    mode: "0700"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"

# Что узел знает о себе сам. Источник правды -- инвентарь: значение группы
# с переопределением на хосте; чего инвентарь не назвал, берётся из
# настроек установки.
#
# Файлом, а не строками Environment= в юните агента: узловые настройки
# спрашивают двое с разным окружением -- агент из своего юнита и внешний
# врапер из процесса задачи Nomad. Пока драйвер жил в юните, врапер его не
# видел и молча поднимал папета драйвером host, то есть прямо на
# гипервизоре.
#
# Список -- из config.NODE_SCOPED, один на систему: второй здесь означал бы
# настройку, которая молча не доехала.
- name: What this node knows about itself
  become: yes
  ansible.builtin.copy:
    dest: "{{ MOP_HOME }}/.config/mop/node.env"
    mode: "0644"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    content: |
      # Узловые настройки. Кладёт `mop deploy` из инвентаря -- править
      # здесь бесполезно, следующий прогон перепишет.
      {% for k in MOP_NODE_SCOPED.split(',') %}
      {{ k }}={{ hostvars[inventory_hostname][k | lower] | default(lookup('vars', k, default='')) }}
      {% endfor %}
  notify: restart mop-agent

# Регистр разный по обе стороны, и это стоило узла: в инвентаре переменные
# пишут строчными (`mop_driver`), ключи настроек -- прописными
# (`MOP_DRIVER`). Пока шаблон искал ключ как есть, он не находил ничего,
# честно брал общее значение установки, и гипервизор объявлял себя узлом
# с драйвером host -- то есть врапер поднял бы папета прямо на
# гипервизоре, мимо тела. Прогон при этом зелёный.
#
# Отсюда проверка: сверяем то, что записали, с тем, что сказал инвентарь.
# Дешевле один assert, чем узел, который врёт о себе.
- name: Read back what the node now says about itself
  become: yes
  ansible.builtin.slurp:
    src: "{{ MOP_HOME }}/.config/mop/node.env"
  register: node_env

# slurp, а не lookup('file'): lookup читает файл на управляющей машине, и
# delegate_to этого не меняет. Первая же попытка сверяла узел сам с собой.
- name: What was written is what the inventory said
  ansible.builtin.assert:
    that:
      - "'MOP_DRIVER=' + (mop_driver | default(MOP_DRIVER)) in (node_env.content | b64decode).splitlines()"
    fail_msg: >-
      node.env on {{ inventory_hostname }} disagrees with the inventory about its
      driver — a node that lies about itself raises puppets in the wrong place
    success_msg: "{{ inventory_hostname }}: driver {{ mop_driver | default(MOP_DRIVER) }}"

# Переезд убирает за собой. rsync --exclude не сносит уже лежащее: он
# исключённое как раз бережёт, — поэтому старые копии убираются явно.
#
# Драйвер переехал в node.env вместе с остальными узловыми настройками: два
# места для одного ответа разошлись бы молча. Инвентарь узлу больше не
# нужен вовсе — всё своё он берёт из node.env, а карта установки (кто есть
# кто и где) дело контроллера, и она в inventory.yaml: старый inventory.ini
# сносится и на контроллере-узле тоже.
- name: What the node no longer needs
  become: yes
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ MOP_HOME }}/.config/mop/driver"
    - "{{ MOP_HOME }}/mop/inventory.ini"

- name: Bus credentials for the agent
  become: yes
  ansible.builtin.template:
    src: bus.json.j2
    dest: "{{ MOP_HOME }}/.config/mop/bus.json"
    mode: "0600"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
  notify: restart mop-agent

# Кредов папетов узел больше не хранит (#114): снимаем оставшиеся.
- ansible.builtin.include_tasks: node_projects.yml

# Ключ сервера для bootstrap'а песочниц (#62): публичная часть — узлу, и
# узел сам впускает сервер в тело на время bootstrap'а (admit) и выпускает
# после. В образ ключ не печётся: постоянно открытая дверь в тело мимо
# агента — то, от чего отказались для ключа мастера. Факт берётся с хоста
# сервера (игра ключа в deploy/setup.yml); прогон без сервера его не
# кладёт и не стирает.
- name: Public key of the server's bootstrap, for admitting it into a body
  become: yes
  ansible.builtin.copy:
    content: "{{ hostvars[groups['server'][0]]['mop_bootstrap_pub'] }}\n"
    dest: "{{ MOP_HOME }}/.config/mop/bootstrap.pub"
    mode: "0644"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
  when: hostvars[groups['server'][0]]['mop_bootstrap_pub'] is defined

# Где тело равно узлу, впускать и выпускать нечего: дверь на узел у
# сервера-контроллера и так есть, ключ лежит постоянно.
- name: The server may enter a node that is its own body
  become: yes
  ansible.posix.authorized_key:
    user: "{{ MOP_USER }}"
    key: "{{ hostvars[groups['server'][0]]['mop_bootstrap_pub'] }}"
    state: present
  when: >-
    hostvars[groups['server'][0]]['mop_bootstrap_pub'] is defined
    and (mop_driver | default(MOP_DRIVER)) == 'host'

# Токен Nomad возили на узлы, чтобы узловой mop mcp дотягивался до соседей
# и до инбокса мастера, и цена была названа прямо: папет, добравшийся до
# файла, мог снести чужие джобы. Шина даёт ту же связь правами по субъектам,
# поэтому полномочия узлам больше не нужны. Перестать раздавать мало --
# старая копия так и лежала бы.
#
# И на контроллере-узле тоже: свой токен mop держит в каталоге сервера
# (~/.config/mop/servers/<адрес>/), куда его кладёт игра сервера, а это --
# старое место, откуда его читали до #51.
- name: Drop the Nomad management token from the pool
  become: yes
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/nomad/bootstrap.json"
    state: absent

- name: Agent unit
  become: yes
  ansible.builtin.template:
    src: mop-agent.service.j2
    dest: /etc/systemd/system/mop-agent.service
    mode: "0644"
  notify: restart mop-agent

- name: Enable and start the agent
  become: yes
  ansible.builtin.systemd:
    name: mop-agent
    enabled: yes
    state: started
    daemon_reload: yes

- name: Flush handlers before checking
  ansible.builtin.meta: flush_handlers

# Дисковый сторож — объекты mop (клоны, target-каталоги), а не проекта,
# поэтому едет ядром, а не sandbox.yaml. Скрипт ставится на узлы, джоб
# регистрируется ниже отдельной игрой на сервере. Он обязан работать при
# выключенном мастере -- иначе теряется единственная уборка, которой всё
# равно (сироты не требуют суждений о живых папетах).
- name: Deploy the pu-sweep script (disk watchdog)
  become: yes
  ansible.builtin.copy:
    src: pu-sweep.sh
    dest: /usr/local/bin/pu-sweep
    mode: "0755"

# Прогон плейбука без этой проверки не отличает «юнит запущен» от «агент
# подписался»: systemd доволен процессом, который упал в реконнект.
- name: Confirm the agent is connected
  become: yes
  become_user: "{{ MOP_USER }}"
  ansible.builtin.command: /usr/bin/python3 -m mop.agent --check
  args:
    chdir: "{{ mop_home }}"
  environment:
    MOP_NODE: "{{ inventory_hostname }}"
    # Креды агент берёт только из своего узлового файла (bus.NODE_FILE), и
    # окружение мастер-шелла ему не указ: раньше на машине в двух ролях
    # проверка шла на шину как master-<проект>, и отказ прав читался как
    # «агент не подписан» при живом агенте (#1).
  changed_when: false
