# Сервер шины: NATS. Один на установку, на машине, которая включена всегда.
- name: Unpack nats-server {{ MOP_NATS_VERSION }}
  ansible.builtin.unarchive:
    src: "{{ nats_tgz }}"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/nats-server-v{{ MOP_NATS_VERSION }}-linux-amd64/nats-server"

- name: Install nats-server
  ansible.builtin.copy:
    src: "/tmp/nats-server-v{{ MOP_NATS_VERSION }}-linux-amd64/nats-server"
    dest: /usr/local/bin/nats-server
    remote_src: yes
    mode: "0755"
  notify: restart nats

# Каталог и конфиг -- пользователю пула: NATS работает под ним (#115).
- name: Config dir
  ansible.builtin.file:
    path: /etc/nats
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0700"

# Пользователи проектов: тот же файл, что играет узкий прогон
# `mop project add|delete` (deploy/projects.yml).
- ansible.builtin.include_tasks: projects.yml

- name: Systemd unit
  ansible.builtin.template:
    src: nats.service.j2
    dest: /etc/systemd/system/nats.service
    mode: "0644"
  notify: restart nats

- name: Enable and start
  ansible.builtin.systemd:
    name: nats
    enabled: yes
    state: started
    daemon_reload: yes
