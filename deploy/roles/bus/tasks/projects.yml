# Проекты пула на сервере: пользователи NATS. Отдельный файл, потому что это
# единственное, что делает `mop project add|delete` (deploy/projects.yml), и
# одновременно часть полной игры сервера — иначе узкий прогон и полный
# разошлись бы, и проект, заведённый одним, исчезал бы после другого.
#
# Пользователи считаются из реестра проектов (mop/projects.py), он приезжает
# сюда переменной mop_projects. Пустой список законен: пустой пул, мастеров
# ещё нет.
- name: Server config
  ansible.builtin.template:
    src: nats-server.conf.j2
    dest: /etc/nats/nats-server.conf
    # Пароли внутри: читает только пользователь пула, под которым служба и
    # ходит (#115).
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0600"
  notify: restart nats
