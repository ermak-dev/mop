# Пользователи шины на сервере (#116). Файл `/etc/nats/users.conf`, который
# основной конфиг включает в authorization, пишет не шаблон, а сервер:
# `mop cluster users` (mop/server/natsconf.py). Отсюда -- только то, что знает один
# контроллер: сервисы и узлы с их паролями, и реестр проектов. Людей в
# файле нет (#219): их пускает auth callout по провайдеру личностей.
#
# Проекты заводит и снимает сервис кластера (#117) тем же `mop/server/natsconf.py`,
# что и команда ниже: второго рендерера нет.

# Пароли -- здесь, на контроллере: lookup('password') заводит файл при
# первом прогоне и возвращает то же значение дальше. Словари -- set_fact в
# цикле: строка с {% set %} внутри осталась бы строкой, а не словарём.
- name: Nodes of the bus, with their passwords
  ansible.builtin.set_fact:
    mop_nodes_base: >-
      {{ mop_nodes_base | default({}) | combine({item:
           lookup('password', secrets_dir + '/nats-node-' + item + '.pass length=32 chars=ascii_letters,digits')}) }}
  loop: "{{ nats_nodes }}"
  no_log: true

- name: Base users of the bus -- services, nodes
  ansible.builtin.copy:
    content: >-
      {{ {'service': lookup('password', secrets_dir + '/nats-service.pass length=32 chars=ascii_letters,digits'),
          'callout': lookup('password', secrets_dir + '/nats-callout.pass length=32 chars=ascii_letters,digits'),
          'nodes': mop_nodes_base | default({})} | to_json }}
    dest: /etc/nats/base-users.json
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0600"
  no_log: true

# Реестр проектов живёт на сервере и правится глаголами сервиса (#117).
# Переход на снимок v1 (#534, #540): сервер с любым своим реестром --
# снимком, парой или даже осиротевшим limits.json -- authoritative, прогон
# его не трогает и ничего не мигрирует из playbook (миграция -- writer
# сервиса под замком). Авторитет и шире реестра: работающий mop-cluster --
# владелец даже пустого реестра, глагол может создать снимок в любой
# момент, stat пустоты того не опровергает, а force:no решает лишь в
# момент copy; посев идёт только при определённо не работающем сервисе
# («inactive»: на чистой установке плей шины идёт до роли cluster, и всё
# прочее -- active/failed/activating -- закрывает посев).
# Инициализация атомарна (#540): сеется ОДИН файл -- провалидированный
# снимок v1, который готовит префлайт `mop server deploy` на контроллере
# (строгий snapshot_of: v1 авторитетен, пара конвертируется с потолками,
# bare/коллизия/orphan/битый JSON -- отказ ДО плейбука) и передаёт сюда
# ПУТЕМ (mop_registry_seed), не сырым JSON: YAML ничего не парсит и не
# дублирует парсер. Один файл -- полупары не бывает: обрыв посева
# повторяется retry на всё ещё пустом сервере. Контроллер и сервер в
# одном HOME -- одна машина, посева нет: копия в себя -- это перезапись.
# Ручной ansible-прогон без extra-vars (пустой mop_registry_seed из
# group_vars) ничего не сеет.
- name: Staged registry seed on the controller
  ansible.builtin.stat:
    path: "{{ mop_registry_seed }}"
  when: mop_registry_seed != ''
  delegate_to: localhost
  become: no
  register: seed_file

- name: Registry of the server, v1 snapshot
  ansible.builtin.stat:
    path: "{{ MOP_HOME }}/.config/mop/projects.json"
  register: server_snapshot

- name: Registry of the server, legacy pair
  ansible.builtin.stat:
    path: "{{ MOP_HOME }}/.config/mop/projects"
  register: server_pair

- name: Limits on the server, a pair's half or an orphan
  ansible.builtin.stat:
    path: "{{ MOP_HOME }}/.config/mop/limits.json"
  register: server_limits

# Проба -- чтение systemd, ничего не меняет. failed_when: false: штатный
# неактивный сервис -- rc 3, и это законный ответ, не провал прогона;
# check_mode: false: сухой прогон тоже обязан знать состояние -- иначе
# факт не определён и сухой посев падает. Условие посева читает stdout:
# «inactive» и только; пустой stdout, «failed», «activating», «active» --
# посев закрыт.
- name: Cluster service, the registry's writer, is it running
  ansible.builtin.command: systemctl is-active mop-cluster
  register: cluster_service_running
  failed_when: false
  changed_when: false
  check_mode: false

- name: Registry of the projects, v1 snapshot, on the server, once
  when:
    - mop_registry_seed != ''
    - seed_file.stat.exists
    - lookup('env', 'HOME') != MOP_HOME
    - cluster_service_running.stdout == 'inactive'
    - not server_snapshot.stat.exists
    - not server_pair.stat.exists
    - not server_limits.stat.exists
  ansible.builtin.copy:
    src: "{{ mop_registry_seed }}"
    dest: "{{ MOP_HOME }}/.config/mop/projects.json"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0600"
    force: no

# Перезагружать ли nats, решает сам файл: контрольная сумма до команды и
# после (#199). Не вывод: команда на успехе молчит (#182), и чтение
# «, changed» из её вывода молча оставило новый узел без пользователя шины --
# агент получил «Authorization Violation», а nats не перечитывал файл сутки.
- name: Users file of the bus, before
  become: yes
  ansible.builtin.stat:
    path: /etc/nats/users.conf
    get_checksum: yes
  register: nats_users_before

# Блок auth callout (#206) -- свой файл: его смену nats reload'ом не берёт
# («config reload not supported for AuthCallout»), только рестартом.
- name: Callout file of the bus, before
  become: yes
  ansible.builtin.stat:
    path: /etc/nats/callout.conf
    get_checksum: yes
  register: nats_callout_before

- name: Users file of the bus, written by the server
  become: yes
  become_user: "{{ MOP_USER }}"
  ansible.builtin.command: "{{ MOP_HOME }}/mop/bin/mop cluster users"
  environment:
    MOP_SERVER_LAN: "{{ MOP_SERVER_LAN }}"
    MOP_NATS_PORT: "{{ MOP_NATS_PORT }}"
  changed_when: false

- name: Callout file of the bus, after
  become: yes
  ansible.builtin.stat:
    path: /etc/nats/callout.conf
    get_checksum: yes
  register: nats_callout_after
  changed_when: >-
    nats_callout_after.stat.checksum | default('') !=
    nats_callout_before.stat.checksum | default('')
  notify: restart nats

- name: Users file of the bus, after
  become: yes
  ansible.builtin.stat:
    path: /etc/nats/users.conf
    get_checksum: yes
  register: nats_users_after
  changed_when: >-
    nats_users_after.stat.checksum | default('') !=
    nats_users_before.stat.checksum | default('')
  notify: reload nats

# Люди для сервисов сервера: callout (#206) и глагол identity у
# mop-bootstrap (#167, имя и почта владельца задания для git identity
# клона). Провайдер личностей читает файл операторов из secrets/
# контроллера, куда учётке пула хода нет; сервисы читают копию в
# /etc/nats/identity, 0600 (identity.server_provider). Копия есть всегда
# (#219): людей даёт только провайдер, а callout включён всегда.
- name: Operators file on the controller
  ansible.builtin.stat:
    path: "{{ MOP_OPERATORS_FILE or (secrets_dir + '/operators') }}"
  delegate_to: localhost
  become: no
  register: operators_file

- name: Identity for the server's services
  block:
    - name: Identity dir of the server's services
      ansible.builtin.file:
        path: /etc/nats/identity
        state: directory
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: "0700"

    - name: Operators file for the server's services
      ansible.builtin.copy:
        src: "{{ MOP_OPERATORS_FILE or (secrets_dir + '/operators') }}"
        dest: /etc/nats/identity/operators
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: "0600"
      when: operators_file.stat.exists

    - name: No operators file on the controller, none for the services
      ansible.builtin.file:
        path: /etc/nats/identity/operators
        state: absent
      when: not operators_file.stat.exists

    # Пароль служебной учётки LDAP (#214): в .env контроллера, плейбукам
    # --extra-vars не едет; mop deploy отдаёт его окружением процесса
    # ansible (lib.play_env), только когда ldap -- звено MOP_AUTH_PROVIDER
    # (список через запятую, #232; имена его проверил mop deploy). Файлом,
    # не окружением юнита: юнит читаем всем.
    - name: LDAP bind password for the identity copy
      when: "'ldap' in MOP_AUTH_PROVIDER.replace(' ', '').split(',')"
      ansible.builtin.copy:
        content: "{{ lookup('env', 'MOP_LDAP_BIND_PASSWORD') }}\n"
        dest: /etc/nats/identity/ldap-bind.pass
        owner: "{{ MOP_USER }}"
        group: "{{ MOP_USER }}"
        mode: "0600"
      no_log: true

    - name: No LDAP bind password without the ldap provider
      when: "'ldap' not in MOP_AUTH_PROVIDER.replace(' ', '').split(',')"
      ansible.builtin.file:
        path: /etc/nats/identity/ldap-bind.pass
        state: absent
