# Сервис auth callout (#206, mop/server/callout.py): nats спрашивает его на каждом
# входе человека и папета. Всегда (#219): людей в users.conf нет, и без него
# на шину не вошёл бы никто, кроме машин.
#
# После шины: сервису нужен её пользователь callout, а до рестарта nats он
# переподключается сам. Ключи издателя и xkey уже завёл `mop cluster users`
# (projects.yml) -- рядом с конфигом nats, 0600.
- name: Callout service
  block:
    - name: Systemd unit of the callout
      become: yes
      ansible.builtin.template:
        src: "{{ role_path }}/../common/templates/service.j2"
        dest: /etc/systemd/system/mop-callout.service
        mode: "0644"
      vars:
        unit:
          name: mop-callout
          description: "mop-callout (auth callout шины: кто входит, решает провайдер личностей)"
          after: network-online.target nats.service
          # Окружение -- config.SERVER_SCOPED (#176); здесь только комментарии к нему.
          notes:
            MOP_NATS_PORT: |-
              # Шина на петле. Пароль пользователя callout, сиды издателя и xkey --
              # файлами 0600 в /etc/nats, не здесь: юнит читаем всем.
          command: callout
      notify: restart mop-callout

    - name: The package changed under the callout
      ansible.builtin.debug:
        msg: "mop package changed on the server — restarting mop-callout"
      changed_when: (mop_server_package | default({})) is changed or (mop_server_version | default({})) is changed
      notify: restart mop-callout

    - name: Enable and start the callout
      become: yes
      ansible.builtin.systemd:
        name: mop-callout
        enabled: yes
        state: started
        daemon_reload: yes
