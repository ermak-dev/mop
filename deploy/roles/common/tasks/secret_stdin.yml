# Секрет в команду -- через stdin, из файла 0600, который снимается в любом
# исходе (#102, #157). Не аргументом: так он попал бы в список процессов и в
# лог задачи. `no_log` -- только на записи файла: пока метка висела на самой
# команде, отказ приходил без единого слова -- «the output has been hidden»,
# -- хотя обёртка пишет причину внятно.
#
# Параметры: secret_value -- секрет (пусто законно); secret_prefix -- префикс
# файла; secret_step -- имя шага; secret_cmd -- команда, stdin которой --
# файл; secret_retries/secret_delay -- повторы шага (по умолчанию нет).
- block:
    - name: A file to hand the secret over by
      ansible.builtin.tempfile:
        state: file
        prefix: "{{ secret_prefix }}"
      register: secret_file

    - name: The secret itself
      ansible.builtin.copy:
        content: "{{ secret_value }}"
        dest: "{{ secret_file.path }}"
        mode: "0600"
      no_log: true

    - name: "{{ secret_step }}"
      ansible.builtin.shell:
        cmd: "{{ secret_cmd }} < {{ secret_file.path | quote }}"
      register: secret_run
      # Без повторов условие истинно сразу, и отказ команды остаётся отказом.
      until: (secret_run.rc | default(0)) == 0 or (secret_retries | default(0) | int) == 0
      retries: "{{ secret_retries | default(0) }}"
      delay: "{{ secret_delay | default(0) }}"
      changed_when: true
  always:
    - name: The secret file goes away whatever happened
      ansible.builtin.file:
        path: "{{ secret_file.path }}"
        state: absent
      when: secret_file.path is defined
