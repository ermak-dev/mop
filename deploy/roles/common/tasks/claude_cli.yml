# Клиент claude для пользователя пула -- одно определение на тело и на
# контроллер (#293). В теле он и есть папет; на контроллере его водят
# сервисы реестра кредитов (#281): `claude auth login` в pty, `auth status`,
# keep-alive `claude -p` в доме кредита. Ставит install.sh в
# ~/.local/bin/claude пользователя, юнитам PATH менять не надо: сервер ищет
# клиент и там (#292).
#
# claude_cli_user / claude_cli_home -- кому ставить; по умолчанию
# пользователь пула и его дом, как везде в deploy.
#
# pipefail и проверка результата — не перестраховка. `shell` исполняет строку
# через /bin/sh без pipefail, и код возврата конвейера `curl | bash` — это код
# bash: оборванная загрузка даёт ему пустой ввод, он выходит нулём, и задача
# зелёная. Тело уезжает в шаблон без claude, а папет в таком теле не поднимется
# никогда. Поймано на сборке образа cloudpub: отказ всплыл восемью задачами
# позже, в другой игре, как `exec: claude: not found` (#11).
#
# `creates` от этого не спасает и не для того: оно решает, надо ли запускать, а
# не удалось ли.
# retries: загрузка -- сто метров через NAT тела, и транзитный обрыв TLS
# (SSL_read eof) ронял всю сборку, хотя путь рабочий: три образа через него
# уже прошли. Повторы переживают обрыв; отказ после них остаётся громким.
- name: Install the claude CLI
  become: yes
  become_user: "{{ claude_cli_user | default(MOP_USER) }}"
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://claude.ai/install.sh | bash
    test -x "{{ claude_cli_home | default(MOP_HOME) }}/.local/bin/claude"
  args:
    creates: "{{ claude_cli_home | default(MOP_HOME) }}/.local/bin/claude"
    executable: /bin/bash
  register: claude_cli_install
  retries: 4
  delay: 15
  until: claude_cli_install is success
