# Чем обязано быть ТЕЛО — задачами, а не игрой.
#
# Отдельный файл, потому что зовут его ДВОЕ и по разным группам: deploy/body.yml
# по узлам, которые сами себе тело, и deploy/pve-build.yml по контейнеру,
# который вот-вот станет образом шарда. Второе определение «чем обязано быть
# тело» разошлось бы с первым молча — и упало бы не на прогоне, а на первом
# клоне папета.
- name: Ensure the tools a puppet works with
  become: yes
  ansible.builtin.apt:
    name:
      - git
      - tmux
      - jq
      - rsync
      - curl
      - python3
      - python3-pip
    state: present

# Без линжера в теле не появится /run/user/<uid>: session.py не найдёт каталог
# сокетов сессий, уйдёт на запасной путь, где никого нет, и ЖИВЫЕ папета будут
# читаться мёртвыми. Та же ловушка, что записана про XDG_RUNTIME_DIR в юните
# агента, только с другой стороны.
- name: A session bus that survives the last logout
  become: yes
  ansible.builtin.command: "loginctl enable-linger {{ MOP_USER }}"
  args:
    creates: "/var/lib/systemd/linger/{{ MOP_USER }}"

# Нативный установщик, а не npm: claude кладёт себя в ~/.local/share/claude
# и симлинкует в ~/.local/bin -- ровно туда, куда смотрит MOP_PUPPET_PATH.
# Под пользователем пула, а не под root: PATH папета -- это его домашний
# каталог, и claude из /root тело бы не увидело.
#
# creates, а не state=latest: ставим один раз, дальше claude обновляет себя
# сам, и прогон deploy не имеет права подменить версию под работающим папетом.
#
# pipefail и проверка результата — не перестраховка. `shell` исполняет строку
# через /bin/sh БЕЗ pipefail, и код возврата конвейера `curl | bash` — это код
# bash: оборванная загрузка даёт ему пустой ввод, он выходит нулём, и задача
# зелёная. Тело уезжает в шаблон БЕЗ claude, а папет в таком теле не поднимется
# никогда. Поймано на сборке образа cloudpub: отказ всплыл восемью задачами
# позже, в другой игре, как `exec: claude: not found`.
#
# `creates` от этого не спасает и не для того: оно решает, НАДО ли запускать, а
# не удалось ли.
- name: Install the claude CLI
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://claude.ai/install.sh | bash
    test -x "{{ MOP_HOME }}/.local/bin/claude"
  args:
    creates: "{{ MOP_HOME }}/.local/bin/claude"
    executable: /bin/bash

# ENV-ФАЙЛЫ, НАЗВАННЫЕ МАНИФЕСТОМ ШАРДА (#30/#25). ИМЕНА объявляет проект
# (env_files в vars своего mop.yaml), БАЙТЫ возит установка: секреты в git
# не попадают, из origin их привезти нельзя, и источник один — рабочая копия
# проекта на управляющей машине. Врапер копирует их из ~/puppet-env/<шард>
# в каждый заводимый клон — то есть эти задачи часть того, чем тело ОБЯЗАНО
# быть, и место им здесь, в роли, а не в files установки: у роли два
# вызывающих (прогон по узлам и сборка образа), и определение одно.
#
# Прав НЕ выше пользователя пула: каталоги его, файлы его. Нет объявленных
# файлов — нечего возить, задачи молча пусты; объявлен отсутствующий на
# мастере — ГРОМКО: проект попросил то, чего установка дать не может.
- name: puppet-env dir of each shard that named its env files
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/puppet-env/{{ item.shard }}"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0700'
  loop: "{{ mop_env_files | default([]) }}"
  loop_control:
    label: "{{ item.shard }}"

- name: Project env files, named by the project itself
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/{{ item.shard }}/{{ item.file }}"
    dest: "{{ MOP_HOME }}/puppet-env/{{ item.shard }}/"
    # владелец ЯВНО: в сборке образа роль исполняется под root, и без
    # этого файлы стали бы root-only -- врапер пользователя пула не
    # прочитал бы собственные env файлы.
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0600'
  loop: "{{ mop_env_files | default([]) }}"
  loop_control:
    label: "{{ item.shard }}/{{ item.file }}"
