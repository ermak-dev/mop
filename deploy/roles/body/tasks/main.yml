# Чем обязано быть тело — задачами, а не игрой.
#
# Отдельный файл, потому что зовут его двое и по разным группам: deploy/body.yml
# по узлам, которые сами себе тело, и deploy/pve-build.yml по контейнеру,
# который вот-вот станет образом проекта. Второе определение «чем обязано быть
# тело» разошлось бы с первым молча — и упало бы не на прогоне, а на первом
# клоне папета.
- name: Ensure the tools a puppet works with
  become: yes
  ansible.builtin.apt:
    name:
      - git
      - tmux
      - jq
      - rsync
      - curl
      - python3
      - python3-pip
    state: present

# Без линжера в теле не появится /run/user/<uid>: session.py не найдёт каталог
# сокетов сессий, уйдёт на запасной путь, где никого нет, и живые папета будут
# читаться мёртвыми. Та же ловушка, что записана про XDG_RUNTIME_DIR в юните
# агента, только с другой стороны.
- name: A session bus that survives the last logout
  become: yes
  ansible.builtin.command: "loginctl enable-linger {{ MOP_USER }}"
  args:
    creates: "/var/lib/systemd/linger/{{ MOP_USER }}"

# Нативный установщик, а не npm: claude кладёт себя в ~/.local/share/claude
# и симлинкует в ~/.local/bin -- ровно туда, куда смотрит MOP_PUPPET_PATH.
# Под пользователем пула, а не под root: PATH папета -- это его домашний
# каталог, и claude из /root тело бы не увидело. become_user, а не
# «кто зашёл, тот и ставит»: на Proxmox ansible заходит как root.
#
# creates, а не state=latest: ставим один раз, дальше claude обновляет себя
# сам, и прогон deploy не имеет права подменить версию под работающим папетом.
#
# Клиент claude -- общей задачей (roles/common/tasks/claude_cli.yml, #293):
# то же определение ставит его на контроллер для реестра кредитов, и ловушка
# кода bash из #11 живёт в одном месте.
- ansible.builtin.include_role:
    name: common
    tasks_from: claude_cli

# /tmp в теле — tmpfs, и её размер systemd просит у ядра процентами
# (`size=50%` в /usr/lib/systemd/system/tmp.mount). Проценты считает ядро, от
# НАСТОЯЩЕЙ памяти машины, а не от лимита cgroup: lxcfs подменяет файл
# /proc/meminfo, но не внутреннюю арифметику tmpfs. Замерено 22.09 на теле
# pu-rugent-2: 8 ГБ памяти внутри, `df -h /tmp` показывает 63 ГБ — половину
# памяти гипервизора.
#
# Опасно это тем, что tmpfs — ЭТО память. Тело, записавшее в /tmp несколько
# гигабайт, убивает себя OOM'ом (swap'а у тела нет), а `df` до последнего
# показывает десятки свободных гигабайт. Явный размер превращает эту смерть в
# обычный ENOSPC, который видно и в котором виноват тот, кто пишет.
#
# mode=1777 повторяет умолчание systemd намеренно: /tmp общий для всех
# пользователей тела, и его приватность уже однажды стоила молчаливого
# отключения проверки подписей apt.
#
# Только для тел-контейнеров: `mop_body_of` ставит add_host сборки образа
# (deploy/pve-build.yml). На host-узле роль играет по самому узлу, и его /tmp
# принадлежит машине целиком — трогать его правом проекта не является.
# become: yes здесь обязателен и не наследуется: обе игры, включающие эту
# роль, идут с `become: no` (deploy/body.yml и deploy/pve-build.yml), а
# каждая задача называет своё сама — установщик claude, например, нарочно
# идёт от пользователя пула. Без него сборка образа падает на
# `Permission denied: /etc/systemd/system/tmp.mount.d`, и падает громко:
# ansible прерывает прогон, образ остаётся незапечатанным, а прежний
# шаблон к тому моменту уже снесён.
- name: A /tmp sized by this body, not by the hypervisor
  become: yes
  when: mop_body_of is defined
  block:
    - name: Where the tmp.mount override goes
      ansible.builtin.file:
        path: /etc/systemd/system/tmp.mount.d
        state: directory
        mode: '0755'

    - name: The override itself
      ansible.builtin.copy:
        dest: /etc/systemd/system/tmp.mount.d/mop-size.conf
        mode: '0644'
        content: |
          # Set by mop (deploy/roles/body): a percentage here is resolved by
          # the kernel from the HYPERVISOR's memory, not this body's.
          [Mount]
          Options=mode=1777,strictatime,nosuid,nodev,size=2G,nr_inodes=1m

    - name: Let systemd see it
      ansible.builtin.systemd_service:
        daemon_reload: yes
