# Дашборд пула на сервере: пакет mop, зависимости, креды мастера, юнит.
#
# Сервер, а не узел: дашборд читает пул как мастер — по токену Nomad и под
# admin шины, — а узлам ни того ни другого не дают. И не машина оператора:
# страница нужна тогда, когда мастер-шелл закрыт.
#
# Креды кладутся в тот же каталог, откуда их читает любой мастер
# (~/.config/mop/servers/<адрес>/, mop/common/creds.py): дашборд — тот же клиент,
# что и `mop list`, и второго способа представиться шине у него нет.
# Пакет и зависимости уже на сервере: их кладёт игра сервера NATS
# (tasks/package.yml, #116). Рестарт дашборда -- по результату того синка.
- name: The package changed under the dashboard
  ansible.builtin.debug:
    msg: "mop package changed on the server — restarting mop-web"
  changed_when: (mop_server_package | default({})) is changed or (mop_server_version | default({})) is changed
  notify: restart mop-web

# Всё в каталоге кредов -- пользователю пула: сервисы читают его под ним, а
# ansible на сервере может заходить и root'ом (#108), и тогда 0600 от root
# был бы для них закрыт.
- name: Credentials dir of the server, closed like the master's
  become: yes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0700"
  loop:
    - "{{ MOP_HOME }}/.config/mop"
    - "{{ MOP_HOME }}/.config/mop/servers"
    - "{{ MOP_HOME }}/.config/mop/servers/{{ MOP_SERVER_LAN }}"

# Кем сервер представляется шине (#104): машинный пользователь service, а
# не admin, чей пароль общий с людьми. Файл тот же, что у оператора после
# `mop join --user` (creds.operator): «кто эта машина на шине». Пароль --
# тот же lookup, что видит nats-server.
- name: Bus identity of the server's services
  ansible.builtin.copy:
    content: "{{ {'user': 'service', 'password': lookup('password', secrets_dir + '/nats-service.pass length=32 chars=ascii_letters,digits')} | to_json }}"
    dest: "{{ MOP_HOME }}/.config/mop/servers/{{ MOP_SERVER_LAN }}/operator.json"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0600"
  no_log: true
  # Переживает игру: по нему перезапускаются mop-bootstrap и mop-cluster.
  register: mop_server_identity
  notify: restart mop-web

# Переход: пароль admin, лежавший здесь до #104, серверу больше не нужен.
- name: No admin password on the server
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/mop/servers/{{ MOP_SERVER_LAN }}/nats-admin.pass"
    state: absent
  notify: restart mop-web

# Самоподписанный сертификат TLS-прокси (#97): сервисы сервера ходят на
# шину через прокси, как любой клиент каталога сервера, и закрепляют его так
# же. С настоящим (MOP_TLS_CERT) пин снимается: он отверг бы настоящий.
- name: Pinned certificate of the TLS proxy
  ansible.builtin.copy:
    src: "{{ secrets_dir }}/tls.pem"
    dest: "{{ MOP_HOME }}/.config/mop/servers/{{ MOP_SERVER_LAN }}/tls.pem"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0600"
  when: not MOP_TLS_CERT
  notify: restart mop-web

- name: No pin with a real certificate
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/mop/servers/{{ MOP_SERVER_LAN }}/tls.pem"
    state: absent
  when: MOP_TLS_CERT | length > 0
  notify: restart mop-web

# Токен Nomad -- из каталога сервера на контроллере: туда его забирает игра
# сервера Nomad (deploy/nomad), и она в site.yml идёт раньше этой.
- name: Management token of Nomad
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.config/mop/servers/{{ MOP_SERVER_LAN }}/bootstrap.json"
    dest: "{{ MOP_HOME }}/.config/mop/servers/{{ MOP_SERVER_LAN }}/bootstrap.json"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0600"
  notify: restart mop-web

- name: Systemd unit
  become: yes
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/service.j2"
    dest: /etc/systemd/system/mop-web.service
    mode: "0644"
  vars:
    unit:
      name: mop-web
      description: "mop-web (дашборд пула: состояние по HTTP)"
      after: network-online.target nats.service
      # Окружение -- config.SERVER_SCOPED (#176); здесь только комментарии к нему.
      notes:
        MOP_SERVER_LAN: |-
          # .env на сервер не едет, а адрес сервера обязателен: без него config
          # отказывается работать (и правильно). Окружение старше .env, поэтому
          # юнит и есть источник этой настройки на сервере.
        MOP_HTTPS_PORT: "# Каталог сервера ходит на шину через TLS-прокси (#97)."
      before_exec:
        - "# Через диспетчер: он ставит PYTHONPATH, без него командлет пакета не найдёт."
      command: "web --port {{ MOP_WEB_PORT }} --bind {{ MOP_WEB_BIND }}"
  notify: restart mop-web

- name: Enable and start
  become: yes
  ansible.builtin.systemd:
    name: mop-web
    enabled: yes
    state: started
    daemon_reload: yes

- name: Apply the restart now, before the check
  ansible.builtin.meta: flush_handlers

# Прогоном, а не чтением статуса: юнит в бесконечном рестарте systemd вполне
# устраивает. Первый снимок ждёт ростера Nomad и ответа узлов -- секунды.
# На самом сервере и по MOP_WEB_BIND: снаружи дашборд виден только через
# TLS-прокси (#96), и его проверка -- в роли proxy.
- name: The dashboard answers with a snapshot
  ansible.builtin.uri:
    url: "http://{{ '127.0.0.1' if MOP_WEB_BIND == '0.0.0.0' else MOP_WEB_BIND }}:{{ MOP_WEB_PORT }}/healthz"
    status_code: 200
  register: web_health
  until: web_health.status == 200
  retries: 20
  delay: 3

# С контроллера и по имени: так ходит оператор, и проверка видит то же, что
# он, -- резолв, сертификат на это имя и прокси до дашборда (#96).
- name: The dashboard answers through the TLS proxy
  delegate_to: localhost
  ansible.builtin.uri:
    url: "https://{{ MOP_SERVER_LAN }}:{{ MOP_HTTPS_PORT }}/healthz"
    ca_path: "{{ omit if MOP_TLS_CERT else secrets_dir + '/tls.pem' }}"
    status_code: 200
  register: proxy_health
  until: proxy_health.status == 200
  retries: 10
  delay: 3
