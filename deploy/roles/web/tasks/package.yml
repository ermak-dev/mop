# Пакет mop и его зависимости на сервере. Отдельным файлом (#116): его
# играет первой игра сервера NATS -- пользователей шины пишет `mop cluster
# users`, то есть пакет обязан лежать на сервере раньше шины. Роль web его
# больше не играет: второй синк ничего не менял бы, а результат первого
# (mop_server_package) переписал бы на «без изменений», и сервисы остались
# бы на старом коде.
# Зависимости и пакет -- общими задачами (роль common, #157); пакет --
# пользователю пула, кем бы ни зашёл ansible (#108).
- ansible.builtin.include_role:
    name: common
    tasks_from: pip
  vars:
    pip_pool_user: true

- ansible.builtin.include_role:
    name: common
    tasks_from: package
  vars:
    package_dest: "{{ MOP_HOME }}/mop"
    package_chown: true

# Результат синка переживает игру: по нему перезапускаются сервисы сервера,
# и mop-bootstrap тоже (роль bootstrap) -- тот же пакет в том же каталоге.
# Своим именем: на машине, которая и сервер, и узел, синк агента писал бы
# в тот же mop_package.
- name: Remember what the server's sync did
  ansible.builtin.set_fact:
    mop_server_package: "{{ mop_package }}"

# Синк -- не единственный признак нового кода (#122). Там, где контроллер --
# сам сервер под пользователем пула, источник и цель синка -- один каталог,
# синк всегда «без изменений», и сервисы годами работали бы на коде, с
# которым стартовали. Отпечаток версии -- HEAD, состояние и правки рабочей
# копии контроллера; изменился он -- сервисы перезапускаются так же, как по
# синку.
- name: Version of the package on the control machine
  delegate_to: localhost
  become: no
  ansible.builtin.shell:
    cmd: >-
      { git rev-parse HEAD; git status --porcelain; git diff HEAD; }
      | sha256sum | cut -d' ' -f1
    chdir: "{{ mop_source }}"
  register: mop_package_fingerprint
  changed_when: false
  # Только читает, и её результат нужен и прогону без изменений (#184).
  check_mode: false

# Каталог заводит и роль web, но она играется позже, а на свежем сервере
# его ещё нет.
- name: Config dir of the pool user, for the version
  become: yes
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/mop"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0700"

- name: Version of the package the server's services run
  become: yes
  ansible.builtin.copy:
    content: "{{ mop_package_fingerprint.stdout }}\n"
    dest: "{{ MOP_HOME }}/.config/mop/package.version"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0644"
  register: mop_server_version

