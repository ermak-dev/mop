# Агент Nomad: бинарь, конфиг клиента, systemd-юнит.
#
# Одна роль на оба лица кластера: клиент (этот файл) стоит на каждом узле пула
# и на управляющей машине, сервер (server.yml) — на одной. Общий у них бинарь,
# и дублировать его загрузку значило бы две версии в двух местах.
#
# Роль НЕ несёт настроек: ниже только ВЫВОД из тех, что уже пришли через
# --extra-vars. Версия и зеркало — это config.SETTINGS, и второй ярус
# старшинства (defaults роли) сломал бы цепочку молча.
- name: Where nomad comes from
  ansible.builtin.set_fact:
    nomad_version: "{{ MOP_NOMAD_VERSION }}"
    nomad_zip: "{{ MOP_NOMAD_MIRROR }}/nomad/{{ MOP_NOMAD_VERSION }}/nomad_{{ MOP_NOMAD_VERSION }}_linux_amd64.zip"

- name: Ensure unzip is present
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Download nomad {{ nomad_version }}
  ansible.builtin.get_url:
    url: "{{ nomad_zip }}"
    dest: "/tmp/nomad_{{ nomad_version }}.zip"
    mode: '0644'

- name: Install nomad binary
  ansible.builtin.unarchive:
    src: "/tmp/nomad_{{ nomad_version }}.zip"
    dest: /usr/local/bin
    remote_src: yes
    mode: '0755'

- name: Create config and data dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/nomad
    - /opt/nomad/data

- name: Deploy client config
  ansible.builtin.template:
    src: client.hcl.j2
    dest: /etc/nomad/client.hcl
    mode: '0644'
  register: client_config

- name: Install systemd unit
  ansible.builtin.template:
    src: nomad.service.j2
    dest: /etc/systemd/system/nomad.service
    mode: '0644'
  vars:
    nomad_user: root
    nomad_config: /etc/nomad/client.hcl
  register: client_unit

- name: Start nomad client
  ansible.builtin.systemd:
    name: nomad
    state: "{{ (client_config.changed or client_unit.changed) | ternary('restarted', 'started') }}"
    enabled: yes
    daemon_reload: yes
