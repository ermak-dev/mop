# Сервер Nomad: бинарь, конфиг, юнит, bootstrap ACL.
#
# Отдельным файлом задач, а не main.yml, потому что у роли два лица: клиент
# (main.yml) стоит на каждом узле пула, сервер — на одной машине. Общего у них
# только бинарь, и его загрузка -- одна, в роли common (#157).
#
# Роль не несёт настроек: версия, зеркало и порты приходят из config.SETTINGS
# через --extra-vars.
- ansible.builtin.include_role:
    name: common
    tasks_from: nomad_bin

- name: Where nomad lives here
  ansible.builtin.set_fact:
    nomad_home: "{{ MOP_NOMAD_DATA | dirname }}"

# Какой адрес сервер объявляет клиентам (#109). Nomad резолвит advertise на
# САМОМ сервере и раздаёт узлам полученный IP. Имя хоста на сервере обычно
# смотрит в loopback: Debian и Proxmox (LXC по DHCP) пишут в /etc/hosts
# `127.0.1.1 <fqdn> <имя>`, и узлы получали собственный 127.0.1.1 -- down.
# Поэтому: имя, которое здесь резолвится в loopback, заменяем адресом, с
# которого сервер ходит наружу (src маршрута по умолчанию). Проверка именно
# на loopback, а не «резолвится ли»: домен поиска с wildcard-DNS резолвит и
# несуществующее имя.
- name: How MOP_SERVER_LAN resolves on the server itself
  ansible.builtin.command: getent ahostsv4 {{ MOP_SERVER_LAN }}
  register: server_name_here
  changed_when: false
  # Только читает, и её результат нужен и прогону без изменений (#184).
  check_mode: false
  failed_when: false

# `ip route get` пакетов не шлёт: только спрашивает таблицу маршрутов.
- name: Address of the server's default route
  ansible.builtin.command: ip -4 route get 1.1.1.1
  register: server_route
  changed_when: false
  # Только читает, и её результат нужен и прогону без изменений (#184).
  check_mode: false

- name: Address the server advertises to its clients
  ansible.builtin.set_fact:
    nomad_advertise: >-
      {{ (server_route.stdout | regex_search('src (\S+)', '\1') | first)
         if (server_name_here.stdout.split() | first | default('127.0.0.1')) is match('^127\.')
         else MOP_SERVER_LAN }}

# Владелец -- пользователь пула, под которым работает сервер (nomad_user
# ниже), а не тот, кем ansible зашёл: на сервере с root'ом каталог данных
# доставался root'у, и Nomad не мог в него писать (#108).
- name: Create nomad data dir
  become: yes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0755'
  loop:
    - "{{ nomad_home }}"
    - "{{ nomad_home }}/data"

- name: Deploy server config
  become: yes
  ansible.builtin.template:
    src: server.hcl.j2
    dest: "{{ nomad_home }}/server.hcl"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: '0644'
  register: server_config

- name: Install systemd unit
  become: yes
  ansible.builtin.template:
    src: nomad.service.j2
    dest: /etc/systemd/system/nomad.service
    mode: '0644'
  vars:
    nomad_user: "{{ MOP_USER }}"
    nomad_config: "{{ nomad_home }}/server.hcl"
  register: server_unit

- name: Start nomad server
  become: yes
  ansible.builtin.systemd:
    name: nomad
    state: "{{ (server_config.changed or server_unit.changed) | ternary('restarted', 'started') }}"
    enabled: yes
    daemon_reload: yes

# 403 — тоже ответ: ACL включён, значит сервер жив и отвечает.
- name: Wait for the HTTP API
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ MOP_NOMAD_PORT }}/v1/agent/self
    status_code: [200, 403]
  register: api
  until: api.status in [200, 403]
  retries: 15
  delay: 2

# --- ACL bootstrap: один раз, рядом с data_dir ------------------------
# `creates` — это и есть «один раз»: повторный bootstrap Nomad отвергает,
# а файл с токеном перетереть пустым выводом значит потерять доступ к
# кластеру безвозвратно.
- name: Bootstrap ACL (first run only)
  ansible.builtin.shell: >
    /usr/local/bin/nomad acl bootstrap -json
    > {{ nomad_home }}/bootstrap.json
    && chmod 600 {{ nomad_home }}/bootstrap.json
  args:
    creates: "{{ nomad_home }}/bootstrap.json"
  environment:
    NOMAD_ADDR: http://127.0.0.1:{{ MOP_NOMAD_PORT }}

# Сразу в каталог сервера (mop/creds.py): оттуда его читает mop на
# контроллере, и оттуда же `mop join` везёт его оператору. Отдельного
# ~/.config/nomad больше нет: у mop один каталог кредов на сервер.
- name: Fetch the management token to the controller
  ansible.builtin.fetch:
    src: "{{ nomad_home }}/bootstrap.json"
    dest: "{{ lookup('env', 'HOME') }}/.config/mop/servers/{{ MOP_SERVER_LAN }}/bootstrap.json"
    flat: yes
