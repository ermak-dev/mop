# Настройки планировщика Nomad, одна на кластер: играются с сервера.
#
# Жили в роли bus рядом с джобом pu-cleanup (tasks/watchdog.yml), который
# #361 снял: единственный триггер подметания -- таймер mop-doctor (#359).

# Пере-подписка памяти -- настройка планировщика, одна на кластер, и без
# неё Nomad молча игнорирует MemoryMaxMB в спеке папета: бюджет снова
# становится жёстким потолком, а всплеск сборки — OOM'ом. Тихо потерянная
# настройка хуже громкого отказа, поэтому её ставит deploy, а не руки.
#
# cas=ModifyIndex, и остальные поля возвращаются как есть: конфигурация
# планировщика несёт ещё и алгоритм с преемпцией, и запись целиком, «как
# мы думаем правильно», однажды переписала бы чужой выбор.
- name: Enable memory oversubscription in the Nomad scheduler
  ansible.builtin.shell: |
    set -eu
    export NOMAD_ADDR=http://127.0.0.1:{{ MOP_NOMAD_PORT }}
    NOMAD_TOKEN=$(python3 -c "import json; print(json.load(open('{{ nomad_home }}/bootstrap.json'))['SecretID'])")
    export NOMAD_TOKEN
    python3 - <<'PY'
    import json, os, urllib.request
    addr, tok = os.environ["NOMAD_ADDR"], os.environ["NOMAD_TOKEN"]
    h = {"X-Nomad-Token": tok, "Content-Type": "application/json"}
    url = f"{addr}/v1/operator/scheduler/configuration"
    cur = json.load(urllib.request.urlopen(
        urllib.request.Request(url, headers=h), timeout=10))["SchedulerConfig"]
    if cur.get("MemoryOversubscriptionEnabled"):
        print("unchanged")
        raise SystemExit(0)
    body = {k: v for k, v in cur.items() if k not in ("CreateIndex", "ModifyIndex")}
    body["MemoryOversubscriptionEnabled"] = True
    urllib.request.urlopen(urllib.request.Request(
        f"{url}?cas={cur['ModifyIndex']}", data=json.dumps(body).encode(),
        headers=h, method="PUT"), timeout=10)
    print("enabled")
    PY
  register: oversub
  changed_when: "'enabled' in oversub.stdout"

# Переход (#361): живой pu-cleanup и его периодические дети снимаются тем же
# прогоном -- ручного шага на сервере нет. Префикс, а не одно имя: sysbatch-
# ребёнок, застрявший pending на недоступном узле, -- отдельный джоб
# pu-cleanup/periodic-<время>, и именно он с prohibit_overlap клинил
# расписание. Джоба нет -- не ошибка; осталось что-то после purge -- отказ.
- name: Retire the pu-cleanup job and its periodic children
  ansible.builtin.shell: |
    set -eu
    export NOMAD_ADDR=http://127.0.0.1:{{ MOP_NOMAD_PORT }}
    NOMAD_TOKEN=$(python3 -c "import json; print(json.load(open('{{ nomad_home }}/bootstrap.json'))['SecretID'])")
    export NOMAD_TOKEN
    python3 - <<'PY'
    import json, os, urllib.parse, urllib.request
    addr, tok = os.environ["NOMAD_ADDR"], os.environ["NOMAD_TOKEN"]
    h = {"X-Nomad-Token": tok}
    def jobs():
        return [j["ID"] for j in json.load(urllib.request.urlopen(urllib.request.Request(
            f"{addr}/v1/jobs?prefix=pu-cleanup", headers=h), timeout=10))
            if j["ID"] == "pu-cleanup" or j["ID"].startswith("pu-cleanup/")]
    found = jobs()
    for job in found:
        urllib.request.urlopen(urllib.request.Request(
            f"{addr}/v1/job/{urllib.parse.quote(job, safe='')}?purge=true",
            headers=h, method="DELETE"), timeout=10)
    left = jobs()
    if left:
        print(f"left after purge: {left}")
        raise SystemExit(1)
    print(f"purged {len(found)}" if found else "absent")
    PY
  register: cleanup_retired
  changed_when: "'purged' in cleanup_retired.stdout"

- name: No pu-cleanup job spec on the server
  ansible.builtin.file:
    path: "{{ nomad_home }}/pu-cleanup.nomad.hcl"
    state: absent
