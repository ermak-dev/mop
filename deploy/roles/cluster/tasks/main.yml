# Сервис кластера на сервере (#80, mop/server/cluster.py): подписчик, который держит
# токен Nomad и отвечает глаголами пула на шине.
#
# Сервер, а не машина оператора: токен обязан остаться на одной машине, иначе
# смысла в сервисе нет. Идёт после дашборда: пакет mop и креды оператора на
# сервер привозит роль web, и здесь они уже лежат.

# Пакет на сервер привозит роль web -- та же машина, тот же каталог. Второй
# rsync тут ничего не менял бы, а подписчик остался бы на старом коде,
# поэтому перезапуск -- по результату ТОГО синка (как в роли bootstrap).
- name: The package changed under the service
  ansible.builtin.debug:
    msg: "mop package or bus identity changed on the server — restarting mop-cluster"
  # Пакет или идентичность сервера на шине (#104): старое соединение
  # держит прежнего пользователя до рестарта.
  changed_when: (mop_server_package | default({})) is changed or (mop_server_version | default({})) is changed or (mop_server_identity | default({})) is changed
  notify: restart mop-cluster


# Хосты инвентаря (#178): инвентарь лежит у контроллера, куда учётке пула
# хода нет, а forget обязан отказать узлу, который этот же прогон поставил
# бы снова. Список шлёт mop deploy; сервис читает файл на каждый forget.
- name: Hosts of the inventory, for forget
  when: mop_inventory_hosts is defined
  become: yes
  ansible.builtin.copy:
    content: "{{ mop_inventory_hosts | to_json }}\n"
    dest: "{{ MOP_HOME }}/.config/mop/inventory-hosts.json"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0644"

# Просьбы проектов (#197): память папета -- его свойство, и потолок в спеке
# -- MOP_MEM_MB из `.mop` проекта. `.mop` режет deploy на контроллере, а спеку
# строит сервис под учёткой пула; из манифестов сюда едут только просьбы.
# Сервис читает файл на каждую сборку спеки, поэтому правка `.mop` доходит до
# спеки со следующим прогоном deploy, не раньше.
- name: The projects' asks, for the puppet's spec
  when: mop_manifests is defined
  become: yes
  ansible.builtin.copy:
    content: "{ {% for name in mop_manifests | sort %}{{ name | to_json }}: {{ mop_manifests[name].asks | to_json }}{{ '' if loop.last else ', ' }}{% endfor %} }\n"
    dest: "{{ MOP_HOME }}/.config/mop/project-asks.json"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0644"

# Ключ создан lookup('password') у контроллера: прокси (#380) читает тот
# же файл, но стартует после кластера. Раздатчик (#393) читает закрытую
# копию под пользователем пула, а не MOP_PROXY_KEY из открытого юнита.
- name: Private directory for the cluster's proxy key
  become: yes
  ansible.builtin.file:
    path: "{{ MOP_HOME }}/.config/mop/secrets"
    state: directory
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0700"

- name: Installed proxy key for the cluster
  become: yes
  ansible.builtin.copy:
    content: "{{ lookup('password', secrets_dir + '/llm-proxy-client.pass length=32 chars=ascii_letters,digits') }}\n"
    dest: "{{ MOP_HOME }}/.config/mop/secrets/llm-proxy-client.pass"
    owner: "{{ MOP_USER }}"
    group: "{{ MOP_USER }}"
    mode: "0600"
  no_log: true
  notify: restart mop-cluster

- name: Systemd unit
  become: yes
  ansible.builtin.template:
    src: "{{ role_path }}/../common/templates/service.j2"
    dest: /etc/systemd/system/mop-cluster.service
    mode: "0644"
  vars:
    unit:
      name: mop-cluster
      description: "mop-cluster (сервис кластера: Nomad за шиной, глаголы пула на mop.*.cluster.rpc)"
      after: network-online.target nats.service nomad.service
      # Окружение -- config.SERVER_SCOPED (#176); здесь только комментарии к нему.
      notes:
        MOP_SERVER_LAN: |-
          # .env на сервер не едет: что сервису нужно знать об установке, приезжает
          # юнитом. NOMAD_ADDR выводится из MOP_SERVER_LAN и MOP_NOMAD_PORT
          # (config.DERIVED), поэтому своей переменной для него здесь нет.
        MOP_HTTPS_PORT: "# Каталог сервера ходит на шину через TLS-прокси (#97)."
        MOP_NOMAD_PORT: "# Nomad и то, что читает mop/spec.py: спецификацию папета собирает этот сервис (#176)."
      command: cluster serve
  notify: restart mop-cluster

- name: Enable and start
  become: yes
  ansible.builtin.systemd:
    name: mop-cluster
    enabled: yes
    state: started
    daemon_reload: yes

- name: Apply the restart now, before the check
  ansible.builtin.meta: flush_handlers

# Прогоном, а не чтением статуса: юнит в бесконечном реконнекте systemd
# вполне устраивает, а мастер тем временем не получит ни ростера, ни папета.
# Проверка заодно отвечает, видит ли сервис Nomad: адрес у него свой, и
# молчащий Nomad читался бы как молчащий сервис.
- name: The service answers on the bus and sees Nomad
  become: yes
  become_user: "{{ MOP_USER }}"
  ansible.builtin.command: "{{ MOP_HOME }}/mop/bin/mop cluster check"
  environment:
    MOP_SERVER_LAN: "{{ MOP_SERVER_LAN }}"
    MOP_NATS_PORT: "{{ MOP_NATS_PORT }}"
    MOP_HTTPS_PORT: "{{ MOP_HTTPS_PORT }}"
  register: cluster_check
  until: cluster_check.rc == 0
  retries: 10
  delay: 3
  changed_when: false

# Сборщик образов (#123): `mop driver build` за шиной. Под пользователем
# контроллера -- тем, кто сейчас играет этот прогон: у него инвентарь и
# ключи к гипервизорам. Контроллер -- сам сервер, поэтому его дом и имя
# берутся из окружения прогона.
- name: Image builder unit
  become: yes
  ansible.builtin.template:
    src: mop-builder.service.j2
    dest: /etc/systemd/system/mop-builder.service
    mode: "0644"
  vars:
    controller_user: "{{ lookup('env', 'USER') }}"
    controller_home: "{{ lookup('env', 'HOME') }}"
  notify: restart mop-builder

- name: The controller's code changed under the builder
  ansible.builtin.debug:
    msg: "mop package changed on the controller — restarting mop-builder"
  changed_when: (mop_server_version | default({})) is changed
  notify: restart mop-builder

- name: Enable and start the builder
  become: yes
  ansible.builtin.systemd:
    name: mop-builder
    enabled: yes
    state: started
    daemon_reload: yes

