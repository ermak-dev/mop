---
# Кластер Nomad: сервер и клиенты. То, где стоит папет.
#
# Второй слой пула и полностью независимый от первого: Nomad решает
# размещение, память и рестарты, шина (deploy/setup.yml) — разговор. Путать их
# нельзя, и разворачиваются они порознь.
#
# Один сервер на машине, которая включена всегда, клиенты на всех, где живут
# папеты. Клиент дозванивается до сервера на RPC исходящим соединением, поэтому
# ни CGNAT, ни NAT внутри WSL значения не имеют — сервер к клиенту не стучится
# никогда.
#
# ACL включён: без токена API отвечает 403. Bootstrap-токен выпускается один
# раз, лежит рядом с data_dir на сервере и забирается на управляющую машину в
# ~/.config/nomad/bootstrap.json. На узлы пула он не едет.
#
# Запуск:  mop deploy
#
# Симлинк ~/etc/nomad обязателен, как и ~/etc/nats: `net setup <имя>` и
# ~/etc/site.yml находят плейбук по одному лишь пути ~/etc/<имя>/setup.yml,
# таблицы имён нигде нет. Симлинк и есть эта таблица; заводит его `mop deploy`.

- name: Nomad server
  hosts: server
  become: no
  gather_facts: no
  tasks:
    - ansible.builtin.include_role:
        name: nomad
        tasks_from: server


- name: Nomad client on the puppet hosts
  hosts: puppet
  become: yes
  gather_facts: no
  roles:
    - nomad


# Управляющая машина в кластере.
#
# Она не рабочий узел: датацентр здесь `control`, а джобы папетов объявляют
# `home`, так что планировщик папета сюда не поставит. Членство нужно было ради
# `alloc exec` — он ходил только внутрь аллокаций, и без своей аллокации мастер
# был для папета недосягаем. С переездом на шину эта причина отпала, но
# членство оставлено: ростер кластера — единственное место, где мастер видит
# ёмкость узлов, и считать её проще, будучи внутри.
#
# !puppet: обе игры пишут один и тот же /etc/nomad/client.hcl. Машина в двух
# ролях (управляющая И узел пула) обязана получать его от игры пула — иначе
# эта игра, идущая позже, возвращала бы ей `control` после каждого deploy, и
# узел выпадал из датацентра, в который ставятся папеты.
- name: Nomad client on the master
  hosts: master:!puppet
  become: yes
  gather_facts: no
  vars:
    nomad_datacenter: "{{ MOP_CONTROL_DC }}"
  roles:
    - nomad
