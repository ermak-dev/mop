---
# Вся установка mop одним прогоном: `mop deploy` (это ansible-playbook site.yml).
#
# Порядок не случайность, и он же единственное место, где слои склеены:
# пакет mop на узлы привозит последний плейбук, и юнит агента он же запускает
# -- до него запускать нечего. Промежуточные цели из examples/ -- установка
# автора; ссылаемся отсюда, чтобы порядок знал плейбук, а не оболочка.
#
# Один прогон -- один PLAY RECAP: строка на машину, суммирующая все слои.

- import_playbook: deploy/nomad/setup.yml      # ГДЕ стоит слейв
- import_playbook: examples/homelab/setup.yml  # окружение узлов (установка автора)
- import_playbook: examples/homelab/claude.yml # скиллы и MCP (установка автора)
- import_playbook: deploy/setup.yml            # КАК с ним говорить
