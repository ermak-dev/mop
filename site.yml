---
# Вся установка mop одним прогоном: `mop deploy` (это ansible-playbook site.yml).
#
# Порядок не случайность, и он же единственное место, где слои склеены:
# пакет mop на узлы привозит последний плейбук, и юнит агента он же запускает
# -- до него запускать нечего. Общий файл окружения (setup.yaml)
# подключаем отсюда, чтобы порядок знал плейбук, а не оболочка.
#
# Один прогон -- один PLAY RECAP: строка на машину, суммирующая все слои.

- import_playbook: deploy/node.yml             # чем узел обязан быть до всего (в т.ч. git-доступ: MOP_GIT_HOST)
- import_playbook: deploy/pve.yml              # узел, чьи тела — контейнеры
- import_playbook: deploy/body.yml             # чем обязано быть тело папета
- import_playbook: deploy/nomad/setup.yml      # ГДЕ стоит папет
- import_playbook: deploy/setup.yml            # КАК с ним говорить
