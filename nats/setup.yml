# Шина пула mop: сервер NATS и агент на каждом узле.
#
# Заменила собой `alloc exec`. Раньше мастер гонял шелл внутрь аллокации и
# платил websocket-рукопожатием за каждую пробу, а команда ехала в query-строке
# URL и упиралась в 8 КБ, которыми nginx режет URI. Теперь на узле сидит
# подписчик с закрытым набором глаголов (mop/agent.py, субъекты — docs/BUS.md).
#
# ЭТОТ ПЛЕЙБУК -- АВАРИЙНЫЙ ПУТЬ ПУЛА. Дороги на узел мимо шины больше нет, и
# единственное, чем поднимают упавшего агента или чинят креды, -- это он.
# Поэтому он обязан работать на голом ssh и ничего не занимать у самого mop.
#
# Пароли не лежат в репозитории и не задаются руками: lookup('password') заводит
# файл на управляющей машине при первом прогоне и переиспользует дальше.
# Потерять их не страшно -- новый прогон раздаст новые сразу и серверу, и узлам.
#
# Запуск:  net setup nats                        # или:
#          ansible-playbook -i ~/etc/inventory.ini ~/etc/nats/setup.yml
#
# Симлинк ~/etc/nats обязателен, как и ~/etc/nomad: таблицы «имя -> плейбук»
# нигде нет, путь и есть таблица.

# Имя узла в NOMAD и имя хоста в ИНВЕНТАРЕ расходятся: gamer живёт в WSL, и
# ssh-алиас у него свой. Субъект шины строится по имени узла, поэтому оно
# считается один раз здесь и дальше живёт в hostvars -- иначе агент молча
# подпишется не на тот субъект, и узел будет выглядеть выключенным.
- name: Resolve Nomad node names
  hosts: nomad_clients:nomad_control
  gather_facts: no

  tasks:
    - name: Nomad node name for this host
      ansible.builtin.set_fact:
        mop_node: "{{ nomad_node_names[inventory_hostname] | default(inventory_hostname) }}"
      vars:
        nomad_node_names:
          gamer-wsl: gamer

    # КУДА подключаться и ЧЕЙ сертификат ждать -- разные вещи, и здесь это не
    # тонкость. Узлы пула сидят в одной локалке с сервером шины, но публичное
    # имя nomad.ermak.dev резолвится в адрес роутера, а хайрпин на 4222 он не
    # делает: первый же прогон дал connection refused на 79.141.65.134:4222 с
    # обоих узлов. Ходим на LAN-адрес -- тот же, на который Nomad-клиент ходит
    # за RPC, -- а сертификат проверяем по имени, на которое он выписан
    # (nats_cert_host в bus.json). Без этого пришлось бы либо выключать
    # проверку, либо открывать 4222 наружу.
    - name: Bus address on the LAN
      ansible.builtin.set_fact:
        nats_lan: "tls://192.168.1.66:4222"


- name: NATS server for the mop bus
  hosts: git
  become: yes
  gather_facts: no

  vars:
    # Пароли лежат ЗДЕСЬ, на управляющей машине, а не в репозитории; lookup
    # заводит файл при первом обращении и возвращает то же значение дальше.
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    nats_version: "2.14.6"
    nats_tgz: "https://github.com/nats-io/nats-server/releases/download/v{{ nats_version }}/nats-server-v{{ nats_version }}-linux-amd64.tar.gz"
    # Сертификат берём существующий, от vhost'а Nomad, и клиенты ходят на
    # nomad.ermak.dev:4222. Отдельное имя стоило бы записи в DNS и второго
    # certbot'а ради того же самого хоста; порт различает службы не хуже имени.
    nats_cert_host: nomad.ermak.dev
    nats_nodes: "{{ groups['nomad_clients'] | map('extract', hostvars, 'mop_node') | list }}"
    # Шарды считает `mop deploy` из ростера Nomad и своей памяти (см. bin/deploy)
    # и передаёт сюда --extra-vars. Пустой список -- законное состояние пустого
    # пула: сервер поднимется, мастеров просто ещё нет.
    shards: "{{ mop_shards | default([]) }}"

  tasks:
    - name: Unpack nats-server {{ nats_version }}
      ansible.builtin.unarchive:
        src: "{{ nats_tgz }}"
        dest: /tmp
        remote_src: yes
        creates: "/tmp/nats-server-v{{ nats_version }}-linux-amd64/nats-server"

    - name: Install nats-server
      ansible.builtin.copy:
        src: "/tmp/nats-server-v{{ nats_version }}-linux-amd64/nats-server"
        dest: /usr/local/bin/nats-server
        remote_src: yes
        mode: "0755"
      notify: restart nats

    - name: Config dir
      ansible.builtin.file:
        path: /etc/nats
        state: directory
        mode: "0755"

    - name: Server config
      ansible.builtin.template:
        src: nats-server.conf.j2
        dest: /etc/nats/nats-server.conf
        # Пароли внутри: читает только root, под которым служба и ходит.
        mode: "0600"
      notify: restart nats

    - name: Systemd unit
      ansible.builtin.template:
        src: nats.service.j2
        dest: /etc/systemd/system/nats.service
        mode: "0644"
      notify: restart nats

    - name: Enable and start
      ansible.builtin.systemd:
        name: nats
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    - name: restart nats
      ansible.builtin.systemd:
        name: nats
        state: restarted
        daemon_reload: yes


# Агент на рабочих узлах.
#
# Пакет mop возим ЗДЕСЬ, хотя его же возит nomad/claude.yml для MCP-сервера.
# Дубль осознанный: игра, которая запускает агента, обязана привезти его код
# сама. Пока она этого не делала, `mop deploy nats` после правки agent.py
# поднимал на узлах СТАРЫЙ агент -- и первый же прогон это показал: креды в
# bus.json уже несли tls_hostname, а агент рядом о нём не знал и падал на
# проверке сертификата. Аварийный путь, зависящий от соседнего плейбука, --
# не аварийный путь.
- name: mop-agent on the pool nodes
  hosts: nomad_clients
  gather_facts: no

  vars:
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    mop_home: /home/ermak/mop
    nats_addr: "{{ nats_lan }}"
    nats_cert_host: nomad.ermak.dev
    nats_user: "node-{{ mop_node }}"
    nats_password: "{{ lookup('password', secrets_dir + '/nats-node-' + mop_node + '.pass length=32 chars=ascii_letters,digits') }}"
    shards: "{{ mop_shards | default([]) }}"

  tasks:
    - name: Python client for the bus
      ansible.builtin.pip:
        name: nats-py
        extra_args: --user --break-system-packages
        state: present

    - name: Sync the mop package from the control machine
      ansible.posix.synchronize:
        src: "{{ lookup('env', 'HOME') }}/mop/"
        dest: "{{ mop_home }}/"
        delete: yes
        recursive: yes
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
      notify: restart mop-agent

    - name: Credentials dir
      ansible.builtin.file:
        path: /home/ermak/.config/mop
        state: directory
        mode: "0700"

    - name: Bus credentials for the agent
      ansible.builtin.template:
        src: bus.json.j2
        dest: /home/ermak/.config/mop/bus.json
        mode: "0600"
      notify: restart mop-agent

    # Креды на КАЖДЫЙ шард, а не одни на узел. Врапер подсовывает их сессии
    # слейва через MOP_BUS_CONFIG, и без этого слейв ходил бы под кредом агента
    # -- то есть мог бы написать в чужой проект, а агент бы этого не поймал:
    # он видит, кого спрашивают, но не видит, кто спрашивает.
    - name: Bus credentials for the slaves, one per shard
      ansible.builtin.template:
        src: bus.json.j2
        dest: "/home/ermak/.config/mop/bus-{{ item }}.json"
        mode: "0600"
      loop: "{{ shards }}"
      vars:
        nats_user: "slave-{{ item }}"
        nats_password: "{{ lookup('password', secrets_dir + '/nats-slave-' + item + '.pass length=32 chars=ascii_letters,digits') }}"

    # Токен Nomad возили на узлы, чтобы узловой mop mcp дотягивался до соседей
    # и до инбокса мастера, и цена была названа прямо: слейв, добравшийся до
    # файла, мог снести чужие джобы. Шина даёт ту же связь правами по субъектам,
    # поэтому полномочия узлам больше не нужны. Перестать раздавать мало --
    # старая копия так и лежала бы.
    - name: Drop the Nomad management token from the pool
      ansible.builtin.file:
        path: /home/ermak/.config/nomad/bootstrap.json
        state: absent

    - name: Agent unit
      become: yes
      ansible.builtin.template:
        src: mop-agent.service.j2
        dest: /etc/systemd/system/mop-agent.service
        mode: "0644"
      notify: restart mop-agent

    - name: Enable and start the agent
      become: yes
      ansible.builtin.systemd:
        name: mop-agent
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Flush handlers before checking
      ansible.builtin.meta: flush_handlers

    # Прогон плейбука без этой проверки не отличает «юнит запущен» от «агент
    # подписался»: systemd доволен процессом, который упал в реконнект.
    - name: Confirm the agent is connected
      ansible.builtin.command: /usr/bin/python3 -m mop.agent --check
      args:
        chdir: "{{ mop_home }}"
      environment:
        MOP_NODE: "{{ mop_node }}"
      changed_when: false

  handlers:
    - name: restart mop-agent
      become: yes
      ansible.builtin.systemd:
        name: mop-agent
        state: restarted
        daemon_reload: yes


# Управляющая машина: только креды. Агента здесь нет и не нужно -- слейвов на
# ней не живёт, а инбокс мастера слушает сам `mop mcp`.
- name: Bus credentials on the control machine
  hosts: nomad_control
  gather_facts: no

  vars:
    secrets_dir: "{{ lookup('env', 'HOME') }}/.config/mop/secrets"
    nats_addr: "{{ nats_lan }}"
    nats_cert_host: nomad.ermak.dev
    nats_user: admin
    nats_password: "{{ lookup('password', secrets_dir + '/nats-admin.pass length=32 chars=ascii_letters,digits') }}"
    shards: "{{ mop_shards | default([]) }}"

  tasks:
    - name: Python client for the bus
      ansible.builtin.pip:
        name: nats-py
        extra_args: --user --break-system-packages
        state: present

    - name: Credentials dir
      ansible.builtin.file:
        path: /home/ermak/.config/mop
        state: directory
        mode: "0700"

    - name: Operator credentials
      ansible.builtin.template:
        src: bus.json.j2
        dest: /home/ermak/.config/mop/bus.json
        mode: "0600"

    # По креденшлу на шард: их подхватывает `mop master`, и именно они делают
    # мастера слепым к чужим проектам.
    - name: Master credentials, one per shard
      ansible.builtin.template:
        src: bus.json.j2
        dest: "/home/ermak/.config/mop/bus-{{ item }}.json"
        mode: "0600"
      loop: "{{ shards }}"
      vars:
        nats_user: "master-{{ item }}"
        nats_password: "{{ lookup('password', secrets_dir + '/nats-master-' + item + '.pass length=32 chars=ascii_letters,digits') }}"
