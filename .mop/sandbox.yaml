---
# Песочница mop (#61): что проект печёт в образ своего тела. Ресурсы тела —
# в vars (конвенция SHARD_SCOPED), системные пакеты — в tasks (у mop их
# нет). Читается при сборке образа шарда (`mop driver build`) — с дефолтной
# ветки origin, а в рабочей копии без аргумента как лежит: значения впекаются
# в образ, тело наследует их клоном, и на узел не едет ни одного числа. На
# узле, где тело равно узлу, то же играется прогоном deploy.
#
# Просьба, а не приказ: узел подрезает её своим потолком
# (MOP_BODY_*_CAP в его node.env). Порядок целиком: узел > шард > установка.
#
# mop — питон и git, ему не нужно то, на что рассчитана установка: там
# потолок под тяжёлые проекты с rust и постгресом. Того, что нужно на каждом
# старте, у mop тоже нет — bootstrap.yaml не заведён.
- name: What mop bakes into its sandbox
  vars:
    MOP_MEM_MB: "6144"
    MOP_DISK_GB: "40"
    MOP_CORES: "2"
