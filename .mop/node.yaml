---
# ЧТО ПРОЕКТ ПРОСИТ ОТ УЗЛА: ресурсы тел — в vars (та же конвенция
# SHARD_SCOPED). Читается с ДЕФОЛТНОЙ ВЕТКИ при сборке образа шарда
# (`mop driver build`): значения впекаются в ОБРАЗ, тело наследует их
# клоном, и на узел не едет ни одного числа.
#
# Просьба, а не приказ: узел подрезает её своим потолком
# (MOP_BODY_*_CAP в его node.env). Порядок целиком: узел > шард > установка.
#
# mop — питон и git, ему не нужно то, на что рассчитана установка: там
# потолок под тяжёлые проекты с rust и постгресом. Узловых задач у mop нет:
# общее узловое — дело продукта (роль node), своего — не просим.
- name: What mop asks of the node
  vars:
    MOP_PUPPET_MEM_MAX_MB: "6144"
    MOP_PVE_DISK_GB: "40"
    MOP_PVE_CORES: "2"
