soul: builder
version: 1
runtime: {driver: any, receives_dispatch: true}
capabilities:
  # Сборщик (#579): рабочий, который собирает и катит в своей ветке.
  # Управления пулом нет -- ни add, ни update, ни stop: глагола сборки
  # образа у роли нет, admin-сборка молча не достаётся (docs/SOUL.md).
  # Обнаружение адресов (#585) -- чтение СВОЕГО проекта, как у рабочего.
  node_verbs: [send, tail, state, states, ping, local]
  cluster_verbs: [ping, roster, alloc, spec]
  dispatch: false
  spawn: []
prompt: soul.md
