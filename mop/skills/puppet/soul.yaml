soul: puppet
version: 1
runtime: {driver: any, receives_dispatch: true}
capabilities:
  # Рабочий (#579): принимает dispatch, отчитывается, ничего не поднимает
  # и пулом не управляет. Обнаружение адресов (#585) -- чтение СВОЕГО
