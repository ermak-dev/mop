---
# ЕДИНЫЙ МАНИФЕСТ ПРОЕКТА для mop: vars — просьба о размерах тела и своя
# конфигурация, tasks — окружение сверх общего. Читается из HEAD этой
# ветки: при сборке образа шарда (`mop driver build`) и при прогоне
# host-узлов (`mop deploy`); формат оговорён в mop/ — docs/DRIVER.md.
#
# Файл читается с ДЕФОЛТНОЙ ВЕТКИ: зеркало снимается целиком, а версия
# берётся его HEAD. Значения попадают в ОБРАЗ шарда; тело наследует их
# клоном, и на узел не едет ни одного числа.
#
# Просьба, а не приказ: узел подрезает её своим потолком
# (MOP_BODY_*_CAP в его node.env). Порядок целиком: узел > шард > установка.
#
# mop — питон и git, ему не нужно то, на что рассчитана установка: там
# потолок под тяжёлые проекты с rust и постгресом. Задач у него нет:
# окружение исчерпывается общим (setup.yml установки).
- name: What mop's puppet bodies are
  vars:
    MOP_PUPPET_MEM_MAX_MB: "6144"
    MOP_PVE_DISK_GB: "40"
    MOP_PVE_CORES: "2"
