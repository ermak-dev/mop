# Настройки самого ansible — то, что не является ни машиной, ни настройкой
# установки. Раньше их места в проекте не было, и они растеклись: интерпретатор
# в инвентарь, пайплайнинг в личный ~/.ansible.cfg автора. Второе означало, что
# скорость раскатки пула зависит от дотфайла конкретного человека, а свежий
# клон на другой машине молча шёл медленнее.
#
# Находится по ANSIBLE_CONFIG из диспетчера (mop/cli/__init__.py,
# environment): свой ansible.cfg ansible ищет относительно текущего каталога,
# а `mop deploy` и `mop driver build` зовут из любого. Диспетчер ставит
# переменную перед любой командой — одним местом на оба вызова.

[defaults]
# Иначе ansible на каждом хосте и каждом прогоне печатает предупреждение и
# берёт версионный путь (/usr/bin/python3.11), который переживёт не всякое
# обновление дистрибутива. Все машины пула — Debian/Ubuntu, и python3 там есть
# всегда.
interpreter_python = /usr/bin/python3

# Замер времени задач включается настройкой MOP_ANSIBLE_PROFILE, а не этим
# файлом (#103): он нужен при разборе «что дорого в раскатке» (#63) и мешает
# во всех остальных прогонах — хвост занят секундами, а не результатом.
# Безусловной строки здесь больше нет; диспетчер ставит прогону
# ANSIBLE_CALLBACKS_ENABLED, когда настройка непуста. Коллекция ansible.posix
# и так обязательна контроллеру (synchronize в роли bus), новой зависимости
# это не добавляло и не добавляет.

[connection]
# Один ssh-раунд на задачу вместо двух. В site.yml под восемьдесят задач на
# машину, так что это не косметика. Требует, чтобы sudo не просил tty
# (requiretty), — на Debian так по умолчанию.
pipelining = true

[callback_profile_tasks]
task_output_limit = 10
