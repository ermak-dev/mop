<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mop pool</title>
<!--
  Дашборд пула (docs/WEB.md). Одна страница без сборки и без зависимостей:
  в deploy/ нет node-тулчейна, и npm-сборка ради статуса была бы именно им.
  Данные приходят снимком из /events (SSE); отвалился поток — опрос /api/pool.
  Ничего здесь не решается второй раз: корзина папета (kind) и счётчики
  посчитаны в mop/web.py, страница только красит.
-->
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c1f24; --mute: #6b7280;
    --line: #e3e6ea; --accent: #2563eb;
    --free: #15803d; --busy: #b45309; --sick: #b91c1c; --silent: #7c3aed; --down: #6b7280;
    --free-bg: #dcfce7; --busy-bg: #fef3c7; --sick-bg: #fee2e2; --silent-bg: #ede9fe; --down-bg: #e5e7eb;
    --bar: #2563eb; --bar-dim: #bfdbfe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --ink: #e5e7eb; --mute: #9aa3af;
      --line: #2a3038; --accent: #60a5fa;
      --free: #4ade80; --busy: #fbbf24; --sick: #f87171; --silent: #c4b5fd; --down: #9aa3af;
      --free-bg: #14532d; --busy-bg: #78350f; --sick-bg: #7f1d1d; --silent-bg: #4c1d95; --down-bg: #374151;
      --bar: #60a5fa; --bar-dim: #1e3a5f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 600; }
  header .fresh { color: var(--mute); }
  header .fresh.stale { color: var(--sick); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 2px 10px; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip.free { background: var(--free-bg); color: var(--free); }
  .chip.busy { background: var(--busy-bg); color: var(--busy); }
  .chip.sick { background: var(--sick-bg); color: var(--sick); }
  .chip.silent { background: var(--silent-bg); color: var(--silent); }
  .chip.down { background: var(--down-bg); color: var(--down); }
  .chip.total { background: var(--line); color: var(--ink); }
  .errors { background: var(--sick-bg); color: var(--sick); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; white-space: pre-wrap; }
  .errors:empty { display: none; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  section h2 { font-size: 15px; margin: 0 0 8px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
  section h2 small { color: var(--mute); font-weight: 400; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--mute); font-weight: 500; border-top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  td.num, th.num { text-align: right; }
  td.state { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  tr.free td.state { color: var(--free); }
  tr.busy td.state { color: var(--busy); }
  tr.sick td.state { color: var(--sick); font-weight: 600; }
  tr.silent td.state { color: var(--silent); font-weight: 600; }
  tr.down td.state, tr.down td { color: var(--down); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--down); }
  .free .dot { background: var(--free); } .busy .dot { background: var(--busy); }
  .sick .dot { background: var(--sick); } .silent .dot { background: var(--silent); }
  .empty { color: var(--mute); padding: 6px 0; }
  .bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 3px 10px; align-items: center; }
  .bars .d { color: var(--mute); font-variant-numeric: tabular-nums; font-size: 12px; }
  .bars .b { height: 12px; background: var(--bar-dim); border-radius: 3px; overflow: hidden; }
  .bars .b i { display: block; height: 100%; background: var(--bar); }
  .bars .n { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 800px) { .two { grid-template-columns: 1fr; } }
  .journal li { list-style: none; padding: 3px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .journal ul { margin: 0; padding: 0; }
  .journal .t { color: var(--mute); font-variant-numeric: tabular-nums; margin-right: 8px; }
  .journal .e { font-weight: 600; margin-right: 6px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  footer { color: var(--mute); font-size: 12px; text-align: center; padding: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>mop pool</h1>
    <div class="chips" id="chips"></div>
    <div class="fresh" id="fresh">connecting…</div>
  </header>
  <div class="errors" id="errors"></div>

  <section>
    <h2>Nodes <small id="nodes-note"></small></h2>
    <div id="nodes"></div>
  </section>

  <div id="shards"></div>

  <section>
    <h2>Doctor <small id="issues-note"></small></h2>
    <div id="issues"></div>
  </section>

  <div class="two">
    <section>
      <h2>Tokens per day <small id="usage-note"></small></h2>
      <div id="usage"></div>
    </section>
    <section>
      <h2>Top spenders <small>the window, biggest first</small></h2>
      <div id="spenders"></div>
    </section>
  </div>

  <section class="journal">
    <h2>Journal <small>bus events, newest first</small></h2>
    <div id="journal"></div>
  </section>

  <footer>read-only · actions stay with <code>mop</code> · <a href="/api/pool">JSON</a></footer>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const gb = (kb) => kb == null ? "-" : kb >= 1048576 ? (kb / 1048576).toFixed(0) + " GB" : (kb / 1024).toFixed(0) + " MB";
  const human = (n) => { for (const [u, d] of [["G", 1e9], ["M", 1e6], ["k", 1e3]]) if (n >= d) { const v = n / d; return (v < 10 ? v.toFixed(1) : v.toFixed(0)) + u; } return String(n); };
  const hhmm = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "-";
  const KINDS = ["free", "busy", "sick", "silent", "down"];

  let snap = null;

  function table(head, rows, cls) {
    if (!rows.length) return '<div class="empty">nothing here</div>';
    return `<table><thead><tr>${head.map(h => `<th class="${h.startsWith("#") ? "num" : ""}">${esc(h.replace(/^#/, ""))}</th>`).join("")}</tr></thead>`
      + `<tbody>${rows.map(r => `<tr class="${cls ? cls(r) : ""}">${r.cells.map((c, i) => `<td class="${head[i].startsWith("#") ? "num" : ""} ${c.cls || ""}">${c.html ?? esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }

  function render(s) {
    snap = s;
    const c = s.counts;
    $("chips").innerHTML = `<span class="chip total">${c.puppets} puppets</span>`
      + KINDS.map(k => c[k] ? `<span class="chip ${k}">${c[k]} ${k}</span>` : "").join("");
    $("errors").textContent = (s.errors || []).join("\n");

    const nodes = s.nodes || [];
    $("nodes-note").textContent = nodes.length ? `${nodes.length} in the cluster` : "";
    $("nodes").innerHTML = table(["node", "driver", "serves", "state", "#free", "#total", "#slots"],
      nodes.map(n => ({cells: [n.name, n.driver, n.serves, n.state,
        n.free_mb == null ? "-" : (n.free_mb / 1024).toFixed(0) + " GB",
        n.total_mb == null ? "-" : (n.total_mb / 1024).toFixed(0) + " GB",
        n.slots == null ? "-" : String(n.slots)]})),
      (r) => /ready$/.test(r.cells[3]) ? "free" : /draining|closed/.test(r.cells[3]) ? "busy" : "down");

    $("shards").innerHTML = (s.shards || []).map(sh => {
      const cc = sh.counts;
      const note = KINDS.filter(k => cc[k]).map(k => `${cc[k]} ${k}`).join(", ");
      return `<section><h2>${esc(sh.name)} <small>${esc(note)}</small></h2>`
        + table(["puppet", "node", "alloc", "state", "llm", "#disk", "origin"],
          sh.puppets.map(p => ({kind: p.kind, cells: [
            {html: `<span class="dot"></span>${esc(p.name)}`}, p.node, p.alloc_status,
            {html: esc(p.state), cls: "state"}, p.llm, gb(p.disk_kb), {html: `<code>${esc(p.origin)}</code>`}]})),
          (r) => r.kind)
        + `</section>`;
    }).join("") || '<section><div class="empty">no puppets</div></section>';

    const issues = s.issues || [];
    $("issues-note").textContent = issues.length ? `${issues.length} to look at` : "nothing to treat";
    $("issues").innerHTML = table(["puppet", "node", "diagnosis", "treatment"],
      issues.map(i => ({cells: [i.name, i.node, {html: esc(i.diagnosis), cls: "state"},
        i.action ? `mop doctor --fix (${i.action})` : "show only"]})),
      (r) => "sick");

    const days = s.usage || [];
    const peak = Math.max(1, ...days.map(d => d.total));
    const grand = days.reduce((a, d) => a + d.total, 0);
    $("usage-note").textContent = days.length ? `last ${days.length} days, ${human(grand)} total` : "not collected yet";
    $("usage").innerHTML = days.length
      ? `<div class="bars">${days.map(d => `<span class="d">${esc(d.date)}</span><span class="b"><i style="width:${(100 * d.total / peak).toFixed(1)}%"></i></span><span class="n">${d.total ? human(d.total) : "-"}</span>`).join("")}</div>`
      : '<div class="empty">usage arrives after the first scan of the transcripts</div>';

    $("spenders").innerHTML = table(["puppet", "node", "#in", "#out", "#cache-w", "#cache-r", "#total"],
      (s.per_puppet || []).slice(0, 12).map(p => ({cells: [p.name, p.node, human(p.input), human(p.output),
        human(p.cache_write), human(p.cache_read), human(p.total)]})));

    const j = (s.journal || []).slice().reverse();
    $("journal").innerHTML = j.length
      ? `<ul>${j.map(e => `<li><span class="t">${hhmm(e.at)}</span><span class="e">${esc(e.event)}</span>${esc(e.name)} <span class="t">on ${esc(e.node)}, shard ${esc(e.shard)}</span> ${esc(e.text)}</li>`).join("")}</ul>`
      : '<div class="empty">no events yet — the agents publish send, idle, type, wipe and their own start</div>';
    tick();
  }

  // Свежесть считается на странице: снимок несёт время сборки, а не возраст.
  function tick() {
    if (!snap || !snap.at) return;
    const age = Math.max(0, Math.round(Date.now() / 1000 - snap.at));
    const el = $("fresh");
    el.textContent = `updated ${age}s ago`;
    el.classList.toggle("stale", age > 60);
  }
  setInterval(tick, 1000);

  // SSE, а при обрыве — опрос: EventSource сам переподключается, но пока
  // сервер лежит, страница обязана хоть что-то показывать.
  let polling = null;
  function poll() {
    if (polling) return;
    polling = setInterval(() => fetch("/api/pool").then(r => r.json()).then(render).catch(() => {}), 10000);
  }
  function connect() {
    const es = new EventSource("/events");
    es.addEventListener("snapshot", (e) => { render(JSON.parse(e.data)); if (polling) { clearInterval(polling); polling = null; } });
    es.onerror = () => { $("fresh").textContent = "reconnecting…"; poll(); };
  }
  fetch("/api/pool").then(r => r.json()).then(render).catch(() => {});
  connect();
})();
</script>
</body>
</html>
