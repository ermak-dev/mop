components:
  schemas:
    BuildCommand:
      type: object
      properties:
        schema_version:
          type: integer
          default: 1
        epoch:
          type: string
        request_id:
          type: string
        expected_revision:
          type: string
        not_after:
          type: string
        policy_id:
          type: string
        mode:
          $ref: '#/components/schemas/ModeEnum'
        target_nodes:
          type: array
          items:
            type: string
          maxItems: 64
          minItems: 1
        force_safety:
          type: boolean
      required:
      - epoch
      - expected_revision
      - force_safety
      - mode
      - not_after
      - policy_id
      - request_id
      - target_nodes
    Credentials:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        password:
          type: string
          maxLength: 4096
    Error:
      type: object
      description: 'Общий конверт отказа: глобальная форма, не предметный сериализатор.'
      properties:
        schema_version:
          $ref: '#/components/schemas/SchemaVersionEnum'
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
          required:
          - code
          - message
          - retryable
      required:
      - error
      - schema_version
    EventEntity:
      type: object
      properties:
        kind:
          type: string
        id:
          type: string
        incarnation:
          type: string
          nullable: true
        revision:
          type: string
        deleted:
          type: boolean
      required:
      - deleted
      - id
      - incarnation
      - kind
      - revision
    Events:
      type: object
      properties:
        schema_version:
          type: integer
          default: 1
        epoch:
          type: string
        cursor:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionEvent'
        coverage:
          type: array
          items:
            type: string
      required:
      - coverage
      - cursor
      - epoch
      - results
    Health:
      type: object
      properties:
        schema_version:
          type: integer
          default: 1
        state:
          type: string
        identity:
          type: string
        epoch:
