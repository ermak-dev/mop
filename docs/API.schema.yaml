openapi: 3.0.3
info:
  title: mop controller API
  version: '1'
  description: 'Public management contract of the mop controller: commands and queries
    for humans and CI. Machine and private runtime protocols (node executor, credential
    and endpoint machinery) are deliberately not part of this schema; their contract
    is enforced by tests and docs/API.md. Every operation can refuse with the shared
    error envelope: schema_version plus error{code, message, retryable}.'
paths:
  /api/v1/audit:
    get:
      operationId: api_v1_audit_retrieve
      description: Read-only immutable operation audit, authorized before keyset pagination.
        Requires operations.view_audit and current complete project/node/grant scope.
        Coverage is operation_audit, not legacy bus messages. Responses are no-store;
        invalid or stale cursors require a reset (410).
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 4096
        description: Opaque descending keyset cursor; expires after 300 seconds.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: Maximum audit items; the same limit is required on continuation.
      - in: query
        name: project_id
        schema:
          type: string
          format: uuid
        description: Optional explicit project intersection; never adds authority.
      tags:
      - api-v1-audit
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
