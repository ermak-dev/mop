  /api/v1/capabilities:
    get:
      operationId: api_v1_capabilities_retrieve
      description: Current canonical action permissions for one explicit scope. Advisory
        only; commands reauthorize the actual resource. Absent or unknown scope grants
        no actions.
      parameters:
      - in: query
        name: client_id
        schema:
          type: string
        description: explicit owned client UUID
      - in: query
        name: node_id
        schema:
          type: string
        description: explicit node UUID; enrollment and project membership still apply
      - in: query
        name: project_id
        schema:
          type: string
        description: explicit project UUID; absent scope grants no actions
      - in: query
        name: schema_version
        schema:
          type: string
        description: wire version, always 1
      tags:
      - api-v1-capabilities
